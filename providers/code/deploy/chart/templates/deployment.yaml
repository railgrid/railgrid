{{- if not (has .Values.bundleStore.backend (list "file" "s3")) }}
{{- fail (printf "bundleStore.backend must be \"file\" or \"s3\", got %q" .Values.bundleStore.backend) }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (ne .Values.bundleStore.backend "s3") }}
{{- fail "code replicaCount > 1 requires bundleStore.backend=s3: commit bundles and staged snapshots on a per-pod volume are invisible to the leader replica that consumes them" }}
{{- end }}
{{- if and (eq .Values.bundleStore.backend "s3") (or (not .Values.bundleStore.s3.endpoint) (not .Values.bundleStore.s3.bucket)) }}
{{- fail "bundleStore.backend=s3 requires bundleStore.s3.endpoint and bundleStore.s3.bucket" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "code.fullname" . }}
  labels:
    {{- include "code.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "code.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "code.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $metricsAnnotations := include "code.metricsAnnotations" (dict "Values" .Values "portName" "metrics" "port" .Values.metrics.port) }}
      {{- if or $metricsAnnotations .Values.podAnnotations }}
      annotations:
        {{- with $metricsAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "code.serviceAccountName" . }}
      initContainers:
        # Bootstrap the provider workspace (APIResourceSchemas, APIExport,
        # APIExportEndpointSlice, bind grant) using the SAME workspace-admin
        # kubeconfig the serve container runs with. The kubeconfig is minted by
        # the platform admin via /bonkers (admin onboarding) and supplied as the
        # providerKubeconfig Secret. The two declarative objects init applies —
        # the generated APIExport and the APIResourceSchemas it references — are
        # baked into the image at /etc/railgrid/kcp (see Dockerfile) and applied
        # verbatim. Idempotent.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            - name: RAILGRID_KCP_DIR
              value: /etc/railgrid/kcp
            {{- if .Values.catalogEntry.enabled }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it to
            # the hosting cluster. It is rendered into a ConfigMap (mounted below)
            # and init self-registers it into the provider workspace via the
            # provider kubeconfig.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          {{- if .Values.envFromSecret }}
          # Bulk env injection (GitHub OAuth app credentials and other dev
          # secrets) — the containerized equivalent of the host binary
          # sourcing providers/code/.env.
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          {{- end }}
          env:
            - name: RAILGRID_METRICS_LISTEN
              value: {{ if .Values.metrics.enabled }}{{ printf ":%v" .Values.metrics.port | quote }}{{ else }}""{{ end }}
            - name: PORT
              value: "8083"
            - name: RAILGRID_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: RAILGRID_PROVIDER_NAME
              value: "code"
            {{- if .Values.hub.insecure }}
            - name: RAILGRID_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: RAILGRID_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
            # Points the multicluster controller manager at the onboarded
            # provider kubeconfig (mounted below).
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            # Where commit bundles and staged snapshots live (see
            # bundleStore in values.yaml). "s3" is what allows replicaCount > 1.
            - name: CODE_BUNDLE_STORE
              value: {{ .Values.bundleStore.backend | quote }}
            {{- if eq .Values.bundleStore.backend "s3" }}
            - name: CODE_S3_ENDPOINT
              value: {{ .Values.bundleStore.s3.endpoint | quote }}
            - name: CODE_S3_BUCKET
              value: {{ .Values.bundleStore.s3.bucket | quote }}
            {{- with .Values.bundleStore.s3.region }}
            - name: CODE_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bundleStore.s3.prefix }}
            - name: CODE_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            - name: CODE_S3_USE_SSL
              value: {{ .Values.bundleStore.s3.useSSL | quote }}
            {{- if .Values.bundleStore.s3.createBucket }}
            - name: CODE_S3_CREATE_BUCKET
              value: "true"
            {{- end }}
            {{- with .Values.bundleStore.s3.credentialsSecretRef }}
            {{- if .name }}
            - name: CODE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .accessKeyIdKey | quote }}
            - name: CODE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .secretAccessKeyKey | quote }}
            {{- end }}
            {{- end }}
            {{- else }}
            - name: CODE_COMMIT_BUNDLE_DIR
              value: {{ .Values.bundleStore.path | quote }}
            {{- end }}
            {{- if .Values.catalogEntry.enabled }}
            # The same CatalogEntry the init container applies. serve reads it
            # too: spec.export.resources[].verbs and .actions are the
            # declaration of which "<resource>/<verb>" coordinates this provider
            # answers on the path a kcp shard forwards for a custom subresource,
            # so the routes cannot drift from what the APIExport declares.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
            {{- if .Values.tenant.credentialsNamespace }}
            - name: RAILGRID_TENANT_CREDENTIALS_NAMESPACE
              value: {{ .Values.tenant.credentialsNamespace | quote }}
            {{- end }}
            {{- if .Values.githubOAuth.enabled }}
            # GitHub "Connect with GitHub" OAuth flow. When disabled the portal
            # falls back to the pasted-PAT form (see README).
            - name: GITHUB_OAUTH_CLIENT_ID
              value: {{ .Values.githubOAuth.clientId | quote }}
            {{- if .Values.githubOAuth.clientSecretRef.name }}
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubOAuth.clientSecretRef.name }}
                  key: {{ .Values.githubOAuth.clientSecretRef.key }}
            {{- end }}
            - name: GITHUB_OAUTH_REDIRECT_URL
              value: {{ .Values.githubOAuth.redirectURL | quote }}
            {{- if .Values.githubOAuth.portalOrigin }}
            - name: GITHUB_OAUTH_PORTAL_ORIGIN
              value: {{ .Values.githubOAuth.portalOrigin | quote }}
            {{- end }}
            {{- if .Values.githubOAuth.scopes }}
            - name: GITHUB_OAUTH_SCOPES
              value: {{ .Values.githubOAuth.scopes | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
            {{- if eq .Values.bundleStore.backend "file" }}
            - name: commit-bundles
              mountPath: {{ .Values.bundleStore.path | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: railgrid-provider-kubeconfig
          secret:
            # Required input: the workspace-admin kubeconfig minted by the
            # platform admin via /bonkers (admin onboarding). Both the init
            # container and the serve container mount it. The pod waits for the
            # Secret to exist — create it before/at install from the onboard
            # response.
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: railgrid-provider-kubeconfig
        {{- if .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "code.fullname" . }}-catalogentry
        {{- end }}
        {{- if eq .Values.bundleStore.backend "file" }}
        - name: commit-bundles
          {{- if .Values.bundleStore.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.bundleStore.existingClaim | quote }}
          {{- else if or .Values.bundleStore.emptyDir (not .Values.bundleStore.persistence.enabled) }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "code.fullname" . }}-commit-bundles
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
