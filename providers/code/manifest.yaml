# code provider — register with the railgrid hub.
#
# Apply to the kcp workspace where the railgrid.ai APIExport is bound
# (typically root:railgrid:providers when running embedded kcp for development):
#
#   kubectl --kubeconfig kcp-admin.kubeconfig apply -f manifest.yaml
#
# This CatalogEntry registers routing and references apiExport.name. The
# provider's init command creates the APIExport, schemas, endpoint slice, and
# bind grant from deploy/chart/files/schemas: the eight kinds Connection,
# Repository, RepositoryCommit, RepositoryCheckout, RepositoryBuildStatus,
# DeployKey, Collaborator, and Package.
---
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: code
spec:
  displayName: "Code"
  description: "Manage source-code repositories and access across git providers (GitHub)."
  vendor: "railgrid"
  version: "0.1.0"
  category: "Developer"
  iconURL: "/ui/providers/code/icon.svg"
  # Local dev (Tilt / Makefile): the provider binary runs on the host at
  # PORT=8083 — distinct from quickstart (:8081) and infrastructure (:8082).
  # For in-cluster deployment, change to the Service DNS, e.g.
  # http://code.code.svc.cluster.local:8083.
  ui:
    url: "http://localhost:8083"
    indexPath: "/"
    children:
      - displayName: Connections
        builtinRoute: connections
      - displayName: Repositories
        builtinRoute: repositories
      - displayName: Packages
        builtinRoute: packages
  backend:
    url: "http://localhost:8083"
    healthPath: "/readyz"
  apiExport:
    name: "code.providers.railgrid.ai"
    # The controllers read each Connection's PAT Secret AND write the generated
    # DeployKey private-key Secret in the tenant workspace, so the secrets claim
    # needs write verbs (infra only needed read). tenantScoped: true auto-accepts
    # on Enable.
    permissionClaims:
      # Every provider that serves a custom subresource needs this one claim:
      # on the shard-forwarded path there is no caller bearer, so the provider
      # runs a SubjectAccessReview for the stamped caller through its own
      # APIExport virtual workspace, and kcp serves that builtin there only for
      # an export that claims it (hack/verify-provider-contract.mjs
      # subresource-access-claim). Built-in review API: no identityHash, verb
      # create only; tenantScoped because the VW confines each review to the
      # tenant's OWN workspace.
      - group: authorization.k8s.io
        resource: subjectaccessreviews
        verbs: [create]
        tenantScoped: true
      - resource: secrets
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
        # Only Secrets this provider wrote (deploy keys, connection tokens);
        # every writer stamps railgrid.ai/owner=code (docs/provider-connectivity-contract.md
        # §"Label-scoped claims").
        selector:
          matchLabels:
            railgrid.ai/owner: code
  # Lets an organization run this provider in its own cluster
  # (docs/byo-providers.md). Keep manifest.yaml and
  # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
  # one that reaches production.
  selfHosting:
    supported: true
    chart:
      repository: "oci://ghcr.io/railgrid/charts"
      name: "railgrid-code-provider"
    namespace: "railgrid-provider-code"
    releaseName: "code"
    docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/code/deploy/chart/README.md"
  # Two verbs that are NOT actions. stage-snapshot and stage-commit-bundle are
  # served by the same actions handler as the catalogued verbs below, at the
  # same kcp custom-subresource path (/clusters/{id}/apis/code.railgrid.ai/
  # v1alpha1/repositories/{name}/{verb}), but their
  # bodies (a 25 MiB git bundle, a 48 MiB source tree) cannot be described under
  # limits.maxInputBytes, which the CatalogEntry API caps at 1 MiB — so they are
  # deliberately absent from spec.actions (docs/provider-actions.md,
  # "Uncatalogued large-upload verbs").
  #
  # Absent from spec.actions is not the same as absent from the CatalogEntry.
  # The hub's identity policy (pkg/hub/identity/policy.go, clause C) mints
  # `create` on {resource}/{verb} only for a coordinate the owning provider
  # DECLARES — as an action OR as a data-plane verb. Undeclared, these two were
  # ungrantable: no consumer identity (an App Studio project, a factory runner)
  # could ever be given them, so only a caller whose workspace RBAC already
  # allowed them could stage an upload at all. Declaring them grants nothing and
  # serves nothing; it makes the coordinate machine-readable so it CAN be
  # granted. kcp authorizes the coordinate and actions/server.go gates on
  # visibility exactly as for a catalogued action.
  dataPlane:
    verbs:
      - resource: repositories
        verb: stage-snapshot
        description: "Stage a git bundle and return the opaque bundleRef that the catalogued prepare-snapshot and publish-snapshot then name. Uncatalogued large upload; input is not schema-declared, see docs/provider-actions.md §Uncatalogued large-upload verbs."
        stream: false
        readOnly: false
      - resource: repositories
        verb: stage-commit-bundle
        description: "Stage a source tree and return the bundleRef/bundleDigest pair the catalogued commit names instead of inline files. Uncatalogued large upload; input is not schema-declared, see docs/provider-actions.md §Uncatalogued large-upload verbs."
        stream: false
        readOnly: false
  # Fifteen catalogued actions: fourteen bound to a Repository and one
  # (mint-registry-token) to a Connection. The provider also serves two
  # deliberately uncatalogued verbs at the same path shape, stage-snapshot and
  # stage-commit-bundle: their bodies (a 25 MiB git bundle, a 48 MiB source
  # tree) cannot be declared under limits.maxInputBytes, which the CatalogEntry
  # API caps at 1 MiB. See docs/provider-actions.md, "Uncatalogued large-upload
  # verbs" — keep this list and the served set in actions/server.go together.
  # Both of those verbs ARE declared, as data-plane verbs above, so their
  # {resource}/{verb} coordinate stays grantable.
  actions:
  - id: branches/v1
    displayName: List branches
    description: List a bounded page of branch names from a registered repository. Uses
      caller authorization and pinned resource identities.
    boundResource:
      apiVersion: code.railgrid.ai/v1alpha1
      kind: Repository
      resource: repositories
    inputSchema:
      type: object
      required:
      - repositoryUID
      - connectionUID
      - repository
      properties:
        repositoryUID:
          type: string
          minLength: 1
          maxLength: 253
        connectionUID:
          type: string
          minLength: 1
          maxLength: 253
        repository:
          type: string
          minLength: 3
          maxLength: 201
        page:
          type: integer
          minimum: 1
          maximum: 10000
      additionalProperties: false
    outputSchema:
      type: object
      required:
      - branches
      - nextPage
      properties:
        branches:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 255
        nextPage:
          type: integer
          minimum: 0
          maximum: 10000
      additionalProperties: false
    executionMode: sync
    readOnly: true
    risk: low
    idempotency: inherent
    limits:
      timeoutSeconds: 180
      maxInputBytes: 65536
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
    schemaDigest: sha256:83cae0fe851319cfc23544f9c6d202a4355e0878fa18e990bebfad2786d7bfe2
  - id: branch-head/v1
    displayName: Branch head
    description: Use the registered Repository and pinned resource identities. Returns
      current host state.
    boundResource:
      apiVersion: code.railgrid.ai/v1alpha1
      kind: Repository
      resource: repositories
    inputSchema:
      type: object
      required:
      - repositoryUID
      - connectionUID
      - branch
      - repository
      properties:
        repositoryUID: &id001
          type: string
          minLength: 1
          maxLength: 253
        connectionUID: *id001
        branch: &id002
          type: string
          minLength: 1
          maxLength: 255
        repository:
          type: string
          minLength: 3
          maxLength: 201
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    schemaDigest: sha256:8768bfafae9fb0ef9328ee46a55eeda45558c3ccf66661841990dddb706b74f7
    executionMode: sync
    readOnly: true
    risk: low
    idempotency: inherent
    limits:
      timeoutSeconds: 180
      maxInputBytes: 65536
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
  - id: find-pull-request/v1
    displayName: Find pull request
    description: Use the registered Repository and pinned resource identities. Returns
      current host state.
    boundResource:
      apiVersion: code.railgrid.ai/v1alpha1
      kind: Repository
      resource: repositories
    inputSchema:
      type: object
      required:
      - repositoryUID
      - connectionUID
      - head
      - base
      - commit
      - repository
      properties:
        repositoryUID: *id001
        connectionUID: *id001
