  # The one Connection-bound action. It exists so a consumer that needs to pull
  # an image built from a tenant's repository never has to read this
  # provider's Connection Secret to get a credential — see
  # tenant/registry_token.go and docs/code-provider-architecture.md.
  - id: commit/v1
    displayName: Commit files
    description: Write and delete files in a managed Repository. The provider stores
      the source bundle and creates a RepositoryCommit; the result names that
      object, which the caller watches for the landed commit. Files over the
      1 MiB input ceiling are uploaded with stage-commit-bundle and named here
      as bundleRef.
    boundResource:
      apiVersion: code.railgrid.ai/v1alpha1
      kind: Repository
      resource: repositories
    inputSchema:
      type: object
      required:
      - repositoryUID
      properties:
        repositoryUID:
          type: string
          minLength: 1
          maxLength: 253
        message:
          type: string
          maxLength: 512
        branch:
          type: string
          maxLength: 255
        files:
          type: array
          maxItems: 500
          items:
            type: object
            required:
            - path
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 1024
              content:
                type: string
              encoding:
                type: string
                enum:
                - utf-8
                - base64
              delete:
                type: boolean
            additionalProperties: false
        bundleRef:
          type: string
          maxLength: 253
        bundleDigest:
          type: string
          maxLength: 96
      additionalProperties: false
    outputSchema:
      type: object
      required:
      - commit
      properties:
        commit:
          type: object
          required:
          - name
          - uid
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 253
            uid:
              type: string
              minLength: 1
              maxLength: 253
          additionalProperties: false
      additionalProperties: false
    schemaDigest: sha256:7ee0cdf571702b8014a79bd01a8de43b3950de1fc36e45aed6b1ea0eb5ab77f1
    executionMode: async
    readOnly: false
    risk: high
    idempotency: none
    limits:
      timeoutSeconds: 180
      maxInputBytes: 1048576
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
  - id: mint-registry-token/v1
    displayName: Mint a registry pull token
    description: Issue a short-lived image-pull credential for the connection's
      container registry. For a GitHub App connection the token is issued with
      packages:read alone; the connection's own credential is never returned.
    boundResource:
      apiVersion: code.railgrid.ai/v1alpha1
      kind: Connection
      resource: connections
    inputSchema:
      type: object
      required:
      - connectionUID
      properties:
        connectionUID:
          type: string
          minLength: 1
          maxLength: 253
      additionalProperties: false
    outputSchema:
      type: object
      required:
      - registry
      - username
      - token
      - scoped
      properties:
        registry:
          type: string
          minLength: 1
          maxLength: 253
        username:
          type: string
          minLength: 1
          maxLength: 253
        token:
          type: string
          minLength: 1
          maxLength: 8192
        expiresAt:
          type: string
          minLength: 20
          maxLength: 40
        scoped:
          type: boolean
      additionalProperties: false
    schemaDigest: sha256:3441d195d8221919653e0933ccd619714e5902f5830e40012de54e1e8968914f
    executionMode: sync
    # readOnly: it mints a credential but changes nothing about the
    # Connection, the repository or the registry.
    readOnly: true
    risk: medium
    idempotency: inherent
    limits:
      timeoutSeconds: 180
      maxInputBytes: 65536
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
  - id: mint-clone-token/v1
    displayName: Mint a repository clone token
    description: Issue a short-lived, read-only git clone credential for this repository.
      For a GitHub App connection the token is issued with contents:read alone; the
      connection's own push-capable credential is never returned.
    boundResource:
      apiVersion: code.railgrid.ai/v1alpha1
      kind: Repository
      resource: repositories
    inputSchema:
      type: object
      required:
      - repositoryUID
      - connectionUID
      properties:
        repositoryUID:
          type: string
          minLength: 1
          maxLength: 253
        connectionUID:
          type: string
          minLength: 1
          maxLength: 253
      additionalProperties: false
    outputSchema:
      type: object
      required:
      - remoteURL
      - username
      - token
      - scoped
      properties:
        remoteURL:
          type: string
          minLength: 1
          maxLength: 2048
        username:
          type: string
          minLength: 1
          maxLength: 253
        token:
          type: string
          maxLength: 8192
        expiresAt:
          type: string
          minLength: 20
          maxLength: 40
        scoped:
          type: boolean
      additionalProperties: false
    schemaDigest: sha256:f9ec0b094856e193b2f3fc96aa84b162f3b8dde33aa76c3cd073492dd0689b18
    executionMode: sync
    # readOnly: it mints a credential but changes nothing about the Repository,
    # the Connection or the git host.
    readOnly: true
    risk: medium
    idempotency: inherent
    limits:
      timeoutSeconds: 180
      maxInputBytes: 65536
      maxOutputBytes: 524288
      maxResultItems: 50
    consent:
      required: false
