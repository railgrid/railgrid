<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-labelledby="t d">
<title id="t">The kcp workspace tree</title>
<desc id="d">root:railgrid holds three branches. system holds controllers (the platform APIExports), providers (the catalog), tenants (users, organizations, memberships) and one workspace per system service. providers holds one workspace per platform provider. tenants holds one workspace per organization, each with its team workspaces and a providers branch for providers the organization runs itself.</desc>
