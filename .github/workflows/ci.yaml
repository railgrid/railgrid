name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR validation only; publishing runs have unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shape of a run, and why. Every job is billed in whole minutes and queued
# against the plan's concurrency cap, so the small checks live in ONE
# `contracts` job rather than one job each, and nothing here installs a
# toolchain twice. Go jobs go through .github/actions/setup-go-cache: one
# shared module cache for every module in the repo plus a build-cache scope
# per kind of compile, written only from main. There is no disk-cleanup step:
# ubuntu-latest runners report ~86 GB free and the old `rm -rf` of unused SDKs
# cost ~2 minutes in every one of 22 jobs. hack/ci/README.md has the selection
# modes (full / provider-ui / docs) that `changes` computes.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      providers: ${{ steps.changes.outputs.providers }}
      portal-matrix: ${{ steps.changes.outputs.portal-matrix }}
      image-matrix: ${{ steps.changes.outputs.image-matrix }}
      has-images: ${{ steps.changes.outputs.has-images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-changes
        id: changes

  # Compiles the CLI + hub and, on main, is the one job that writes the shared
  # module cache (after `go mod download` in every module, so the provider
  # test jobs hit it too) and the `build` build-cache scope.
  build:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-go-cache
      with:
        build-scope: build
        save-mod: 'true'
        save-build: 'true'
    - name: Download modules for every Go module in the repo
      run: |
        for dir in . provider-sdk providers/*/ providers/infrastructure/dev-agent; do
          [ -f "$dir/go.mod" ] || continue
          (cd "$dir" && go mod download)
        done
    - name: Build
      run: make build

  # Every Go module in the repo gets its own vet + race-test run. provider-sdk
  # and each provider under providers/ are standalone modules (AGENTS.md §2), so
  # the root `make test` never saw them — security fixes landing in
  # providers/edges, providers/agents or pkg/agent need this gate.
  #
  # No go.work is needed: every provider go.mod carries
  # `replace github.com/railgrid/provider-sdk => ../../provider-sdk`, so the
  # in-tree SDK is what gets linked. When hack/provider-sdk-cutover.sh drops
  # that replace, copy the "Set up Go workspace" step from e2e.yaml into this
  # job, or it will silently test the published SDK instead of the diff.
  #
  # All entries share the `race` build-cache scope, which the root module saves
  # on main: it compiles most of what the providers import, so the provider
  # jobs restore it read-only and compile only their own packages.
  test-modules:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: ., race: -race }
          - { module: provider-sdk, race: -race }
          - { module: providers/agents, race: -race }
          - { module: providers/app-studio, race: -race }
          - { module: providers/code, race: -race }
          # edges: TestSSHSessionTeardown races on its own `serverConn`
          # (internal/ssh/ssh_teardown_test.go:175 vs :191, a test-only bug).
          # Re-enable -race once that test synchronises the handler write.
          - { module: providers/edges, race: "" }
          - { module: providers/infrastructure, race: -race }
          # Nested module: the parent provider suite does not include it.
          - { module: providers/infrastructure/dev-agent, race: -race }
          - { module: providers/kuery, race: -race }
          - { module: providers/quickstart, race: -race }
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-go-cache
      with:
        build-scope: race
        save-build: ${{ matrix.module == '.' }}

    # Provider binaries `//go:embed all:portal/dist`. The portal is a separate
    # npm project built by the provider-portals job and the image build, so
    # give the embed a target here instead of building every portal twice —
    # `all:` accepts a lone dotfile, an empty directory is a compile error.
    - name: Stub portal/dist for go:embed
      if: startsWith(matrix.module, 'providers/') && matrix.module != 'providers/infrastructure/dev-agent'
      working-directory: ${{ matrix.module }}
      run: mkdir -p portal/dist && touch portal/dist/.gitkeep

    # The root module's govet runs inside `make lint` (golangci-lint); the
    # standalone modules are not linted in CI, so vet is their static check.
    - name: Vet
      if: matrix.module != '.'
      working-directory: ${{ matrix.module }}
      run: go vet ./...

    - name: Test
      working-directory: ${{ matrix.module }}
      run: |
        if [ "${{ matrix.module }}" = "." ]; then
          # Same package set as `make test`: everything except test/e2e.
          go test ${{ matrix.race }} -count=1 $(go list ./... | grep -v '/test/e2e')
        else
          go test ${{ matrix.race }} -count=1 ./...
        fi

  # The ordinary App Studio module matrix runs its complete API/store suite
  # under -race. This scoped job reruns the store suite against real PostgreSQL
  # so its migration and concurrency tests do not skip their external-DSN paths.
  test-app-studio-postgres:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: Test (app-studio PostgreSQL store)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_STUDIO_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/app_studio_test?sslmode=disable
    defaults:
      run:
        working-directory: providers/app-studio
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-cache
        with:
          go-version-file: providers/app-studio/go.mod
          build-scope: race
      - name: Test PostgreSQL store under the race detector
        run: go test -race -count=1 ./store

  # golangci-lint type-checks through the same compiled packages `make build`
  # produces, so it restores the `build` scope; its own analysis cache is what
  # makes a warm lint incremental, and this job is the one that saves it.
  lint:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-go-cache
      with:
        build-scope: lint
        save-build: 'true'
        extra-build-paths: ~/.cache/golangci-lint
    - name: Lint
      run: make lint
    - name: Stub App Studio portal for Go embed
      run: mkdir -p providers/app-studio/portal/dist && touch providers/app-studio/portal/dist/.gitkeep
    - name: Lint App Studio harness and development runtime
      run: make lint-app-studio-harness

  verify-codegen:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-go-cache
      with:
        build-scope: build
    - name: Verify codegen
      run: make verify-codegen

  # Every cheap repository contract in one job, on every PR regardless of
  # selection mode: each of these used to be its own job and cost a billed
  # minute for a few seconds of work. Order: the checks that need nothing but
  # the checkout first, then the node, python, Go-tool and Helm ones.
  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Verify boilerplate
      run: make verify-boilerplate
    - name: Verify design-document metadata
      run: make verify-design-docs
    - name: Verify Tilt browser deployment wiring
      run: make verify-tilt-browser-deployment

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: portal/package-lock.json
    - name: Install root portal dependencies
      working-directory: portal
      run: npm ci --include=dev --no-audit --no-fund
    - name: Verify portalkit sync and conformance
      run: make verify-portalkit
    - name: Verify provider UI conformance
      run: make verify-ui-conformance
    - name: Verify provider manifests, claims and route classes
      run: make verify-provider-contract
    - name: Test Actions Node SDK package and clean alias install
      working-directory: provider-sdk/actions-node
      run: npm test && npm run test:install

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test harness evidence and host retention
      run: make test-app-studio-harness-scripts
    - name: Verify Tilt harness wiring
      run: |
        make test-tilt-checkout
        make test-tilt-app-studio-sequence
        python3 hack/scripts/verify-tilt-sandbox-default.test.py
    - name: Install CI contract test dependency
      run: python3 -m pip install -r hack/ci/requirements-test.txt
    - name: Test CI selection and completion contracts
      run: make verify-ci-selection

    # actionlint is a pinned Go tool (hack/tools); no repo module is compiled.
    - uses: ./.github/actions/setup-go-cache
      with:
        cache: 'false'
    - name: Lint workflow syntax
      run: make verify-workflows

    # Chart validation moved here from the Helm workflow, which now runs only
    # where it publishes (push to main and v* tags).
    - name: Install Helm
      uses: azure/setup-helm@v4
    - name: Lint Helm charts
      run: make verify-charts

  # The root portal is a separate npm project from the standalone provider
  # portals below. Its production build runs vue-tsc first, so this single job
  # covers both the root typecheck and the generated Vite bundle.
  portal:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: Root portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install root portal dependencies
        run: npm ci --no-audit --no-fund

      - name: Test root portal
        run: npm test

      - name: Build root portal
        run: npm run build

  # Standalone provider portals are separate npm projects and are not covered
  # by the root Go test target. Providers with a prebuild hook already run
  # their test/typecheck contract as part of `npm run build`, so those matrix
  # entries skip duplicate invocations below. In provider-ui mode this is the
  # matrix of affected portals; in full mode all of them; docs-only PRs skip it.
  provider-portals:
    needs: changes
    if: needs.changes.outputs.mode != 'docs'
    name: Provider portal (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.portal-matrix) }}
    defaults:
      run:
        working-directory: providers/${{ matrix.provider }}/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: providers/${{ matrix.provider }}/portal/package-lock.json

      - name: Install portal dependencies
        run: npm ci --no-audit --no-fund

      - name: Test portal
        if: matrix.test
        run: npm test

      - name: Typecheck portal
        if: matrix.typecheck
        run: npm run typecheck

      - name: Build portal
        run: npm run build

  result:
    name: CI result
    if: always()
    needs: [changes, build, contracts, lint, portal, provider-portals, test-app-studio-postgres, test-modules, verify-codegen]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 hack/ci/result.py ci
