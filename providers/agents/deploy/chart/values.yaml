nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/railgrid/railgrid-agents-provider
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8087

# When true, the chart renders the CatalogEntry (which registers the provider
# with the hub) into a ConfigMap that the init container applies into the
# provider workspace via the provider kubeconfig. The CatalogEntry is a kcp
# resource, so it is NOT applied to the hosting cluster this chart installs into.
catalogEntry:
  enabled: true
  renderAsConfigMap: true
  uiURL: ""
  backendURL: ""

# Secret holding the workspace-admin kubeconfig minted by the platform admin
# via /bonkers (admin onboarding). Consumed by both the init container and the
# serve container. Key must be "kubeconfig".
providerKubeconfig:
  secretName: railgrid-provider-kubeconfig

# Durable store. Postgres is the agents provider's only hard dependency beyond
# the hub; inMemoryStore is an explicit non-durable fallback for dev only.
store:
  databaseURL: ""
  databaseURLSecretRef:
    name: ""
    key: database-url
  inMemoryStore: false
  # Message and memory content is stored in plaintext in Postgres. Encryption
  # at rest is the database's responsibility (use encrypted volumes or a
  # managed Postgres with encryption enabled). Application-level encryption is
  # planned but not implemented.

# Event triggers and the webhooks they route from. deliveryRetention is the
# default for how many recent inbound deliveries the provider keeps per
# Webhook — with what each routed trigger made of them — for the portal's
# delivery sink and filter tester. A Webhook's own spec.deliveryRetention
# overrides it (0 keeps nothing); 1000 is the ceiling.
triggers:
  deliveryRetention: 200

# MCP Apps are executable HTML. The exact provider/resource digest must be
# explicitly reviewed and pinned; an empty map disables hosted Apps.
mcpApps:
  approvedDigests: {}

hub:
  url: "http://railgrid-hub.railgrid.svc.cluster.local:8080"
  insecure: false
  tokenSecretRef:
    name: ""
    key: token

# Optional Secret whose keys are injected wholesale as environment variables
# (LLM/channel credentials) — the containerized equivalent of sourcing .env.
envFromSecret: ""

podLabels: {}
podAnnotations: {}
podSecurityContext:
  fsGroup: 65532
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
