{{- if and (gt (int .Values.replicaCount) 1) (ne .Values.store.driver "postgres") }}
{{- fail "kuery replicaCount > 1 requires store.driver=postgres: with per-pod SQLite each replica syncs into (and answers from) a different database" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuery.fullname" . }}
  labels:
    {{- include "kuery.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kuery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuery.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kuery.serviceAccountName" . }}
      initContainers:
        # Bootstrap the provider workspace (schemas, APIExport, slice, bind
        # grant) with the onboarded workspace-admin kubeconfig. The generated
        # APIExport and its schemas are baked at /etc/railgrid/kcp (Dockerfile)
        # and applied verbatim. No identity hashes: kuery claims no
        # first-party resources — edge discovery acts
        # as a per-workspace ServiceAccount through each tenant's own edges
        # binding.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            - name: RAILGRID_KCP_DIR
              value: /etc/railgrid/kcp
            {{- if .Values.catalogEntry.enabled }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it to
            # the hosting cluster. It is rendered into a ConfigMap (mounted below)
            # and init self-registers it into the provider workspace via the
            # provider kubeconfig.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          # Liveness is deliberately NOT /readyz: a provider that cannot reach
          # its virtual workspace is still serving queries from the store and
          # still holding its engagements, so restarting it would take away the
          # work it is still doing.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: "8081"
            - name: RAILGRID_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: RAILGRID_PROVIDER_NAME
              value: "kuery"
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            - name: KUERY_STORE_DRIVER
              value: {{ .Values.store.driver | quote }}
            - name: KUERY_STORE_DSN
              value: {{ .Values.store.dsn | quote }}
            {{- if .Values.sync.whitelist }}
            - name: KUERY_SYNC_WHITELIST
              # Collapse the folded-block whitespace into the clean
              # comma-separated form the binary parses.
              value: {{ .Values.sync.whitelist | replace " " "" | replace "\n" "" | quote }}
            {{- end }}
            {{- if .Values.sync.blacklist }}
            - name: KUERY_SYNC_BLACKLIST
              value: {{ .Values.sync.blacklist | quote }}
            {{- end }}
            {{- if .Values.hub.insecure }}
            - name: RAILGRID_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: RAILGRID_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
          volumeMounts:
            # The onboarded workspace-admin kubeconfig; the SA token inside is
            # what the Enable-time edges-proxy grant authorizes for background
            # edge sync.
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            - name: store
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Required input: the workspace-admin kubeconfig minted via /bonkers
        # (admin onboarding), consumed by both init and serve. The onboard
        # response stores it under key "kubeconfig".
        - name: railgrid-provider-kubeconfig
          secret:
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: railgrid-provider-kubeconfig
        {{- if .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "kuery.fullname" . }}-catalogentry
        {{- end }}
        - name: store
          {{- if .Values.store.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kuery.fullname" . }}-store
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
