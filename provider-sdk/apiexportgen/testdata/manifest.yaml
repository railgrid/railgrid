# A comment block the parser has to skip, mentioning kind: CatalogEntry.
---
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: fixture
spec:
  displayName: "Fixture"
  apiExport:
    name: "fixture.providers.railgrid.ai"
    permissionClaims:
      - resource: secrets
        verbs: [get, list, watch]
        tenantScoped: true
      - group: ""
        resource: serviceaccounts
        verbs: ["get", "create"]
        tenantScoped: true
      - group: rbac.authorization.k8s.io
        resource: clusterroles
        verbs: [get, create]
        tenantScoped: true
  # spec.dependencies[].composes[] is what the generator always turns into
  # identityHash-less permission claims. The second dependency repeats the
  # clusterroles claim declared above, with a wider verb set, so the merge's
  # duplicate rule (manifest wins, nothing appended) is exercised by a fixture
  # rather than only by a hand-built input.
  dependencies:
    - name: edges
      composes:
        - group: edges.railgrid.ai
          resource: kubernetesclusters
          verbs: [get, list, watch]
    - name: rbac-lookalike
      composes:
        - group: rbac.authorization.k8s.io
          resource: clusterroles
          verbs: [get, create, delete]
