{{- define "agents.catalogEntry" -}}
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: agents
  annotations:
    providers.railgrid.ai/builtin: "false"
spec:
  displayName: "Agents"
  description: "Long-running personal AI agents: chat, scheduled runs, tools, and durable memory."
  vendor: "railgrid"
  version: {{ .Chart.AppVersion | quote }}
  category: "AI"
  iconURL: "/ui/providers/agents/icon.svg"
  # infrastructure is an OPTIONAL runtime dependency (file workspace, claude-code
  # runner) discovered at runtime, not a hard dependency — so it is intentionally
  # not listed here. The provider is fully functional against a bare hub.
  ui:
    url: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "agents.fullname" .) .Release.Namespace .Values.service.port) .Values.catalogEntry.uiURL | quote }}
    indexPath: "/"
    # Sub-nav entries shown indented under "Agents" in the portal side menu.
    # The portal composes each child URL as /providers/agents/{builtinRoute}
    # and pushes the trailing segment back as railgridContext.subPath; the
    # micro-frontend maps it onto its own route in portal/src/router.ts
    # (routeForSubPath). Every builtinRoute here MUST name a real top-level
    # route in that file — an entry with no route renders a sidebar item that
    # lands on a blank page.
    #
    # Schedules and triggers are deliberately absent: they are edited on an
    # agent's Automation tab, not as a workspace-level collection, so there is
    # no route to point at.
    children:
      - displayName: Agents
        builtinRoute: agents
      - displayName: Activity
        builtinRoute: activity
      - displayName: Connections
        builtinRoute: connections
  backend:
    # The hub backend proxy forwards /services/providers/agents/* here,
    # injecting the verified X-Railgrid-Tenant/X-Railgrid-User headers and the
    # caller's bearer token. The provider serves /api/* + /healthz.
    url: {{ default (printf "http://%s.%s.svc.cluster.local:%v" (include "agents.fullname" .) .Release.Namespace .Values.service.port) .Values.catalogEntry.backendURL | quote }}
    healthPath: "/healthz"
  # Reference-only: the APIExport, schemas, slice, and bind grant are created by
  # this chart's init container (provider `init`, via the railgrid-provider-sdk).
  apiExport:
    name: "agents.railgrid.ai"
    permissionClaims:
      # Secrets, and ONLY the ones labelled railgrid.ai/owner: agents. Three
      # names, all under this provider's own prefixes in the tenant workspace:
      #
      #   railgrid-agents-model-<name>   the LLM credential. Written by the
      #                                  tenant (this provider's portal, or its
      #                                  own settings API, both AS THE CALLER)
      #                                  and read by the provider, including on
      #                                  unattended runs where there is no
      #                                  caller to borrow — so it stays inside
      #                                  the claim, and every writer stamps the
      #                                  owner label (portal/src/resources.ts,
      #                                  api/settings.go). The model-test and
      #                                  model-discover verbs read it as the
      #                                  caller and need no claim at all.
      #   railgrid-agents-conn-<name>    one per Connection. PROVIDER-WRITTEN:
      #                                  the OAuth callback stores the access and
      #                                  refresh tokens here (api/oauth.go), and
      #                                  the Connection reconciler generates the
      #                                  Telegram secret_token / Slack signing
      #                                  secret that make an inbound webhook
      #                                  verifiable.
      #   railgrid-agents-llm            the legacy single-credential Secret,
      #                                  read for workspaces that predate
      #                                  per-name credentials. A workspace still
      #                                  on it must label it to keep it visible.
      #
      # kcp claims are per resource, not per name, so the label is what stands
      # in for the name prefixes above: without the selector this claim is
      # read-write on EVERY Secret in EVERY workspace that enables this
      # provider, which is the side-door docs/cross-provider-simplification.md
      # X-4 closes. kcp stamps the label on anything this provider writes
      # through the export and hides anything that does not carry it.
      - resource: secrets
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
        selector:
          matchLabels:
            railgrid.ai/owner: agents
  # Data-plane verbs this provider serves, declared so the coordinate is
  # machine-readable. Declaring one grants and serves nothing: every call is
  # still authorized by this provider's own caller-scoped SSAR on
  # {resource}/{verb}. What the declaration buys is that the hub
  # scoped-identity service can mint a capability for a verb it can verify
  # exists (pkg/hub/identity/policy.go clause C), instead of consumers
  # hardcoding a coordinate nobody validates.
  dataPlane:
    verbs:
      - resource: agents
        verb: chat
        description: "Hold an interactive conversation with the agent."
        stream: true
      - resource: agents
        verb: run
        description: "Start an unattended run of the agent."
      - resource: agents
        verb: sessions
        description: "List the agent's chat sessions."
        readOnly: true
      - resource: agents
        verb: session
        description: "Delete one chat session's transcript."
      - resource: agents
        verb: messages
        description: "Read one chat session's transcript."
        readOnly: true
      - resource: agents
        verb: usage
        description: "Read the agent's cost, token and latency rollups."
        readOnly: true
      - resource: agents
        verb: inbox
        description: "List the agent's pending approvals and questions."
        readOnly: true
      - resource: agents
        verb: inbox-resolve
        description: "Approve, deny or answer one of the agent's inbox items."
      - resource: agents
        verb: events
        description: "Follow the agent's run and inbox activity as it happens."
        stream: true
        readOnly: true
      - resource: agents
        verb: model-test
        description: "Probe a model credential the agent uses with a real request."
      - resource: agents
        verb: model-discover
        description: "List the model ids a model credential's endpoint serves."
        readOnly: true
      - resource: runs
        verb: trace
        description: "Read one run's step-level tool trace and answer."
        readOnly: true
      - resource: runs
        verb: wait
        description: "Block until the run reaches a settled phase."
        readOnly: true
      - resource: runs
        verb: cancel
        description: "Ask a run in flight to stop."
      - resource: connections
        verb: test
        description: "Send a test message through the connection."
      - resource: connections
        verb: enable-inbound
        description: "Register the connection's inbound webhook."
      - resource: connections
        verb: authorize
        description: "Start the connection's OAuth authorization flow."
      - resource: schedules
        verb: run
        description: "Fire the schedule now, without waiting for its next tick."
      - resource: triggers
        verb: run
        description: "Fire the trigger now with an empty event."
  # Lets an organization run this provider in its own cluster
  # (docs/byo-providers.md). Keep manifest.yaml and
  # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
  # one that reaches production.
  #
  # Part of the define, not of the ConfigMap branch below: rendered outside it
  # this block was emitted at the ConfigMap's indentation whatever
  # catalogEntry.renderAsConfigMap said, so with the ConfigMap off the template
  # produced a stray YAML fragment, and any future direct-apply branch would
  # have shipped a CatalogEntry with no selfHosting at all.
  selfHosting:
    supported: true
    chart:
      repository: "oci://ghcr.io/railgrid/charts"
      name: "railgrid-agents-provider"
      version: {{ .Chart.Version | quote }}
    namespace: "railgrid-provider-agents"
    releaseName: "agents"
    docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/agents/deploy/chart/README.md"
    # The chart carries its own values reference, so the portal can show it
    # offline and for the version actually installed.
    valuesDoc: |{{ .Files.Get "README.md" | nindent 6 }}
    requiredValues:
      - name: store.databaseURLSecretRef.name
        description: >-
          Secret holding the Postgres connection URL. Postgres is this provider's only hard dependency beyond the hub — create the Secret before installing.
{{- end -}}

{{- if .Values.catalogEntry.enabled -}}
{{- if .Values.catalogEntry.renderAsConfigMap }}
# CatalogEntry registers this provider with the railgrid hub for routing + the
# portal Enable flow. It is a kcp resource (providers.railgrid.ai/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (RAILGRID_CATALOGENTRY_FILE -> sdkinstall.Bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agents.fullname" . }}-catalogentry
  labels:
    {{- include "agents.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
{{ include "agents.catalogEntry" . | indent 4 }}
{{- end }}
{{- end }}
