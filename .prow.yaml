            limits:
              cpu: "4"
              memory: 10Gi

  # splitsh-lite dry run of every provider mirror whose subtree the PR touched;
  # nothing is pushed (was split-*.yaml on pull_request).
  - name: pull-railgrid-split
    skip_if_only_changed: '^docs/|\.md$'
    branches:
