            connectionUID: *id001
            number: *id006
            commit: *id003
            repository:
              type: string
              minLength: 3
              maxLength: 201
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        schemaDigest: sha256:f8f9e0fadc70b1dc91c4a7ed5c6b977480fc5ca9a164d60611880110a40ff9a4
        executionMode: sync
        readOnly: true
        risk: low
        idempotency: inherent
        limits:
          timeoutSeconds: 180
          maxInputBytes: 65536
          maxOutputBytes: 524288
          maxResultItems: 2000
        consent:
          required: false
      - id: comments/v1
        displayName: Comments
        description: Use the registered Repository and pinned resource identities. Returns
