            page:
              type: integer
              minimum: 1
              maximum: 20
            repository:
              type: string
              minLength: 3
              maxLength: 201
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        schemaDigest: sha256:d37ca53e61369da77665f48222732d5bc97de85ad3c69dc85ff667d3b727426e
        executionMode: sync
        readOnly: true
        risk: low
