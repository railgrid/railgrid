## railgrid-code-provider values
## See providers/code/README.md for the deploy guide and the credential /
## GitHub OAuth conventions the portal expects.

# Container image. Build with: docker build -t IMAGE providers/code/
image:
  repository: ghcr.io/railgrid/railgrid-code-provider
  tag: ""  # empty → defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Number of Deployment replicas. More than 1 requires bundleStore.backend=s3
# (the chart refuses to render otherwise): the replica that accepts an upload
# and the leader replica that consumes it must read the same bytes, and a
# per-pod volume cannot provide that.
replicaCount: 1

service:
  type: ClusterIP
  port: 8083

# Hub the provider POSTs heartbeats to. Must be reachable from the provider pod
# (in-cluster Service DNS works).
hub:
  url: https://railgrid-hub.railgrid.svc.cluster.local:9443
  # Bearer token used in the heartbeat POST. Provided as a Secret because it
  # MUST NOT land in values.yaml in plaintext for prod.
  # Empty (the default) omits the Authorization header entirely — the
  # heartbeat endpoint does not require it. Set the name ONLY when the Secret
  # already exists in the release namespace: the reference is not optional, so
  # a missing Secret leaves the pod in CreateContainerConfigError forever.
  tokenSecretRef:
    name: ""
    key: token
  # Skip TLS verification on heartbeat — dev only, defaults off.
  insecure: false

# Secret the provider mounts read-only at
# /var/run/secrets/railgrid/railgrid-provider-kubeconfig to reach kcp (CODE_KUBECONFIG).
# The hub catalog controller mints it when it reconciles the CatalogEntry; the
# volume is `optional`, so the pod stays schedulable and serves portal/MCP reads
# until the Secret appears — the multicluster controller manager engages once it
# does (pod restart on Secret mount).
providerKubeconfig:
  secretName: railgrid-provider-kubeconfig

# GitHub "Connect with GitHub" OAuth App (optional). When enabled, the portal
# shows a "Connect with GitHub" button and mints OAuth tokens (with read:packages
# so the repository Packages panel works). Leave disabled to use pasted Personal
# Access Tokens only — repositories, deploy keys, collaborators all work with a
# PAT; OAuth just removes the copy-paste step.
githubOAuth:
  enabled: false
  # GitHub OAuth App client ID.
  clientId: ""
  # The client secret is read from a Secret you create — never put it in
  # values.yaml in plaintext for prod.
  clientSecretRef:
    name: ""
    key: clientSecret
  # Absolute callback URL registered on the GitHub OAuth App. It is a top-level
  # redirect from GitHub (no railgrid auth), so it must be publicly reachable and
  # forward to the provider's HTTP backend. Two options — both end in /callback:
  #   1. Reuse the hub ingress via its /services proxy (no extra ingress needed):
  #      https://<hub-host>/services/providers/code/oauth/github/callback
  #   2. The provider's own externally-reachable host:
  #      https://code.example.com/oauth/github/callback
  # The matching /start URL is derived by swapping /callback → /start under the
  # same host+path prefix.
  redirectURL: ""
  # postMessage target origin the popup returns the token to (the hub/portal
  # origin). Empty broadcasts to "*" — set this in production.
  portalOrigin: ""
  # Comma-separated scopes. Empty → provider default
  # (repo,delete_repo,read:org,admin:public_key,read:packages). delete_repo is
  # required for the provider to remove repositories it created.
  scopes: ""

# Tenant credential resolution. Empty → the provider default ("default"), the
# namespace the portal writes Connection token Secrets into. Override only if an
# admin pushes credential Secrets into a namespace tenants cannot write to.
tenant:
  credentialsNamespace: ""

# RepositoryCommit source bundles and staged git snapshots: the only state the
# provider keeps outside kcp. A CR stores only a reference/digest; the bytes
# live here until the controller consumes them, and expire on a TTL otherwise.
bundleStore:
  # Where the bytes live.
  #   file  A volume mounted at bundleStore.path. Correct for replicaCount: 1
  #         only, because every replica would have its own copy.
  #   s3    Any S3-compatible bucket (AWS S3, MinIO, Ceph RGW, …) that every
  #         replica reaches. Required for replicaCount > 1. No volume is
  #         mounted; the file settings below are ignored. The provider runs
  #         no orphan sweep on a bucket: give it a lifecycle rule expiring
  #         commit-bundles/ and git-snapshots/ after a day (chart README).
  backend: file
  path: /var/lib/railgrid-code/commit-bundles
  # Use an existing PVC instead of rendering one.
  existingClaim: ""
  # Explicit non-durable fallback for throwaway/dev deployments.
  emptyDir: false
  persistence:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
  # Settings for backend: s3.
  s3:
    # host[:port], or a URL whose scheme decides TLS. AWS: s3.<region>.amazonaws.com
    endpoint: ""
    bucket: ""
    # Needed by AWS; most other services ignore it.
    region: ""
    # Key prefix inside the bucket, so one bucket can be shared.
    prefix: ""
    # Talk TLS to the endpoint. Set false for a plain-HTTP in-cluster MinIO.
    useSSL: true
    # Create the bucket when it does not exist. For dev loops only; provision
    # production buckets outside the chart so the provider needs no bucket
    # admin permission.
    createBucket: false
    # Secret holding static credentials. Leave name empty to use the AWS
    # credential chain instead (IRSA / pod identity / AWS_* variables, e.g.
    # from envFromSecret).
    credentialsSecretRef:
      name: ""
      accessKeyIdKey: accessKeyId
      secretAccessKeyKey: secretAccessKey

# When true, the chart renders the CatalogEntry (which registers the provider
# with the hub) into a ConfigMap that the init container applies into the
# provider workspace via the provider kubeconfig. The CatalogEntry is a kcp
# resource, so it is NOT applied to the hosting cluster this chart installs into.
# Set to false to manage the CatalogEntry separately (e.g. GitOps with a
# different rollout cadence).
catalogEntry:
  enabled: true

serviceAccount:
  create: true
  name: ""   # empty → release-name

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Optional name overrides + pod-level scheduling controls.
# Optional Secret whose keys are injected wholesale as environment variables
# (GitHub OAuth app credentials and other dev secrets) — the containerized
# equivalent of sourcing providers/code/.env.
envFromSecret: ""

nameOverride: ""
fullnameOverride: ""
podLabels: {}
# Prometheus metrics. The process serves /metrics (controller-runtime reconcile,
# workqueue and client-go request metrics, Go runtime) on a separate plain-HTTP
# listener, never the serving port, and the pod carries prometheus.io/* and
# k8s.grafana.com/* scrape annotations so an annotation-driven collector picks
# it up without operator CRDs. enabled: false drops the listener and the
# annotations.
metrics:
  enabled: true
  port: 9090

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
