{{- if .Values.catalogEntry.enabled -}}
# CatalogEntry registers this provider with the faros hub for routing + the
# portal Enable flow. It is a kcp resource (providers.faros.sh/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (FAROS_CATALOGENTRY_FILE -> sdkinstall.Bootstrap). The hub watches
# CatalogEntries in every workspace bound to providers.faros.sh, including
# the provider's own, so a self-registered entry is seen.
#
# It only REFERENCES the APIExport (apiExport.name); the APIExport, its
# APIResourceSchemas, the APIExportEndpointSlice, and the bind grant are created
# by the same init container. The hub no longer provisions anything from this
# CatalogEntry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "code.fullname" . }}-catalogentry
  labels:
    {{- include "code.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.faros.sh/v1alpha1
    kind: CatalogEntry
    metadata:
      name: code
    spec:
      displayName: "Code"
      description: "Manage source-code repositories and access across git providers (GitHub)."
      vendor: "faros"
      version: {{ .Chart.AppVersion | quote }}
      category: "Developer"
      iconURL: "/ui/providers/code/icon.svg"
      ui:
        url: "http://{{ include "code.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
        children:
          - displayName: Connections
            builtinRoute: connections
          - displayName: Repositories
            builtinRoute: repositories
          - displayName: Packages
            builtinRoute: packages
      backend:
        url: "http://{{ include "code.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/readyz"
      apiExport:
        name: "code.providers.faros.sh"
        permissionClaims:
          - resource: secrets
            verbs: [get, list, watch, create, update, patch, delete]
            tenantScoped: true
      # Lets an organization run this provider in its own cluster
      # (docs/byo-providers.md). Keep manifest.yaml and
      # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
      # one that reaches production.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/faroshq/charts"
          name: "faros-code-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "faros-provider-code"
        releaseName: "code"
        docsURL: "https://github.com/faroshq/faros/blob/main/providers/code/deploy/chart/README.md"
        # The chart carries its own values reference, so the portal can show it
        # offline and for the version actually installed.
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
      actions:
      - id: branch_head/v1
        displayName: Branch head
        description: Use the registered Repository and pinned resource identities. Returns
          current host state.
        boundResource:
          apiVersion: code.faros.sh/v1alpha1
          kind: Repository
          resource: repositories
        inputSchema:
          type: object
          required:
          - repositoryUID
          - connectionUID
          - branch
          - repository
          properties:
            repositoryUID: &id001
              type: string
              minLength: 1
              maxLength: 253
            connectionUID: *id001
            branch: &id002
              type: string
              minLength: 1
              maxLength: 255
            repository:
              type: string
              minLength: 3
              maxLength: 201
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        schemaDigest: sha256:8768bfafae9fb0ef9328ee46a55eeda45558c3ccf66661841990dddb706b74f7
        executionMode: sync
        readOnly: true
        risk: low
        idempotency: inherent
        limits:
          timeoutSeconds: 180
          maxInputBytes: 65536
          maxOutputBytes: 524288
          maxResultItems: 50
        consent:
          required: false
      - id: find_pull_request/v1
        displayName: Find pull request
        description: Use the registered Repository and pinned resource identities. Returns
          current host state.
        boundResource:
          apiVersion: code.faros.sh/v1alpha1
          kind: Repository
          resource: repositories
        inputSchema:
          type: object
          required:
          - repositoryUID
          - connectionUID
          - head
          - base
          - commit
          - repository
          properties:
            repositoryUID: *id001
            connectionUID: *id001
            head: *id002
            base: *id002
            commit: &id003
              type: string
              pattern: ^[0-9a-f]{40}$
            repository:
              type: string
              minLength: 3
              maxLength: 201
          additionalProperties: false
        outputSchema:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        schemaDigest: sha256:67cfd5409978bc88be462dfd6e1dc21167c8460512210ad8d987ccb9ed8743bc
        executionMode: sync
        readOnly: true
        risk: low
        idempotency: inherent
        limits:
          timeoutSeconds: 180
          maxInputBytes: 65536
          maxOutputBytes: 524288
          maxResultItems: 50
        consent:
          required: false
      - id: pull_request/v1
