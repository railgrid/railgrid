{{- if and (.Values.codingSandbox).enabled (not (regexMatch `^[^@\s]+@sha256:[a-f0-9]{64}$` (default "" .Values.development.images.universal))) }}
{{- fail "codingSandbox.enabled=true requires development.images.universal to be an immutable name@sha256:<64 lowercase hex digits> reference" }}
{{- end }}
{{- if and (.Values.codingSandbox).enabled (not (regexMatch `^[^@\s]+@sha256:[a-f0-9]{64}$` (default "" .Values.development.agentImage))) }}
{{- fail "codingSandbox.enabled=true requires development.agentImage to be an immutable name@sha256:<64 lowercase hex digits> reference" }}
{{- end }}
{{- if not .Values.operator.enabled }}
# Legacy single-Deployment serve (bootstrap.* init-container flow). When
# operator.enabled=true the operator owns the provider serve Deployment on the
# runtime cluster instead, so this is skipped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrastructure.fullname" . }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "infrastructure.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infrastructure.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "infrastructure.serviceAccountName" . }}
      {{- $centralName := (include "infrastructure.centralKroSecretName" .) }}
      {{- if .Values.bootstrap.enabled }}
      {{- if not (include "infrastructure.bootstrapSecretName" .) }}
        {{- fail "bootstrap.enabled=true with kubeconfigSource=supplied requires bootstrap.kcpKubeconfig (inline) or bootstrap.kcpKubeconfigSecretRef.name" }}
      {{- end }}
      initContainers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            # init bootstraps the provider workspace using the SAME kubeconfig
            # the serve container runs with (mounted at the railgrid path below).
            # hubMinted: the hub-delivered railgrid-provider-kubeconfig, which is
            # cluster-admin in the provider workspace — enough to install CRDs,
            # the CachedResource, and the APIExport. supplied: your kcp config.
            - name: INFRASTRUCTURE_ADMIN_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            {{- if eq .Values.bootstrap.kubeconfigSource "supplied" }}
            # A supplied kubeconfig may be root-scoped, so retarget init at the
            # provider workspace. The hub-minted kubeconfig already targets it.
            - name: INFRASTRUCTURE_WORKSPACE_PATH
              value: {{ .Values.bootstrap.workspacePath | quote }}
            {{- end }}
            # init writes a throwaway file copy; keep it off the read-only root.
            - name: INFRASTRUCTURE_KUBECONFIG
              value: /tmp/infrastructure.kubeconfig
            - name: RAILGRID_CODING_SANDBOX_ENABLED
              value: {{ (.Values.codingSandbox).enabled | default false | quote }}
            {{- if .Values.development.images.universal }}
            - name: RAILGRID_DEV_IMAGE_UNIVERSAL
              value: {{ .Values.development.images.universal | quote }}
            {{- end }}
            {{- with include "infrastructure.devAgentImage" . }}
            - name: RAILGRID_DEV_AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- if $centralName }}
            - name: KRO_KUBECONFIG
              value: /var/run/secrets/kro/kubeconfig
            {{- end }}
            {{- if .Values.catalogEntry.enabled }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it to
            # the hosting cluster. It is rendered into a ConfigMap (mounted below)
            # and init self-registers it into the provider workspace via the
            # provider kubeconfig.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $centralName }}
            - name: kro-kubeconfig
              mountPath: /var/run/secrets/kro
              readOnly: true
            {{- end }}
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: "8081"
            - name: RAILGRID_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: RAILGRID_PROVIDER_NAME
              value: "infrastructure"
            - name: RAILGRID_CODING_SANDBOX_ENABLED
              value: {{ (.Values.codingSandbox).enabled | default false | quote }}
            {{- if .Values.hub.insecure }}
            - name: RAILGRID_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: RAILGRID_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            {{- if and .Values.bootstrap.enabled .Values.catalogEntry.enabled }}
            # The same CatalogEntry the init container applies. serve reads it
            # too: spec.dataPlane.verbs is the declaration of which
            # "<resource>/<verb>" coordinates this provider answers on the path
            # a kcp shard forwards for a custom subresource, so the routes
            # cannot drift from what the APIExport declares.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
            {{- if $centralName }}
            - name: KRO_KUBECONFIG
              value: /var/run/secrets/kro/kubeconfig
            {{- end }}
            {{- if and .Values.application.baseDomain (not .Values.publishing.baseDomain) }}
            # Enables the Application instance controller (fqdn stamp + OIDC
            # client-secret bridge). Without it (and KRO_KUBECONFIG) the
            # controller stays disabled. The zone apps are served under, e.g.
            # "apps.example.com".
            - name: RAILGRID_APP_BASE_DOMAIN
              value: {{ .Values.application.baseDomain | quote }}
            {{- end }}
            {{- if and .Values.application.gateway.name (not .Values.publishing.gateway.name) }}
            # Gateway API parent the Application HTTPRoutes attach to
            # (${railgrid.gatewayName}); defaults to "cloudflare-tunnel" in-binary.
            - name: RAILGRID_GATEWAY_NAME
              value: {{ .Values.application.gateway.name | quote }}
            {{- end }}
            {{- if and .Values.application.gateway.namespace (not .Values.publishing.gateway.namespace) }}
            # The Gateway's namespace (${railgrid.gatewayNamespace}); defaults to
            # "cfgate-system" in-binary.
            - name: RAILGRID_GATEWAY_NAMESPACE
              value: {{ .Values.application.gateway.namespace | quote }}
            {{- end }}
            {{- with .Values.publishing.baseDomain }}
            - name: RAILGRID_APP_BASE_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.publishing.accessProxyImage }}
            - name: RAILGRID_ACCESS_PROXY_IMAGE
              value: {{ . | quote }}
            {{- end }}
            - name: RAILGRID_ACCESS_HUB_URL
              value: {{ default .Values.hub.url .Values.publishing.hubURL | quote }}
            {{- with .Values.publishing.hubPublicURL }}
            - name: RAILGRID_ACCESS_HUB_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.publishing.insecure }}
            - name: RAILGRID_ACCESS_HUB_INSECURE
              value: "true"
            {{- end }}
            - name: RAILGRID_ACCESS_PUBLIC_SCHEME
              value: {{ .Values.publishing.publicScheme | default "https" | quote }}
            {{- if gt (int .Values.publishing.publicPort) 0 }}
            - name: RAILGRID_APP_PUBLIC_PORT
              value: {{ .Values.publishing.publicPort | quote }}
            {{- end }}
            {{- with .Values.publishing.gateway.name }}
            - name: RAILGRID_GATEWAY_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.publishing.gateway.namespace }}
            - name: RAILGRID_GATEWAY_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.tenantLimitRange.enabled }}
            # Opt out of stamping the railgrid-defaults LimitRange into tenant
            # namespaces (for clusters that manage resource policy themselves).
            - name: RAILGRID_TENANT_LIMITRANGE
              value: "disabled"
            {{- end }}
            # Tenant runtime-namespace ingress isolation (tenantNetworkPolicy.*).
            # The runtime credential needs networkpolicies get/create/update/
            # delete and namespaces patch.
            {{- include "infrastructure.tenantNetworkPolicyEnv" . | nindent 12 }}
            {{- with include "infrastructure.devAgentImage" . }}
            # Dev-mode agent injector image (${railgrid.devAgentImage}):
            # development.agentImage, else this release's railgrid-dev-agent.
            - name: RAILGRID_DEV_AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- $sandboxRuntimeClass := include "infrastructure.sandboxRuntimeClassName" . }}
            {{- if $sandboxRuntimeClass }}
            # Hardened RuntimeClass (gVisor, Kata) stamped on every synthesized
            # development pod. Required before serving untrusted users.
            - name: RAILGRID_SANDBOX_RUNTIME_CLASS_NAME
              value: {{ $sandboxRuntimeClass | quote }}
            {{- end }}
            {{- with .Values.development.previewBridge.verificationJWKS }}
            # Current and optional previous public ES256 keys for the
            # development preview bridge. Signing keys remain in App
            # Studio and are never passed to the infrastructure provider.
            - name: RAILGRID_PREVIEW_BRIDGE_VERIFICATION_JWKS
              value: {{ . | quote }}
            {{- end }}
            {{- range $toolchain, $image := .Values.development.images }}
            {{- if $image }}
            # Dev-mode toolchain image (${railgrid.devImage.{{ $toolchain }}}).
            - name: RAILGRID_DEV_IMAGE_{{ $toolchain | upper | replace "-" "_" }}
              value: {{ $image | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if $centralName }}
            - name: kro-kubeconfig
              mountPath: /var/run/secrets/kro
              readOnly: true
            {{- end }}
            {{- if and .Values.bootstrap.enabled .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.bootstrap.enabled }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if and .Values.bootstrap.enabled .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "infrastructure.fullname" . }}-catalogentry
        {{- end }}
        - name: railgrid-provider-kubeconfig
          secret:
            {{- if .Values.bootstrap.enabled }}
            # init + serve share ONE kubeconfig (resolved by kubeconfigSource).
            # NOT optional: the pod waits for the Secret to exist — in hubMinted
            # mode that's the hub delivering railgrid-provider-kubeconfig after it
            # reconciles the CatalogEntry, which is exactly the bootstrap
            # ordering we want.
            secretName: {{ include "infrastructure.bootstrapSecretName" . }}
            items:
              - key: {{ include "infrastructure.bootstrapSecretKey" . }}
                path: railgrid-provider-kubeconfig
            {{- else }}
            # Hub-provisioned, no init container: optional so the pod stays
            # schedulable while the hub catalog controller mints the Secret.
            # The provider logs a warning and serves catalog reads; broker
            # writes 502 until the Secret appears.
            secretName: {{ .Values.providerKubeconfig.secretName }}
            optional: true
            items:
              - key: kubeconfig
                path: railgrid-provider-kubeconfig
            {{- end }}
        {{- if $centralName }}
        - name: kro-kubeconfig
          secret:
            secretName: {{ $centralName }}
            items:
              - key: {{ include "infrastructure.centralKroSecretKey" . }}
                path: kubeconfig
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
