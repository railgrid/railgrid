<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dex login specimen</title>
    <link rel="stylesheet" href="../dex/web/static/main.css">
  </head>
  <body>
    <main class="dex-container">
      <div class="brand"><span class="brand-name">Railgrid</span></div>
      <div class="theme-panel">
        <h1 class="theme-heading">Sign in to Railgrid</h1>
        <p class="dex-subtitle">Choose a provider to continue.</p>
        <div class="login-providers">
          <div class="theme-form-row"><button type="button" class="dex-btn theme-btn-provider"><span class="dex-btn-icon dex-btn-icon--google" aria-hidden="true"></span><span class="dex-btn-text">Sign in with Google</span></button></div>
          <div class="theme-form-row"><button type="button" class="dex-btn theme-btn-provider"><span class="dex-btn-icon dex-btn-icon--github" aria-hidden="true"></span><span class="dex-btn-text">Sign in with GitHub</span></button></div>
        </div>
        <p class="dex-footer-text">Fixed dark · visual specimen. Sign-in is disabled in the fixture.</p>
      </div>
    </main>
  </body>
</html>
