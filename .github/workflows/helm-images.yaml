name: Helm OCI Image Build and Push

# Publishes the platform charts (deploy/charts/*) to ghcr as OCI artifacts on
# every push to main and on v* tags. This workflow no longer runs on pull
# requests: PR validation of every chart (platform and provider) is the
# `make verify-charts` step of the CI workflow's `contracts` job, which costs
# seconds instead of three billed job-minutes per push. Manual runs package
# and lint without logging in or pushing.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/railgrid/railgrid-hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Package and push Helm charts as OCI
        env:
          HELM_EXPERIMENTAL_OCI: 1
          # Manual runs validate only; pushes/tags publish.
          PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          # Login to GitHub Container Registry for Helm (skip on manual runs — no push).
          if [ "${PUSH}" = "true" ]; then
            echo "${{ github.token }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          fi

          # Set chart version - use tag name if available, otherwise use semver format
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            # Chart version must not have 'v' prefix (OCI/semver convention)
            CHART_VERSION="${TAG_NAME#v}"
            # App version keeps 'v' prefix to match container image tags
            APP_VERSION="${TAG_NAME}"
          else
            CHART_VERSION="0.0.0-${{ github.sha }}"
            APP_VERSION="${CHART_VERSION}"
          fi

          # Platform charts (deploy/charts/*) are versioned + published here with
          # the hub version. Provider charts (providers/*/deploy/chart/) are only
          # LINTED/PACKAGED here on manual runs — they are published, with each
          # provider's OWN version, by provider-release.yaml on a
          # `providers/<name>/v*` tag. Publishing them here would stamp them with
          # the hub version. The provider chart dirs are all named "chart", so the
          # chart name is read from the Chart.yaml name: field.
          chart_dirs=(deploy/charts/*/)
          if [ "${PUSH}" != "true" ]; then
            chart_dirs+=(providers/*/deploy/chart/)
          fi
          for chart_dir in "${chart_dirs[@]}"; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_name=$(grep -E '^name:' "${chart_dir}Chart.yaml" | head -1 | awk '{print $2}')
              echo "Processing chart: $chart_name ($chart_dir)"

              # Update chart version and appVersion in Chart.yaml
              sed -i "s/^version:.*/version: ${CHART_VERSION}/" "${chart_dir}Chart.yaml"
              sed -i "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" "${chart_dir}Chart.yaml"

              # Lint first: `helm package` only tars the chart and does NOT
              # render templates, so a broken template would still package
              # cleanly. `helm lint` renders the templates against the chart's
              # default values. All current charts — platform and provider —
              # lint cleanly with their defaults (the platform charts'
              # `required` values are defaulted in values.yaml).
              helm lint "$chart_dir"

              # Package the chart
              helm package "$chart_dir" --version "${CHART_VERSION}"

              if [ "${PUSH}" = "true" ]; then
                # On tag releases, gate the chart push on the matching image
                # existing in ghcr. The image is built by images.yaml (separate
                # workflow, slow multi-arch build); this chart push takes ~1min.
                # Without the gate, Flux (10min OCI poll + semver range) grabs
                # the new chart, deploys it, and the pod sits in
                # ImagePullBackOff until the image lands — every release fails
                # its first helm upgrade. Both platform charts (railgrid-hub,
                # railgrid-agent) are named after their image repo, which the
                # charts' image.tag default (.Chart.AppVersion) relies on too.
                if [[ "${{ github.ref_type }}" == "tag" ]]; then
                  IMAGE="ghcr.io/${{ github.repository_owner }}/${chart_name}"
                  echo "Waiting for ${IMAGE}:${APP_VERSION} before pushing chart (max 30m)..."
                  for i in $(seq 1 90); do
                    if docker manifest inspect "${IMAGE}:${APP_VERSION}" >/dev/null 2>&1; then
                      echo "Image ${IMAGE}:${APP_VERSION} is available."
                      break
                    fi
                    if [ "$i" = "90" ]; then
                      echo "ERROR: ${IMAGE}:${APP_VERSION} never appeared; refusing to push a chart whose image does not exist."
                      exit 1
                    fi
                    sleep 20
                  done
                fi

                # Push to GitHub Container Registry
                helm push "${chart_name}-${CHART_VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
                echo "Helm chart pushed to oci://ghcr.io/${{ github.repository_owner }}/charts/${chart_name}:${CHART_VERSION}"
              else
                echo "Manual run: packaged ${chart_name}-${CHART_VERSION}.tgz (not pushed)"
              fi
            fi
          done
