{{- /*
Workload kind depends on the kcp mode:
  - Embedded kcp (default): StatefulSet. kcp's embedded etcd lives on a
    per-replica PVC (volumeClaimTemplates) and needs a stable network identity
    (headless serviceName) so the embedded kcp TLS cert stays valid across
    restarts. Each replica would be its own control plane, so this mode is
    always single-replica.
  - External kcp: Deployment, scalable via replicaCount. The hub keeps no local
    state: singleton controllers run behind a kcp-held leader-election Lease,
    and browser sessions / app-access codes live in a shared kcp-backed store,
    so any replica can serve any request.
*/ -}}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.kcp.external.enabled) }}
{{- fail "replicaCount > 1 requires kcp.external.enabled=true: embedded kcp keeps a per-replica etcd on its own PVC and cannot be scaled." }}
{{- end }}
apiVersion: apps/v1
{{- if .Values.kcp.external.enabled }}
kind: Deployment
{{- else }}
kind: StatefulSet
{{- end }}
metadata:
  name: {{ include "railgrid-hub.fullname" . }}
  labels:
    {{- include "railgrid-hub.labels" . | nindent 4 }}
spec:
  {{- if .Values.kcp.external.enabled }}
  strategy:
    type: RollingUpdate
  replicas: {{ .Values.replicaCount }}
  {{- else }}
  serviceName: {{ include "railgrid-hub.fullname" . }}-kcp
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "railgrid-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "railgrid-hub.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # --- railgrid-hub ---
        - name: hub
          image: {{ include "railgrid-hub.hubImage" . }}
          imagePullPolicy: {{ .Values.image.hub.pullPolicy }}
          args:
            - --listen-addr={{ .Values.hub.listenAddr }}
            {{- if .Values.kcp.external.enabled }}
            # External kcp mode: connect to kcp running outside the cluster.
            # The front-proxy kubeconfig is used for everything (control-plane
            # access and the multicluster providers' APIExport virtual-workspace
            # connections) — the front-proxy resolves workspace paths to the
            # hosting shard and the shards trust its client cert.
            - --external-kcp-kubeconfig=/kcp-kubeconfig/admin.kubeconfig
            {{- else }}
            # Embedded kcp mode (default): kcp runs in-process
            - --embedded-kcp
            - --kcp-root-dir=/data/kcp
            - --kcp-secure-port={{ .Values.kcp.embedded.securePort }}
            - --kcp-bind-address={{ .Values.kcp.embedded.bindAddress }}
            - --kcp-batteries-include={{ .Values.kcp.embedded.batteriesInclude }}
            # Stable shard URL: endpoint slices keep working across pod
            # restarts (see kcp.embedded.shardURL in values.yaml).
            - --kcp-shard-external-url={{ include "railgrid-hub.kcpShardURL" . }}
            - --kcp-shard-virtual-workspace-url={{ include "railgrid-hub.kcpShardURL" . }}
            {{- if include "railgrid-hub.kcpTlsEnabled" . }}
            - --kcp-tls-cert-file=/kcp-tls/tls.crt
            - --kcp-tls-key-file=/kcp-tls/tls.key
            {{- end }}
            {{- end }}
            {{- if include "railgrid-hub.tlsEnabled" . }}
            - --serving-cert-file=/tls/tls.crt
            - --serving-key-file=/tls/tls.key
            {{- end }}
            - --hub-external-url={{ required "hub.hubExternalURL is required" .Values.hub.hubExternalURL }}
            {{- if .Values.hub.internalURL }}
            - --hub-internal-url={{ .Values.hub.internalURL }}
            {{- end }}
            {{- if .Values.hub.publishedAppsDomain }}
            - --published-apps-domain={{ .Values.hub.publishedAppsDomain }}
            {{- end }}
            {{- if .Values.idp.issuerURL }}
            - --idp-issuer-url={{ .Values.idp.issuerURL }}
            {{- if .Values.idp.browserAuthURL }}
            - --idp-browser-auth-url={{ .Values.idp.browserAuthURL }}
            {{- end }}
            - --idp-client-id={{ .Values.idp.clientID }}
            {{- if .Values.idp.caSecretName }}
            - --idp-ca-file=/idp-ca/{{ .Values.idp.caSecretKey }}
            {{- end }}
            {{- end }}
            {{- range .Values.hub.staticAuthTokens }}
            - --static-auth-token={{ . }}
            {{- end }}
            {{- if .Values.hub.disableTokenLogin }}
            - --disable-token-login
            {{- end }}
            {{- range .Values.hub.adminUsers }}
            - --admin-users={{ . }}
            {{- end }}
            {{- range .Values.hub.portalFrameSources }}
            - --portal-frame-source={{ . }}
            {{- end }}
            {{- with .Values.hub.trustedProxyCIDRs }}
            - --trusted-proxy-cidrs={{ join "," . }}
            {{- end }}
            {{- with .Values.hub.softDeleteGracePeriod }}
            {{- if not (regexMatch "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$" (toString .)) }}
            {{- fail (printf "hub.softDeleteGracePeriod must be a Go duration such as \"720h\" or \"72h\", got %q" (toString .)) }}
            {{- end }}
            {{- /* The hub refuses a non-positive window at startup; catch "0s"-style values here instead of crash-looping the pod. */}}
            {{- if regexMatch "^(0+(\\.0+)?(ns|us|µs|ms|s|m|h))+$" (toString .) }}
            {{- fail (printf "hub.softDeleteGracePeriod must be positive, got %q" (toString .)) }}
            {{- end }}
            - --soft-delete-grace-period={{ . }}
            {{- end }}
            {{- if and (not (kindIs "invalid" .Values.hub.defaultOrgsPerUser)) (ne (toString .Values.hub.defaultOrgsPerUser) "") }}
            {{- $orgs := toString .Values.hub.defaultOrgsPerUser }}
            {{- if not (regexMatch "^[1-9][0-9]*$" $orgs) }}
            {{- fail (printf "hub.defaultOrgsPerUser must be a positive integer, got %q" $orgs) }}
            {{- end }}
            - --default-orgs-per-user={{ $orgs }}
            {{- end }}
            {{- if .Values.hub.devMode }}
            - --dev-mode
            {{- end }}
            {{- /*
            Provider hardening flags. Each renders only when set so an
            unchanged values file keeps the binary's defaults for this release
            (warn / off / cluster-admin) and the rendered workload is
            byte-identical to earlier chart versions.
            */}}
            {{- with .Values.hub.security }}
            {{- if .providerHeartbeatAuth }}
            {{- if not (has .providerHeartbeatAuth (list "warn" "enforce")) }}
            {{- fail (printf "hub.security.providerHeartbeatAuth must be \"warn\" or \"enforce\", got %q" .providerHeartbeatAuth) }}
            {{- end }}
            - --provider-heartbeat-auth={{ .providerHeartbeatAuth }}
            {{- end }}
            {{- if .providerDelegatedTokens }}
            {{- if not (has .providerDelegatedTokens (list "off" "platform" "all")) }}
            {{- fail (printf "hub.security.providerDelegatedTokens must be \"off\", \"platform\" or \"all\", got %q" .providerDelegatedTokens) }}
            {{- end }}
            - --provider-delegated-tokens={{ .providerDelegatedTokens }}
            {{- end }}
            {{- range .providerDelegatedTokensExclude }}
            - --provider-delegated-tokens-exclude={{ . }}
            {{- end }}
            {{- /*
            Tri-state: null/absent leaves the binary default; true/false
            renders --flag=<bool> (pflag needs the explicit =value form for
            false). Accept the bool and its string spelling so --set-string
            keeps working, and refuse anything else here rather than letting
            a typo reach the hub's flag parser.
            */}}
            {{- if not (kindIs "invalid" .providerWorkspaceClusterAdmin) }}
            {{- $clusterAdmin := toString .providerWorkspaceClusterAdmin }}
            {{- if not (has $clusterAdmin (list "true" "false")) }}
            {{- fail (printf "hub.security.providerWorkspaceClusterAdmin must be true or false, got %q" $clusterAdmin) }}
            {{- end }}
            - --provider-workspace-cluster-admin={{ $clusterAdmin }}
            {{- end }}
            {{- if not (kindIs "invalid" .providerHubAccessPlatformDefault) }}
            {{- $hubAccessDefault := toString .providerHubAccessPlatformDefault }}
            {{- if not (has $hubAccessDefault (list "true" "false")) }}
            {{- fail (printf "hub.security.providerHubAccessPlatformDefault must be true or false, got %q" $hubAccessDefault) }}
            {{- end }}
            - --provider-hub-access-platform-default={{ $hubAccessDefault }}
            {{- end }}
            {{- end }}
            {{- /*
            Escape hatch for flags the chart does not model yet. pflag takes
            the LAST occurrence of a scalar flag, so an entry here that repeats
            a flag rendered from a value above would silently override it;
            refuse those so the modelled value stays the single source of
            truth. Keep this list in step with the flags rendered above.
            */}}
            {{- $modelled := list "listen-addr" "external-kcp-kubeconfig" "embedded-kcp" "kcp-root-dir" "kcp-secure-port" "kcp-bind-address" "kcp-batteries-include" "kcp-shard-external-url" "kcp-shard-virtual-workspace-url" "kcp-tls-cert-file" "kcp-tls-key-file" "serving-cert-file" "serving-key-file" "hub-external-url" "hub-internal-url" "published-apps-domain" "idp-issuer-url" "idp-browser-auth-url" "idp-client-id" "idp-ca-file" "static-auth-token" "disable-token-login" "admin-users" "portal-frame-source" "trusted-proxy-cidrs" "soft-delete-grace-period" "default-orgs-per-user" "dev-mode" "provider-heartbeat-auth" "provider-delegated-tokens" "provider-delegated-tokens-exclude" "provider-workspace-cluster-admin" "provider-hub-access-platform-default" "data-dir" }}
            {{- range .Values.hub.extraArgs }}
            {{- $flag := regexReplaceAll "^--([A-Za-z0-9-]+).*$" (toString .) "${1}" }}
            {{- if has $flag $modelled }}
            {{- fail (printf "hub.extraArgs entry %q repeats --%s, which the chart renders from a value; set the value instead" (toString .) $flag) }}
            {{- end }}
            - {{ . | quote }}
            {{- end }}
            - --data-dir=/data/hub
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          volumeMounts:
            - name: kcp-data
              mountPath: /data
            {{- if include "railgrid-hub.tlsEnabled" . }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            {{- if include "railgrid-hub.kcpTlsEnabled" . }}
            - name: kcp-tls
              mountPath: /kcp-tls
              readOnly: true
            {{- end }}
            {{- if .Values.kcp.external.enabled }}
            - name: kcp-kubeconfig
              mountPath: /kcp-kubeconfig
              readOnly: true
            {{- end }}
            {{- if .Values.idp.caSecretName }}
            - name: idp-ca
              mountPath: /idp-ca
              readOnly: true
            {{- end }}

      volumes:
        {{- if .Values.kcp.external.enabled }}
        # External kcp mode is stateless; /data is scratch only (the hub keeps
        # no persistent state here), so an emptyDir replaces the PVC.
        - name: kcp-data
          emptyDir: {}
        {{- end }}
        {{- if include "railgrid-hub.tlsEnabled" . }}
        - name: tls
          secret:
            secretName: {{ include "railgrid-hub.tlsSecretName" . }}
        {{- end }}
        {{- if include "railgrid-hub.kcpTlsEnabled" . }}
        - name: kcp-tls
          secret:
            secretName: {{ include "railgrid-hub.kcpTlsSecretName" . }}
        {{- end }}
        {{- if .Values.kcp.external.enabled }}
        - name: kcp-kubeconfig
          secret:
            secretName: {{ include "railgrid-hub.kcpKubeconfigSecretName" . }}
        {{- end }}
        {{- if .Values.idp.caSecretName }}
        - name: idp-ca
          secret:
            secretName: {{ .Values.idp.caSecretName }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  {{- if not .Values.kcp.external.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: kcp-data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
