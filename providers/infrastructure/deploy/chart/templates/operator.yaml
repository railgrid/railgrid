{{- if .Values.operator.enabled -}}
{{- /*
kro's chart names its objects after `kro.fullname`: the release name when it
contains the chart name ("kro"), otherwise "<release>-kro". The operator's
escalate/bind grants below are pinned to those names, so a kro
fullnameOverride/nameOverride in operator.kro.extraValues needs
operator.clusterAdmin=true instead.
*/ -}}
{{- $kroRelease := .Values.operator.kro.releaseName | default "kro" -}}
{{- $kroName := ternary $kroRelease (printf "%s-kro" $kroRelease) (contains "kro" $kroRelease) -}}
{{- $serveRole := printf "%s-serve" (include "infrastructure.fullname" .) -}}
# CRD-driven operator: a controller-manager that reconciles
# InfrastructureProvider CRs — bootstraps the provider kcp workspace,
# lifecycles the kro Helm release, and owns the provider serve Deployment.
# It reads the provider + runtime kubeconfigs from Secrets referenced by the CR.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infrastructure.fullname" . }}-operator
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
# Everything the operator touches on its own cluster, enumerated. With the
# in-cluster runtime (no operator.runtimeKubeconfig) this is also the
# credential helm and the serve rollout run with, so the rules cover the kro
# chart's objects (kro 0.9.x: ServiceAccount, Deployment, ClusterRole,
# ClusterRoleBinding, crds/, optional metrics/pprof Services) and the serve
# workload (namespace, Secrets, ServiceAccount, Deployment, Service). An
# explicit runtimeKubeconfig replaces all of that with its own identity.
# Anything outside this set (a kro chart that renders new kinds, an extraValues
# ServiceMonitor, renamed kro objects) needs operator.clusterAdmin=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "infrastructure.fullname" . }}-operator
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
rules:
  # Watch + status the CRs.
  - apiGroups: ["infrastructure.railgrid.ai"]
    resources: ["infrastructureproviders"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["infrastructure.railgrid.ai"]
    resources: ["infrastructureproviders/status"]
    verbs: ["get", "update", "patch"]
  # Leader election (controller-runtime Lease in the operator's namespace) plus
  # the events it records on leadership transitions.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Secrets: read the kubeconfig / hub-token Secrets the CR references (the
  # controller also watches Secrets it owns), replicate them into the serve
  # namespace, and let helm keep its release records (sh.helm.release.v1.*)
  # in the kro namespace. Cluster-wide because the operator creates those
  # namespaces itself, so a namespaced Role cannot pre-exist them.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The kro namespace (helm --create-namespace) and the serve namespace are
  # created if missing and never deleted.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # kro chart workload + the serve Deployment/Service/ServiceAccount. Delete is
  # for `helm uninstall` when a wedged pending-install release is recovered.
  - apiGroups: [""]
    resources: ["serviceaccounts", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # kro's CRDs: helm installs the chart's crds/ on first install and the
  # operator re-applies them on every reconcile (helm never upgrades them).
  # RBAC cannot pin `create` to a name; the rest is pinned to kro's two CRDs.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["resourcegraphdefinitions.kro.run", "graphrevisions.internal.kro.run"]
    verbs: ["get", "update", "patch"]
  # kro's ClusterRole (unrestricted "*" in the chart default, or the
  # aggregation pair with rbac.mode=aggregation) and its binding, plus the
  # binding the operator creates for the serve ServiceAccount. Create cannot be
  # name-pinned; get/update/delete are.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - {{ $kroName }}-cluster-role
      - {{ $kroName }}:controller
      - {{ $kroName }}:controller:static
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames:
      - {{ $kroName }}-cluster-role-binding
      - {{ $kroName }}:controller
      - railgrid-infrastructure-serve-{{ include "infrastructure.fullname" . }}
    verbs: ["get", "update", "patch", "delete"]
  # Writing a ClusterRole with rules the writer does not hold itself needs
  # `escalate` on that role; binding one needs `bind`. Both are pinned to the
  # roles the operator has to grant: kro's own, and the serve role below.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - {{ $kroName }}-cluster-role
      - {{ $kroName }}:controller
      - {{ $kroName }}:controller:static
    verbs: ["escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - {{ $kroName }}-cluster-role
      - {{ $kroName }}:controller
      - {{ $serveRole }}
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "infrastructure.fullname" . }}-operator
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "infrastructure.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "infrastructure.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
---
# What the provider serve pod needs on the runtime cluster when that is the
# operator's own cluster (in-cluster runtime): the operator binds the serve
# ServiceAccount to this role instead of cluster-admin. kro's controller has
# its own ClusterRole for the resources the Templates' graphs materialize;
# serve only authors RGDs and instance CRs, bridges credentials, and reaches
# component Services through the apiserver proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $serveRole }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
rules:
  # kro's data model: the ResourceGraphDefinition per Template, and instances
  # of any RGD that keeps kro's default group.
  - apiGroups: ["kro.run"]
    resources: ["*"]
    verbs: ["*"]
  # The instance kinds kro synthesizes from the seeded Templates
  # (Template.spec.instanceCRD.group). The kinds are template-defined, so the
  # grant is for the group, not a kind list.
  - apiGroups: ["infrastructure.railgrid.ai"]
    resources: ["*"]
    verbs: ["*"]
  # Per-tenant runtime namespaces and their default LimitRange (create-only).
  # patch adds the tenant labels to a runtime namespace that predates them
  # (tenantNetworkPolicy only).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # The tenant isolation policy in each runtime namespace. Granted even while
  # tenantNetworkPolicy is disabled so turning it off removes the policies.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["get", "create"]
  # Bridged tenant credentials, instance Secrets and the dev-sandbox control
  # token; the tenant namespace's default ServiceAccount gets imagePullSecrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "update", "patch"]
  # Dev-sandbox run cleanup: leftover run Pods and the control-token Job.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "delete"]
  # Data plane: component Services are reached through
  # /api/v1/namespaces/<ns>/services/<svc>/proxy; the verb is the HTTP method.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Provider Actions workload attestation (/workload-identities/review): an
  # online TokenReview of the dev pod's projected bootstrap token, then a pod
  # GET (granted above) to match its annotations. Without it every review
  # fails and the hub answers the sandbox's token exchange with 403.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
{{- if .Values.operator.clusterAdmin }}
---
# Opt-in escape hatch: bind the operator ServiceAccount to cluster-admin on top
# of the enumerated role, and (via the unset INFRASTRUCTURE_SERVE_CLUSTER_ROLE
# below) let it bind the serve ServiceAccount to cluster-admin too. Needed only
# when the kro chart or a Template requires kinds outside the two roles above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "infrastructure.fullname" . }}-operator-admin
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "infrastructure.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrastructure.fullname" . }}-operator
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "infrastructure.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "infrastructure.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "infrastructure.fullname" . }}-operator
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository | default .Values.image.repository }}:{{ .Values.operator.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["controller"]
          env:
            # Stamps spec.version on the CatalogEntry the operator applies, so
            # the portal shows the release version (the embedded manifest.yaml
            # only carries a 0.1.0 placeholder). Mirrors the chart-templated
            # catalogentry.yaml's {{ "{{ .Chart.AppVersion }}" }}.
            - name: RAILGRID_PROVIDER_VERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- if not .Values.operator.clusterAdmin }}
            # ClusterRole the operator binds the serve ServiceAccount to for the
            # in-cluster runtime. Unset (clusterAdmin=true) falls back to
            # cluster-admin.
            - name: INFRASTRUCTURE_SERVE_CLUSTER_ROLE
              value: {{ $serveRole | quote }}
            {{- end }}
            {{- with .Values.development.previewBridge.verificationJWKS }}
            # Public verification keys are platform-global configuration. The
            # operator propagates them into each managed provider Deployment;
            # no tenant or InfrastructureProvider CR can override them.
            - name: RAILGRID_PREVIEW_BRIDGE_VERIFICATION_JWKS
              value: {{ . | quote }}
            {{- end }}
            {{- include "infrastructure.tenantNetworkPolicyEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
{{- end }}
