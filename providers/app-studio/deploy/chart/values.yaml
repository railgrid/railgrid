nameOverride: ""
fullnameOverride: ""

# The controllers (Project / Session / Studio) are leader-elected on a Lease in
# the provider workspace, so extra replicas never double-write a CR. Everything
# that touches a project's workspace tree rides project affinity and peer
# forwarding over internalPort instead. Two things are still serialized only
# within one process and so still want one replica: the workspace's shared
# single-session Playwright Browser (a default, not a guard — the chart renders
# more), and coding-sandbox claims when assistant.runSandbox.mode=force (that
# combination the chart still refuses, because those claims have no distributed
# CAS). See docs/app-studio-replica-awareness.md.
replicaCount: 1

# internalPort carries peer-forwarded project requests between replicas.
# Deliberately not part of the Service.
internalPort: 8091

image:
  repository: ghcr.io/railgrid/railgrid/app-studio-provider
  tag: ""
  pullPolicy: IfNotPresent

# Preview inspection no longer runs a browser sidecar here. The assistant drives
# the workspace's shared headless browser — the infrastructure provider's
# Playwright MCP "browser" template, provisioned once per workspace by the Studio
# reconciler — over the infrastructure data plane. Nothing to configure.

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8081

# When true, the chart renders the CatalogEntry (which registers the provider
# with the hub) into a ConfigMap that the init container applies into the
# provider workspace via the provider kubeconfig. The CatalogEntry is a kcp
# resource, so it is NOT applied to the hosting cluster this chart installs into.
# Set to false to manage the CatalogEntry separately (e.g. GitOps with a
# different rollout cadence).
catalogEntry:
  enabled: true
  renderAsConfigMap: true
  uiURL: ""
  backendURL: ""

# Dependency APIExport identity hashes.
#
# App Studio's controllers reconcile the Infrastructure provider's Instances
# and the Code provider's Repositories/RepositoryCommits through its own
# APIExport virtual workspace, which means its APIExport must CLAIM those
# kinds — and a claim on a first-party group has to name the exact export that
# serves it, by identity hash. Without them `init` fails closed rather than
# publishing an export that claims a group it cannot name.
#
# Read each hash in the workspace that hosts the dependency's provider:
#
#   kubectl get apiexport infrastructure.providers.railgrid.ai \
#     -o jsonpath='{.status.identityHash}'
#   kubectl get apiexport code.providers.railgrid.ai \
#     -o jsonpath='{.status.identityHash}'
#
# On the platform they are also listed under Admin → root identities. An org
# self-hosting infrastructure or code passes ITS OWN hashes here, which is the
# whole reason this is a value and not a constant.
apiExport:
  identityHashes:
    infrastructure.railgrid.ai: ""
    code.railgrid.ai: ""

# Secret holding the workspace-admin kubeconfig minted by the platform admin
# via /bonkers (admin onboarding). Consumed by both the init container and the
# serve container. Key must be "kubeconfig".
providerKubeconfig:
  secretName: railgrid-provider-kubeconfig

# Assistant chat behavior.
assistant:
  # How much tool-level detail the chat disclosures show.
  #   "" / "summary" (default) — tool names + per-tool sanitized summaries
  #     (paths, queries, counts — never raw file contents or secrets).
  #   "minimal" — fully opaque generic labels only ("Edited files"), for
  #     deployments whose users should not see implementation detail.
  toolDisclosure: ""
  # Provision one private, platform-owned universal coding sandbox for each
  # active assistant run. This is the source authoring/compiler/test surface;
  # it is separate from the project's hosted development preview.
  runSandbox:
    # off | byo-only | force. Force is development-only and the process
    # rejects it unless developmentMode is explicitly true.
    mode: "off"
    developmentMode: false
    # Deprecated boolean compatibility input. true maps to byo-only and emits
    # a startup warning; it never selects the platform Infrastructure export.
    enabled: null
  # Spend limits. Empty keeps the provider defaults: 200 model calls and
  # 2,000,000 weighted tokens per run, and 100 USD of model spend per
  # organization per UTC calendar month (priced from provider token usage;
  # unknown models are charged a frontier-tier rate). Only an explicit "0" or
  # "unlimited" disables a limit, which the provider logs at startup; never
  # disable them for a deployment that serves untrusted tenants. Values are
  # strings: write "0", not 0 (a bare integer 0 is dropped and the default
  # stays in force).
  limits:
    # APP_STUDIO_ASSISTANT_MAX_ITERATIONS
    maxIterations: ""
    # APP_STUDIO_ASSISTANT_ROLLOUT_BUDGET_TOKENS
    rolloutBudgetTokens: ""
    # APP_STUDIO_ORG_MONTHLY_USD_CAP (USD, decimals allowed). The cap bounds
    # spend already incurred, not spend in flight: a model call's cost is only
    # known once it returns, so the month can overshoot by at most one call per
    # call in flight when the cap is crossed, after which every call fails
    # closed.
    orgMonthlyUSDCap: ""

# Signed DOM annotation sharing starts automatically while the embedded preview
# is open. Until both signing fields are configured, App Studio stays available
# but reports the optional preview bridge as unavailable.
# The private key signs short-lived iframe capabilities. Its matching current
# and previous public JWKs are deployed independently with the preview bridge.
previewBridge:
  enabled: true
  signingKeyID: ""
  signingKeySecretRef:
    name: ""
    key: private-key.pem

# App Studio no longer holds a kubeconfig to the runtime cluster. The
# development data plane (sync, logs, restart, preview readiness) is served by
# the infrastructure provider as subresources on the project's template
# instance, reached through the hub as the calling user.
# See docs/app-studio-runtime-decoupling.md.

# Development runtime images are NOT configured here — the infrastructure
# provider owns them (its chart's development.images / RAILGRID_DEV_IMAGE_*).
# App Studio passes only the project reference. See
# providers/infrastructure/docs/template-conventions.md.

# App Studio chat-message persistence. Prefer databaseURLSecretRef in
# production; inMemoryMessageStore is an explicit non-durable fallback only.
store:
  databaseURL: ""
  databaseURLSecretRef:
    name: ""
    key: database-url
  inMemoryMessageStore: false
  # Retention window understood by Go's time.ParseDuration, e.g. "720h".
  messageRetention: ""
  # Explicit draft uploads expire after this duration; retained receipts have
  # no expiry and are removed with their Project.
  attachmentDraftRetention: "24h"
  # Maximum attachment bytes across all Projects in one workspace. Bound
  # attachments count toward this hosting quota for as long as their owning
  # conversation exists; 0 disables the workspace byte limit. Draft-only
  # per-project abuse limits remain enforced by the provider.
  attachmentWorkspaceQuotaBytes: 1073741824
  messageEncryptionKeysSecretRef:
    name: ""
    key: keys

# App Studio project workspaces. The provider stores checked-out/generated
# project files here so the agent can list, read, search, and later mutate them.
#
# Project source must survive provider pod replacement, including projects
# without Git. Use the default PVC or an existingClaim. Explicit emptyDir=true
# is suitable only for disposable development: replacing the pod loses files.
# Before upgrading an ephemeral installation, migrate its workspace tree to
# the PVC as described in README.md; changing this value does not copy data.
workspace:
  path: /var/lib/railgrid-app-studio/workspaces
  existingClaim: ""
  emptyDir: false
  persistence:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""

hub:
  url: "http://railgrid-hub.railgrid.svc.cluster.local:8080"
  # Browser-reachable HTTPS hub origin used by private preview authorization
  # redirects and one-use browser-session handoffs. Required when a Project's
  # preview is private; leave empty only when private browser inspection is not
  # used. This may differ from hub.url, which is the provider's internal route.
  publicURL: ""
  # Public hub origin used by action-enabled development runtimes. Keep this
  # separate from hub.url: the latter is an internal provider-to-hub address.
  # Production action-enabled projects require an absolute HTTPS origin.
  actionsExternalURL: ""
  # Optional public CA bundle for that origin. The referenced ConfigMap is
  # mounted at a dedicated path so it augments (never masks) image/system
  # trust. Leave empty when the origin chains to the system CA.
  actionsCABundleConfigMap:
    name: ""
    key: ca-bundle.pem
  insecure: false
  tokenSecretRef:
    name: ""
    key: token

podLabels: {}
podAnnotations: {}
podSecurityContext:
  fsGroup: 65532
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
