<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">railgrid</title>
<desc id="d">The railgrid hub at the centre of a grid: the portal, the CLI and AI agents call in on one side; providers, organization-owned providers and edges are reached on the other.</desc>
