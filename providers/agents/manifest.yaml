# Agents provider — register with the railgrid hub.
#
# The agents provider hosts long-running personal AI agents: chat, scheduled
# and heartbeat runs, tool use, and durable memory. Its runtime dependencies
# are the hub and Postgres. Instance-backed tools (a self-hosted search engine,
# a browser instance) reach tenant workloads through the infrastructure
# provider's instances/proxy verb, which this provider REQUIRES under
# spec.requires below and calls through its own APIExport virtual workspace as
# itself.
#
# Apply this against the kcp workspace where the railgrid.ai APIExport is
# bound (typically root:railgrid:providers when running embedded kcp for dev):
#
#   kubectl --kubeconfig kcp-admin.kubeconfig apply -f manifest.yaml
#
# For local dev the provider binary runs on the host (PORT=8087, Tiltfile
# run-provider-agents target) and the hub reverse-proxies the portal bundle,
# MCP, the OAuth flow and the webhooks to the loopback URLs below; the verbs
# are kcp custom subresources the shard forwards to the same address. In-
# cluster, the Helm chart renders the Service DNS instead, e.g.
#   url: http://agents.agents.svc.cluster.local:8087
#
# The spec answers four questions, one section each: export (what a tenant may
# call), requires (what this provider needs that it does not own), serving
# (where the hub reaches it) and hub (what it asks of the hub itself — nothing,
# for this provider, so the section is absent). The provider's init command
# creates the APIExport, schemas, endpoint slice, and bind grant from
# deploy/chart/files/schemas.
---
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: agents
  annotations:
    providers.railgrid.ai/builtin: "false"
spec:
  displayName: "Agents"
  description: "Long-running personal AI agents: chat, scheduled runs, tools, and durable memory."
  vendor: "railgrid"
  version: "0.1.0"
  category: "AI"
  iconURL: "/ui/providers/agents/icon.svg"

  # Everything a tenant can call, and nowhere else. Each resource names its own
  # apiVersion and kind once, and the verbs it serves hang off it: a verb IS the
  # kcp custom subresource "<resource>/<verb>". codegen emits it on the
  # generated APIExport (the shard routes it to this provider through its
  # DataPlaneEndpointSlice) together with the "<Verb>Request" schema, and
  # provider-sdk/serve derives from the same list the coordinates it dispatches.
  #
  # Declaring one grants nothing: kcp authorizes the call with ordinary RBAC on
  # {resource}/{verb} before it forwards it, and this provider's gate then
  # settles the caller's visibility of the object. A consumer provider can name
  # the coordinate under its own spec.requires and have it claimed on ITS
  # export; the hub scoped-identity service (pkg/hub/identity/policy.go clause
  # C) can mint a capability only for a verb it can verify exists here.
  #
  # Toolsets are an ordinary CR kind with no verbs and no actions, so they need
  # no entry: the APIExport serves them from the schema the chart ships.
  #
  # This provider declares no actions — every call below is an unversioned verb.
  export:
    name: "agents.railgrid.ai"
    resources:
      - name: agents
        apiVersion: agents.railgrid.ai/v1alpha1
        kind: Agent
        verbs:
          - name: chat
            description: "Hold an interactive conversation with the agent."
            stream: true
          - name: run
            description: "Start an unattended run of the agent."
          - name: sessions
            description: "List the agent's chat sessions."
            readOnly: true
          - name: session
            description: "Delete one chat session's transcript."
          - name: messages
            description: "Read one chat session's transcript."
            readOnly: true
          - name: usage
            description: "Read the agent's cost, token and latency rollups."
            readOnly: true
          - name: inbox
            description: "List the agent's pending approvals and questions."
            readOnly: true
          - name: inbox-resolve
            description: "Approve, deny or answer one of the agent's inbox items."
          - name: events
            description: "Follow the agent's run and inbox activity as it happens."
            stream: true
            readOnly: true
      # A model credential is an object, so its probes are verbs on IT rather
      # than on some agent that happens to use it. That is what makes first-run
      # work: a workspace with no agent yet can still save a credential and ask
      # whether it answers.
      - name: modelcredentials
        apiVersion: agents.railgrid.ai/v1alpha1
        kind: ModelCredential
        verbs:
          - name: test
            description: "Probe the model credential with a real chat round-trip. Optionally POST {\"model\": \"<id>\"} to probe a chat-capable model id instead of the saved one."
          - name: discover
            description: "List the chat-capable model ids the credential's endpoint serves, and refresh its status."
            readOnly: true
      # Runs are objects, so listing them, reading one and watching one are done
      # with a kube client and this provider serves no verb for it. What is left
      # is the half that is NOT on the object: the Postgres-backed trace, and
      # the two things that need the executor.
      - name: runs
        apiVersion: agents.railgrid.ai/v1alpha1
        kind: Run
        verbs:
          - name: trace
            description: "Read one run's step-level tool trace and answer."
            readOnly: true
          - name: wait
            description: "Block until the run reaches a settled phase."
            readOnly: true
          - name: cancel
            description: "Ask a run in flight to stop."
      - name: connections
        apiVersion: agents.railgrid.ai/v1alpha1
        kind: Connection
        verbs:
          - name: test
            description: "Send a test message through the connection."
          - name: enable-inbound
            description: "Register the connection's inbound webhook."
          - name: authorize
            description: "Start the connection's OAuth authorization flow."
      - name: schedules
        apiVersion: agents.railgrid.ai/v1alpha1
        kind: Schedule
        verbs:
          - name: run
            description: "Fire the schedule now, without waiting for its next tick."
      - name: triggers
        apiVersion: agents.railgrid.ai/v1alpha1
        kind: Trigger
        verbs:
          - name: run
            description: "Fire the trigger now with an empty event."

  # Everything this provider needs that it does not own, keyed by API group:
  # another provider's kinds and verbs, and the platform builtins its own
  # machinery depends on. Each entry becomes one permission claim on the
  # generated APIExport (provider-sdk/apiexportgen), resolved by kcp per
  # consumer workspace against whichever copy of that provider the workspace
  # bound — so it keeps working when an org self-hosts the dependency.
  #
  # Declaring grants nothing: a requirement reaches a workspace only once a
  # workspace or org admin accepted it in the Enable dialog. Everything here is
  # tenant-scoped by definition, so there is no per-entry scope field.
  #
  # There are no serviceaccounts / clusterroles / clusterrolebindings entries:
  # an agent's unattended identity is MINTED BY THE HUB, scoped to the exact
  # Instances that agent references and TTL'd (api/agentidentity.go,
  # provider-sdk/identityclient). The provider never writes RBAC into a
  # tenant's workspace. There is no tokenreviews entry either: service callers
  # use the same verbs and gates as everyone else.
  requires:
    # Naming a provider makes this a dependency edge as well as a claim: the hub
    # refuses to enable agents in a workspace where infrastructure is not
    # enabled yet.
    - provider: infrastructure
      group: infrastructure.railgrid.ai
      resources:
        # See the instances an agent's Connections name.
        - name: instances
          verbs: ["get", "list", "watch"]
        # The verb: an instance's HTTP data plane (a searxng instance's
        # /search, a browser instance's /mcp), served by the infrastructure
        # provider as the custom subresource instances/proxy. A claim on the
        # resource does not carry its verbs; each is its own entry, and a verb
        # coordinate carries NO verbs of its own — the verb IS the capability,
        # and the generated claim spells every verb, because kcp authorizes the
        # HTTP method as the RBAC verb on a custom subresource.
        - name: instances/proxy
    # Every provider that serves a custom subresource needs this one claim: on
    # the shard-forwarded path there is no caller bearer, so the provider runs a
    # SubjectAccessReview for the stamped caller through its own APIExport
    # virtual workspace, and kcp serves that builtin there only for an export
    # that claims it (hack/verify-provider-contract.mjs
    # subresource-access-claim). Built-in review API: no identityHash, verb
    # create only. No provider serves authorization.k8s.io, so there is nothing
    # to enable first and no provider is named.
    - group: authorization.k8s.io
      resources:
        - name: subjectaccessreviews
          verbs: ["create"]
    # The core group (no group at all): Secrets, and ONLY the ones labelled
    # railgrid.ai/owner: agents. Two kinds of Secret in the tenant workspace:
    #
    #   a ModelCredential's spec.secretRef target — the model API key. This
    #     provider's own writers default the name to
    #     railgrid-agents-model-<name>, but the object says where its key is,
    #     so a hand-written credential may point anywhere. TENANT-WRITTEN
    #     (this provider's portal, or its MCP tools, both AS THE CALLER) and
    #     read by the provider: by the ModelCredential reconciler, which
    #     decides SecretResolved / Reachable / Ready, and by unattended runs,
    #     which have no caller to borrow. So it stays inside the claim, and
    #     every writer stamps the owner label (portal/src/resources.ts,
    #     api/settings.go) — a credential whose Secret lacks it is reported
    #     as SecretResolved=False rather than failing at run time. The
    #     modelcredentials test and discover verbs read it as the caller and
    #     need no claim at all.
    #   railgrid-agents-conn-<name> — one per Connection. PROVIDER-WRITTEN:
    #     the OAuth callback stores the access and refresh tokens here
    #     (api/oauth.go), and the Connection reconciler generates the
    #     Telegram secret_token / Slack signing secret that make an inbound
    #     webhook verifiable.
    #
    # kcp claims are per resource, not per name, so the label is what stands
    # in for the name prefixes above: without the selector this claim is
    # read-write on EVERY Secret in EVERY workspace that enables this
    # provider, which is the side-door docs/cross-provider-simplification.md
    # X-4 closes. kcp stamps the label on anything this provider writes
    # through the export and hides anything that does not carry it. A claim on
    # core secrets without a selector is a contract violation
    # (hack/verify-provider-contract.mjs claim-selector).
    - resources:
        - name: secrets
          verbs: ["get", "list", "watch", "create", "update", "delete"]
          selector:
            matchLabels:
              railgrid.ai/owner: agents

  # Where the hub reaches this provider.
  serving:
    ui:
      # Dev loopback port (PORT / Tiltfile run-provider-agents). 8087 to avoid
      # colliding with quickstart (8081), kuery (8084), and app-studio (8085).
      url: "http://localhost:8087"
      indexPath: "/"
      # Sub-nav entries shown indented under "Agents" in the portal side menu.
      # The portal composes each child URL as /providers/agents/{builtinRoute}
      # and pushes the trailing segment back as railgridContext.subPath; the
      # micro-frontend maps it onto its own route in portal/src/router.ts
      # (routeForSubPath). Every builtinRoute here MUST name a real top-level
      # route in that file — an entry with no route renders a sidebar item that
      # lands on a blank page.
      #
      # Schedules and triggers are deliberately absent: they are edited on an
      # agent's Automation tab, not as a workspace-level collection, so there is
      # no route to point at.
      children:
        - displayName: Agents
          builtinRoute: agents
        - displayName: Activity
          builtinRoute: activity
        - displayName: Connections
          builtinRoute: connections
    backend:
      # The hub backend proxy forwards /services/providers/agents/* here for the
      # route classes that are not kcp API traffic: /mcp (with the caller's
      # bearer), the browser OAuth flow under /oauth/, the signed webhooks under
      # /webhooks/ and /healthz. Verbs are NOT reached this way: each is a kcp
      # custom subresource on the export above, and the shard reverse-proxies it
      # to the same address with the caller stamped in requestheader headers.
      url: "http://localhost:8087"
      healthPath: "/healthz"
    # Lets an organization run this provider in its own cluster
    # (docs/byo-providers.md). Keep manifest.yaml and
    # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
    # one that reaches production.
    selfHosting:
      supported: true
      chart:
        repository: "oci://ghcr.io/railgrid/charts"
        name: "railgrid-agents-provider"
      namespace: "railgrid-provider-agents"
      releaseName: "agents"
      docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/agents/deploy/chart/README.md"
      requiredValues:
        - name: store.databaseURLSecretRef.name
          description: >-
            Secret holding the Postgres connection URL. Postgres is this provider's only hard dependency beyond the hub — create the Secret before installing.
