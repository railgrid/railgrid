apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v261103-5b8c7b0ce.studios.ai.railgrid.ai
spec:
  group: ai.railgrid.ai
  names:
    categories:
    - railgrid
    kind: Studio
    listKind: StudioList
    plural: studios
    singular: studio
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
