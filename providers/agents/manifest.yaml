# Agents provider — register with the railgrid hub.
#
# The agents provider hosts long-running personal AI agents: chat, scheduled
# and heartbeat runs, tool use, and durable memory. It is standalone — its only
# hard dependencies are the hub and Postgres. Compute- and storage-backed
# features (the claude-code runner, the file workspace) light up only when the
# infrastructure provider is present, so infrastructure is an OPTIONAL
# dependency and is intentionally not listed under spec.dependencies.
#
# Apply this against the kcp workspace where the railgrid.ai APIExport is
# bound (typically root:railgrid:providers when running embedded kcp for dev):
#
#   kubectl --kubeconfig kcp-admin.kubeconfig apply -f manifest.yaml
#
# For local dev the provider binary runs on the host (PORT=8087, Tiltfile
# run-provider-agents target) and the hub reverse-proxies both the portal
# bundle and the /api backend to the loopback URLs below. In-cluster, the Helm
# chart renders the Service DNS instead, e.g.
#   url: http://agents.agents.svc.cluster.local:8087
#
# This CatalogEntry registers routing and references apiExport.name. The
# provider's init command creates the APIExport, schemas, endpoint slice, and
# bind grant from deploy/chart/files/schemas.
---
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: agents
  annotations:
    providers.railgrid.ai/builtin: "false"
spec:
  displayName: "Agents"
  description: "Long-running personal AI agents: chat, scheduled runs, tools, and durable memory."
  vendor: "railgrid"
  version: "0.1.0"
  category: "AI"
  iconURL: "/ui/providers/agents/icon.svg"
  ui:
    # Dev loopback port (PORT / Tiltfile run-provider-agents). 8087 to avoid
    # colliding with quickstart (8081), kuery (8084), and app-studio (8085).
    url: "http://localhost:8087"
    indexPath: "/"
    # Sub-nav entries shown indented under "Agents" in the portal side menu.
    # The portal composes each child URL as /providers/agents/{builtinRoute}
    # and pushes the trailing segment back as railgridContext.subPath; the
    # micro-frontend maps it onto its own route in portal/src/router.ts
    # (routeForSubPath). Every builtinRoute here MUST name a real top-level
    # route in that file — an entry with no route renders a sidebar item that
    # lands on a blank page.
    #
    # Schedules and triggers are deliberately absent: they are edited on an
    # agent's Automation tab, not as a workspace-level collection, so there is
    # no route to point at.
    children:
      - displayName: Agents
        builtinRoute: agents
      - displayName: Activity
        builtinRoute: activity
      - displayName: Connections
        builtinRoute: connections
  backend:
    # The hub backend proxy forwards /services/providers/agents/* here,
    # injecting the verified X-Railgrid-Tenant/X-Railgrid-User headers and the
    # caller's bearer token. The provider serves /api/* + /healthz.
    url: "http://localhost:8087"
    healthPath: "/healthz"

  apiExport:
    name: "agents.railgrid.ai"
    # The provider stores per-workspace model credentials and per-connection
    # secrets in Secrets in the tenant workspace; the claim lets it read/write
    # them as the calling user.
    permissionClaims:
      - resource: secrets
        verbs: ["get", "list", "watch", "create", "update", "delete"]
        tenantScoped: true
      # Per-agent identity for background runs. A scheduled run has no user to
      # act as, so the provider mints the agent a ServiceAccount in the tenant
      # workspace and calls the platform data plane as that identity. See
      # api/agentidentity.go. Create-only on the RBAC objects: the provider
      # grants the agent read access to instances and can never widen it to
      # anything else, because it cannot write arbitrary roles.
      - resource: serviceaccounts
        verbs: ["get", "create"]
        tenantScoped: true
      - resource: clusterroles
        group: rbac.authorization.k8s.io
        verbs: ["get", "create"]
        tenantScoped: true
      - resource: clusterrolebindings
        group: rbac.authorization.k8s.io
        verbs: ["get", "create"]
        tenantScoped: true
      # Service-to-service invocation (api/s2s.go). A caller that is not a human
      # — another provider, a job — presents its own ServiceAccount token instead
      # of a user's, so the provider authenticates and authorizes it itself:
      # TokenReview to resolve the identity, SubjectAccessReview to check it may
      # run this agent, both on the APIExport virtual workspace scoped to the
      # target cluster (kcp#4279 / kcp#4280). tenantScoped: the VW confines each
      # review to the tenant's OWN workspace and cannot reach beyond it, so this
      # is bounded. Built-in review APIs: no identityHash, verb create only.
      - group: authentication.k8s.io
        resource: tokenreviews
        verbs: [create]
        tenantScoped: true
      - group: authorization.k8s.io
        resource: subjectaccessreviews
        verbs: [create]
        tenantScoped: true
  # Lets an organization run this provider in its own cluster
  # (docs/byo-providers.md). Keep manifest.yaml and
  # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
  # one that reaches production.
  selfHosting:
    supported: true
    chart:
      repository: "oci://ghcr.io/railgrid/charts"
      name: "railgrid-agents-provider"
    namespace: "railgrid-provider-agents"
    releaseName: "agents"
    docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/agents/deploy/chart/README.md"
    requiredValues:
      - name: store.databaseURLSecretRef.name
        description: >-
          Secret holding the Postgres connection URL. Postgres is this provider's only hard dependency beyond the hub — create the Secret before installing.
