apiVersion: v1
kind: Service
metadata:
  name: {{ include "railgrid-hub.fullname" . }}
  labels:
    {{- include "railgrid-hub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.hub.providerRelay.enabled }}
    - name: provider-relay
      port: {{ .Values.hub.providerRelay.port }}
      targetPort: provider-relay
      protocol: TCP
    {{- end }}
    - name: https
      port: {{ .Values.service.hub.port }}
      targetPort: https
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.hub.nodePort }}
      nodePort: {{ .Values.service.hub.nodePort }}
      {{- end }}
  selector:
    {{- include "railgrid-hub.selectorLabels" . | nindent 4 }}
