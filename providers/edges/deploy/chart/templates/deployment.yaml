apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edges.fullname" . }}
  labels:
    {{- include "edges.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Tunnel routing (Lease registry + pod-to-pod relay) lets replicas coexist:
  # rolling updates only disconnect the agents on the replaced pod, and they
  # reconnect to a survivor. maxUnavailable 0 keeps capacity during rollouts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "edges.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edges.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "edges.serviceAccountName" . }}
      initContainers:
        # Bootstrap the provider workspace (KubernetesCluster + LinuxServer + MacOSServer
        # APIResourceSchemas, APIExport, endpoint slice, bind grant) with the
        # onboarded workspace-admin kubeconfig. The generated APIExport and its
        # schemas are baked at /etc/railgrid/kcp (Dockerfile) and applied
        # verbatim. Idempotent.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/kubeconfig
            - name: RAILGRID_KCP_DIR
              value: /etc/railgrid/kcp
            {{- if .Values.catalogEntry.enabled }}
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            # Replica-to-replica tunnel relay + forwarded pickups. Reached by
            # pod IP from peer replicas; deliberately NOT on the Service.
            - name: internal
              containerPort: {{ .Values.internalPort }}
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            # Replica identity + relay address for multi-replica tunnel
            # routing (see internalPort in values.yaml).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: EDGES_INTERNAL_PORT
              value: {{ .Values.internalPort | quote }}
            - name: RAILGRID_PROVIDER_NAME
              value: "edges"
            - name: RAILGRID_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: RAILGRID_HUB_EXTERNAL_URL
              value: {{ .Values.hub.externalURL | default .Values.hub.url | quote }}
            {{- if .Values.hub.internalURL }}
            - name: RAILGRID_HUB_INTERNAL_URL
              value: {{ .Values.hub.internalURL | quote }}
            {{- end }}
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/kubeconfig
            {{- if .Values.devMode }}
            - name: RAILGRID_DEV_MODE
              value: "true"
            {{- end }}
            {{- if .Values.allowUnverifiedSSHHostKey }}
            - name: RAILGRID_EDGES_ALLOW_UNVERIFIED_SSH_HOST_KEY
              value: "true"
            {{- end }}
            {{- if .Values.hub.insecure }}
            - name: RAILGRID_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.caData }}
            - name: RAILGRID_HUB_CA_DATA
              value: {{ .Values.hub.caData | quote }}
            {{- else if .Values.hub.caSecretRef.name }}
            - name: RAILGRID_HUB_CA_FILE
              value: /var/run/secrets/railgrid-hub-ca/{{ .Values.hub.caSecretRef.key }}
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: RAILGRID_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
            {{- if .Values.catalogEntry.enabled }}
            # The same CatalogEntry the init container applies. serve reads it
            # too: spec.export.resources[].verbs is the declaration of which
            # "<resource>/<verb>" coordinates this provider answers on the path
            # a kcp shard forwards for a custom subresource, so the routes
            # cannot drift from what the APIExport declares.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if and (not .Values.hub.caData) .Values.hub.caSecretRef.name }}
            - name: hub-ca
              mountPath: /var/run/secrets/railgrid-hub-ca
              readOnly: true
            {{- end }}
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: provider-kubeconfig
          secret:
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: kubeconfig
        {{- if and (not .Values.hub.caData) .Values.hub.caSecretRef.name }}
        - name: hub-ca
          secret:
            secretName: {{ .Values.hub.caSecretRef.name }}
        {{- end }}
        {{- if .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "edges.fullname" . }}-catalogentry
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
