---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: triggers.agents.railgrid.ai
spec:
  group: agents.railgrid.ai
  names:
    kind: Trigger
    listKind: TriggerList
    plural: triggers
    shortNames:
    - trig
    singular: trigger
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef
      name: Agent
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .status.lastFired
      name: LastFired
      type: date
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Trigger fires an agent run on an external event — the event-based half
          of automation, complementing the time-based Schedule. Webhook sources
          get a hub-routed inbound endpoint; other sources subscribe through a
          Connection.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TriggerSpec is the user-authored trigger configuration.
            properties:
              agentRef:
                description: AgentRef names the Agent this trigger drives.
                maxLength: 253
                minLength: 1
                type: string
              channelRef:
                description: |-
                  ChannelRef names the agent channel this trigger's output is delivered to
                  (a Name in the agent's spec.channels). Empty means the agent's primary
                  channel. Lets, e.g., an "incidents" trigger post to a dedicated channel.
                maxLength: 63
                type: string
              connectionRef:
                description: |-
                  ConnectionRef names the Connection backing non-webhook sources (channel,
                  github, connection). Empty for webhook sources.
                maxLength: 253
                type: string
              filter:
                additionalProperties:
                  type: string
                description: |-
                  Filter narrows which events fire the trigger. Keys are source-specific:
                  e.g. "eventType" and "labels" for github, "match" (regex) for channel,
                  "path" or "header.<name>" for webhook.
                type: object
              source:
                description: |-
                  Source is where events come from: webhook or github. Both provision a
                  hub-routed webhook endpoint and fire on inbound delivery.
                enum:
                - webhook
                - github
                type: string
              suspend:
                description: Suspend halts firing without deleting the trigger.
                type: boolean
              task:
                description: |-
                  Task is the prompt run when the trigger fires. The event payload is made
                  available to the run as additional input.
                maxLength: 32768
                type: string
            required:
            - agentRef
            - source
            type: object
          status:
            description: TriggerStatus is the observed trigger state.
            properties:
              conditions:
                description: |-
                  Conditions follows the standard Kubernetes conditions pattern. The
                  Validated condition reports whether the spec is usable as written —
                  see conditions.go.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: ConsecutiveFailures counts back-to-back failed runs from
                  this trigger.
                format: int32
                type: integer
              disabledReason:
                description: |-
                  DisabledReason is set when the provider disables the trigger on a
                  permanent error (deleted agent, revoked connection).
                type: string
              lastFired:
                description: LastFired is the most recent time an event fired a run.
                format: date-time
                type: string
              lastRunID:
                description: LastRunID references the Run produced by the most recent
                  event.
                maxLength: 128
                type: string
              webhookPath:
                description: WebhookPath is the hub-relative inbound endpoint for
                  webhook sources.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
