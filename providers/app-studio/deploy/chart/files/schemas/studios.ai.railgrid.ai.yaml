apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260919-b1e9b5e6.studios.ai.railgrid.ai
spec:
  group: ai.railgrid.ai
  names:
    categories:
    - railgrid
    kind: Studio
    listKind: StudioList
    plural: studios
    singular: studio
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      description: |-
        Studio is the workspace's shared App Studio services: the backends every
        project uses rather than each provisioning its own. Today that is web
        search — one searxng instance for the whole workspace, because a search
        index has no per-project state and N identical pods answer the same
        questions. The Studio owns its instances: deleting the Studio (or
        disabling a service) tears them down through the finalizer.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          properties:
            browser:
              description: |-
                Browser configures the workspace's shared headless browser, used for
                development-preview inspection. One Playwright instance for the whole
                workspace, provisioned through the infrastructure provider exactly like
                Search — no per-project browser, and app-studio owns no browser image.
              properties:
                disabled:
                  description: Disabled turns preview browser inspection off for this
                    workspace.
                  type: boolean
                resourceRef:
                  description: |-
                    ResourceRef is the fully-resolved instance the reconciler creates,
                    written by the API from the browser Template's instanceCRD. Same
                    self-contained contract as StudioSearch.ResourceRef.
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    resource:
                      type: string
                  type: object
                size:
                  description: Size is the browser's memory bucket, passed to the
                    template.
                  enum:
                  - small
                  - medium
                  - large
                  type: string
              type: object
            search:
              description: Search configures the workspace's web-search backend.
              properties:
                disabled:
                  description: Disabled turns web search off for every project in
                    this workspace.
                  type: boolean
                resourceRef:
                  description: |-
                    ResourceRef is the fully-resolved instance the reconciler creates,
                    written by the API from the searxng Template's instanceCRD. The
                    reconciler never reads Templates itself — they ride virtual storage
                    with their own identity, so a self-contained spec keeps the control
                    loop dependency-free (the same contract Project bindings use).
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    resource:
                      type: string
                  type: object
                size:
                  description: Size is the backend's memory bucket, passed to the
                    template.
                  enum:
                  - small
                  - medium
                  - large
                  type: string
              type: object
          type: object
        status:
          properties:
            browser:
              description: Browser reports the shared headless browser backend.
              properties:
                instance:
                  description: Instance names the backing infrastructure instance.
                  type: string
                phase:
                  description: Phase is Ready, Pending, or Disabled.
                  type: string
                reason:
                  description: Reason explains a non-Ready phase.
                  type: string
                resource:
                  description: Resource is the instance's plural resource.
                  type: string
              type: object
            conditions:
              description: |-
                Conditions carries workspace-level assertions the reconciler makes and
                no schema can. The workspace's LLM registry is a plain Opaque Secret —
                it has no CRD, so nothing validates it on write — and it used to be
                reachable only through App Studio handlers that checked it on the way
                past. Now that it is edited directly, the checks live here instead, as
                LLMRegistryValid: the registry is still wrong in exactly the same ways,
                but the workspace can see that it is.
              items:
                description: Condition contains details for one aspect of the current
                  state of this API Resource.
                properties:
                  lastTransitionTime:
                    description: |-
                      lastTransitionTime is the last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      message is a human readable message indicating details about the transition.
                      This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: |-
                      observedGeneration represents the .metadata.generation that the condition was set based upon.
                      For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                      with respect to the current state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: |-
                      reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      Producers of specific condition types may define expected values and meanings for this field,
                      and whether the values are considered a guaranteed API.
                      The value should be a CamelCase string.
                      This field may not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            phase:
              description: Phase is Ready when every enabled service is Ready.
              type: string
            search:
              description: Search reports the shared search backend.
              properties:
                instance:
                  description: Instance names the backing infrastructure instance.
                  type: string
                phase:
                  description: Phase is Ready, Pending, or Disabled.
                  type: string
                reason:
                  description: Reason explains a non-Ready phase.
                  type: string
                resource:
                  description: Resource is the instance's plural resource.
                  type: string
              type: object
            updatedAt:
              description: UpdatedAt is the last status transition the reconciler
                observed.
              format: date-time
              type: string
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
