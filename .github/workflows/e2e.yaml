name: E2E

on:
  pull_request:
    branches: [main, ssh]
  push:
    branches: [main, ssh]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR validation only; publishing runs have unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      providers: ${{ steps.changes.outputs.providers }}
      portal-matrix: ${{ steps.changes.outputs.portal-matrix }}
      image-matrix: ${{ steps.changes.outputs.image-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-changes
        id: changes

  actions-node-sdk:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: Actions Node SDK package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test package and clean alias install
        working-directory: provider-sdk/actions-node
        run: npm test && npm run test:install

  # Subprocess provider suites: hub with embedded kcp + provider binaries as
  # host processes, driven over HTTP + kcp dynamic clients. No kind, no Helm,
  # no Docker — the cheapest full-kcp coverage we have. The suites share the
  # embedded kcp's fixed etcd port (2380), so they run sequentially in one
  # job rather than as a matrix.
  e2e-providers:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: Provider suites (embedded kcp subprocesses)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # These suites build the provider binaries and assert on their behaviour,
      # so they must exercise THIS commit's provider-sdk, not the last published
      # release of it. The providers deliberately carry no `replace` (see
      # go.work.template and hack/provider-sdk-cutover.sh) — workspace mode is
      # how the monorepo develops the SDK and its consumers together, and go.work
      # is gitignored, so CI has to create it. Without this the suites silently
      # link the published SDK and test code that is not in the diff.
      - name: Set up Go workspace (in-tree provider-sdk)
        run: |
          go work init
          go work use . ./provider-sdk
          for d in providers/*/; do
            [ -f "$d/go.mod" ] && go work use "./$d"
          done
          go work edit -json | grep -c DiskPath

      - name: Run infrastructure provider e2e
        run: make e2e-infra-provider

      # e2e-provider-all is e2e-provider plus e2e-provider-flags. The flags
      # suite guards --providers validation and costs ~14s; it had no CI
      # caller, so it never ran despite copilot-instructions.md naming it a
      # suite reviewers must not weaken.
      - name: Run quickstart provider e2e
        run: make e2e-provider-all

      - name: Run kuery provider e2e
        run: make e2e-kuery-provider

      - name: Run edges provider e2e
        run: make e2e-edges

  e2e-standalone:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: Standalone (embedded kcp + static token)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The dev hub is https://console.127.0.0.1.sslip.io:9443. Public DNS
      # already answers it with 127.0.0.1; pin it anyway so a DNS hiccup at
      # sslip.io cannot fail the run.
      - name: Pin the dev hub host to loopback
        run: echo "127.0.0.1 console.127.0.0.1.sslip.io" | sudo tee -a /etc/hosts

      - name: Build binaries
        run: make build

      - name: Add bin/ to PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build hub Docker image
        run: docker build -f deploy/Dockerfile.hub -t ghcr.io/railgrid/railgrid-hub:test .

      - name: Build agent Docker image
        run: docker build -f deploy/Dockerfile.agent -t ghcr.io/railgrid/railgrid-agent:test .

      - name: Run standalone e2e
        env:
          RAILGRID_HUB_IMAGE: ghcr.io/railgrid/railgrid-hub
          RAILGRID_HUB_IMAGE_PULL_POLICY: Never
          RAILGRID_HUB_IMAGE_TAG: test
          RAILGRID_AGENT_IMAGE: ghcr.io/railgrid/railgrid-agent
          RAILGRID_AGENT_IMAGE_TAG: test
          RAILGRID_AGENT_IMAGE_PULL_POLICY: Never
        run: make e2e-standalone E2E_TIMEOUT=50m E2E_FLAGS="-ssh-keepalive-duration=30s -keep-clusters"

      - name: Collect kind cluster logs
        if: failure()
        run: |
          mkdir -p /tmp/kind-logs
          for cluster in $(kind get clusters 2>/dev/null); do
            kind export logs /tmp/kind-logs/$cluster --name "$cluster" || true
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-standalone-logs
          path: |
            *.kubeconfig
            *.log
            /tmp/kind-logs/
          retention-days: 3


  e2e-ssh:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: SSH Server-Mode (hub-only cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The dev hub is https://console.127.0.0.1.sslip.io:9443. Public DNS
      # already answers it with 127.0.0.1; pin it anyway so a DNS hiccup at
      # sslip.io cannot fail the run.
      - name: Pin the dev hub host to loopback
        run: echo "127.0.0.1 console.127.0.0.1.sslip.io" | sudo tee -a /etc/hosts

      - name: Build binaries
        run: make build

      - name: Add bin/ to PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build hub Docker image
        run: docker build -f deploy/Dockerfile.hub -t ghcr.io/railgrid/railgrid-hub:test .

      - name: Run SSH e2e
        env:
          RAILGRID_HUB_IMAGE: ghcr.io/railgrid/railgrid-hub
          RAILGRID_HUB_IMAGE_PULL_POLICY: Never
          RAILGRID_HUB_IMAGE_TAG: test
        run: make e2e-ssh E2E_TIMEOUT=30m E2E_FLAGS="-keep-clusters"

      - name: Collect kind cluster logs
        if: failure()
        run: |
          mkdir -p /tmp/kind-logs
          for cluster in $(kind get clusters 2>/dev/null); do
            kind export logs /tmp/kind-logs/$cluster --name "$cluster" || true
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ssh-logs
          path: |
            *.kubeconfig
            *.log
            /tmp/kind-logs/
          retention-days: 3
  e2e-oidc:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: OIDC (Dex + auth-code flow)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The dev hub is https://console.127.0.0.1.sslip.io:9443. Public DNS
      # already answers it with 127.0.0.1; pin it anyway so a DNS hiccup at
      # sslip.io cannot fail the run.
      - name: Pin the dev hub host to loopback
        run: echo "127.0.0.1 console.127.0.0.1.sslip.io" | sudo tee -a /etc/hosts

      - name: Add Dex hostname to /etc/hosts
        run: echo "127.0.0.1 dex.railgrid-system.svc.cluster.local" | sudo tee -a /etc/hosts

      - name: Add dexidp Helm repo
        run: |
          helm repo add dexidp https://charts.dexidp.io
          helm repo update dexidp

      - name: Build binaries
        run: make build

      - name: Add bin/ to PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build hub Docker image
        run: |
          docker build -f deploy/Dockerfile.hub \
            -t ghcr.io/railgrid/railgrid-hub:test .

      - name: Run OIDC e2e
        env:
          RAILGRID_HUB_IMAGE: ghcr.io/railgrid/railgrid-hub
          RAILGRID_HUB_IMAGE_PULL_POLICY: Never
          RAILGRID_HUB_IMAGE_TAG: test
        run: make e2e-oidc E2E_TIMEOUT=35m E2E_FLAGS="-keep-clusters"

      - name: Collect kind cluster logs
        if: failure()
        run: |
          mkdir -p /tmp/kind-logs
          for cluster in $(kind get clusters 2>/dev/null); do
            kind export logs /tmp/kind-logs/$cluster --name "$cluster" || true
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-oidc-logs
          path: |
            *.kubeconfig
            *.log
            /tmp/kind-logs/
          retention-days: 3

  e2e-external-kcp:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: External KCP (kcp via Helm + static token)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The dev hub is https://console.127.0.0.1.sslip.io:9443. Public DNS
      # already answers it with 127.0.0.1; pin it anyway so a DNS hiccup at
      # sslip.io cannot fail the run.
      - name: Pin the dev hub host to loopback
        run: echo "127.0.0.1 console.127.0.0.1.sslip.io" | sudo tee -a /etc/hosts

      - name: Add kcp Helm repo
        run: |
          helm repo add kcp-dev https://kcp-dev.github.io/helm-charts
          helm repo update kcp-dev

      - name: Build binaries
        run: make build

      - name: Add bin/ to PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build hub Docker image
        run: |
          docker build -f deploy/Dockerfile.hub \
            -t ghcr.io/railgrid/railgrid-hub:test .

      - name: Run external KCP e2e
        env:
          RAILGRID_HUB_IMAGE: ghcr.io/railgrid/railgrid-hub
          RAILGRID_HUB_IMAGE_PULL_POLICY: Never
          RAILGRID_HUB_IMAGE_TAG: test
        run: make e2e-external-kcp E2E_TIMEOUT=70m E2E_FLAGS="-keep-clusters"

      - name: Collect kind cluster logs
        if: failure()
        run: |
          mkdir -p /tmp/kind-logs
          for cluster in $(kind get clusters 2>/dev/null); do
            kind export logs /tmp/kind-logs/$cluster --name "$cluster" || true
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-external-kcp-logs
          path: |
            *.kubeconfig
            *.log
            /tmp/kind-logs/
          retention-days: 3

  # Edges data-plane connectivity: embedded-kcp hub + edges-provider as host
  # subprocesses (no hub Docker image), plus a real railgrid agent against a kind
  # cluster. Proves kubectl streams down the reverse tunnel through the hub
  # backend proxy to the out-of-process edges provider.
  e2e-edges-connectivity:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: Edges connectivity (agent tunnel → kubectl + ssh + workload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run edges connectivity e2e
        env:
          RAILGRID_E2E_ARTIFACT_DIR: ${{ runner.temp }}/railgrid-e2e-edges-connectivity
        run: make e2e-edges-connectivity E2E_EDGES_CONN_TIMEOUT=20m

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-edges-connectivity-logs
          path: ${{ runner.temp }}/railgrid-e2e-edges-connectivity/
          retention-days: 3

  # CLI suite: every user-facing `railgrid` command as a subprocess against a
  # live hub (embedded kcp, two static-token users, edges-provider). The
  # server-edge path uses the in-process test sshd; the Kubernetes-edge path
  # uses kind.
  e2e-cli:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    name: CLI (login, use, org/workspace members, edge, connect, ssh, …)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run CLI e2e
        env:
          RAILGRID_E2E_ARTIFACT_DIR: ${{ runner.temp }}/railgrid-e2e-cli
        run: make e2e-cli E2E_CLI_TIMEOUT=25m

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cli-logs
          path: ${{ runner.temp }}/railgrid-e2e-cli/
          retention-days: 3

  result:
    name: E2E result
    if: always()
    needs: [changes, actions-node-sdk, e2e-cli, e2e-edges-connectivity, e2e-external-kcp, e2e-oidc, e2e-providers, e2e-ssh, e2e-standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 hack/ci/result.py e2e
