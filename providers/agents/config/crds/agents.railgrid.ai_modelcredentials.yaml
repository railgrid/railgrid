---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: modelcredentials.agents.railgrid.ai
spec:
  group: agents.railgrid.ai
  names:
    kind: ModelCredential
    listKind: ModelCredentialList
    plural: modelcredentials
    shortNames:
    - modelcred
    singular: modelcredential
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelCredential is a named endpoint an agent reaches its model through: the
          provider flavour, the base URL, an optional default model id, and a
          reference to the tenant Secret holding the API key. Agents name one of these
          in spec.backend.model.credentials[purpose] and spec.backend.model.fallbacks —
          or, for a harness identity, in spec.backend.harness.credentialRef.

          The key itself is never on this object. It lives in the Secret named by
          spec.secretRef, written by the tenant (the portal, kubectl) and read by this
          provider — so the object is safe to list, watch and show, and the
          reconciler's status is the one place that says whether the pair actually
          works.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelCredentialSpec is the user-authored endpoint configuration.

              The rule uses size() rather than comparing against an empty string literal.
              Two adjacent apostrophes in a DOC comment are rewritten by gofmt's doc-comment
              printer into a typographic close-quote, which would turn this into a CEL
              syntax error and make the apiserver reject the whole CRD — silently, on
              whoever next runs the formatter.
            properties:
              anthropicWorkspaceID:
                description: |-
                  AnthropicWorkspaceID selects the Anthropic workspace for API keys that
                  are not scoped to one workspace. Sent only to api.anthropic.com.
                maxLength: 253
                pattern: ^(wrkspc_[A-Za-z0-9]+)?$
                type: string
              baseURL:
                description: |-
                  BaseURL is the API root the provider calls, e.g.
                  https://api.openai.com/v1. It must be an http or https URL.

                  Required for a chat endpoint (the CEL rule on this type says so) and
                  meaningless for a harness identity, which has no endpoint this process
                  ever calls — so the field is optional at the schema level and the rule
                  carries the requirement.
                maxLength: 2048
                pattern: ^(https?://[^\s]+)?$
                type: string
              connectionRef:
                description: |-
                  ConnectionRef names a ModelProviderConnection in this workspace that owns
                  the provider endpoint, workspace, and Secret. A model binding supplies only
                  its Model; references cannot be chained or point at a coding-harness
                  identity. The provider and Secret key defaults are admitted for the
                  Kubernetes defaults inserted on every object, but a binding cannot override
                  either value.
                maxLength: 253
                pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                type: string
              model:
                description: |-
                  Model is the default model id runs use, e.g. gpt-4o. Optional so a
                  credential can be saved before its endpoint has been asked what it
                  serves; an agent cannot run on a credential without one.
                maxLength: 253
                type: string
              provider:
                default: openai-compatible
                description: |-
                  Provider selects what kind of credential this is: a chat endpoint
                  ("openai-compatible", the default, or "openai") or a coding-harness
                  identity ("claude-code", "codex"). See the provider constants.
                enum:
                - openai-compatible
                - openai
                - claude-code
                - codex
                type: string
              secretKey:
                default: apiKey
                description: SecretKey is the key inside the referenced Secret holding
                  the API key.
                maxLength: 253
                type: string
              secretRef:
                description: |-
                  SecretRef names the Secret in namespace "default" of this workspace
                  holding the API key.

                  The Secret MUST carry the label railgrid.ai/owner: agents. This
                  provider's `secrets` permission claim is scoped to that label
                  (manifest.yaml, provider-sdk/claimscope), so kcp hides anything without
                  it from the provider's APIExport virtual workspace — an unlabelled
                  Secret saves cleanly and is then invisible to every unattended run.
                properties:
                  name:
                    description: Name is the Secret's name.
                    maxLength: 253
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: spec.baseURL is required for a chat endpoint provider
              rule: (has(self.connectionRef) && size(self.connectionRef) > 0) || self.provider
                in ['claude-code','codex'] || (has(self.baseURL) && size(self.baseURL)
                > 0)
            - message: a direct connection needs spec.secretRef
              rule: (has(self.connectionRef) && size(self.connectionRef) > 0) || (has(self.secretRef)
                && has(self.secretRef.name) && size(self.secretRef.name) > 0)
            - message: a referenced model inherits its endpoint and secret from a
                chat connection
              rule: '!has(self.connectionRef) || size(self.connectionRef) == 0 ||
                ((has(self.model) && size(self.model) > 0) && (!has(self.baseURL)
                || size(self.baseURL) == 0) && (!has(self.secretRef) || !has(self.secretRef.name))
                && !(self.provider in [''claude-code'',''codex'']))'
            - message: a referenced model inherits its Anthropic workspace from its
                connection
              rule: '!has(self.connectionRef) || size(self.connectionRef) == 0 ||
                !has(self.anthropicWorkspaceID) || size(self.anthropicWorkspaceID)
                == 0'
            - message: a referenced model inherits its Secret key from its connection
              rule: '!has(self.connectionRef) || size(self.connectionRef) == 0 ||
                !has(self.secretKey) || self.secretKey == ''apiKey'''
            - message: a referenced model inherits its provider from its connection
              rule: '!has(self.connectionRef) || size(self.connectionRef) == 0 ||
                !has(self.provider) || self.provider == ''openai-compatible'''
          status:
            description: ModelCredentialStatus is what the reconciler observed about
              the pair.
            properties:
              conditions:
                description: |-
                  Conditions carries SecretResolved, Reachable and Ready — see
                  conditions.go.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastProbeError:
                description: |-
                  LastProbeError explains the last failed probe. Never carries the key or
                  an upstream response body verbatim.
                maxLength: 512
                type: string
              lastProbeTime:
                description: LastProbeTime is when the endpoint was last called.
                format: date-time
                type: string
              models:
                description: |-
                  Models are the agent model candidates retained from the last successful
                  probe of GET {baseURL}/models — not everything the endpoint serves.

                  An endpoint answers with every model the account can reach: speech,
                  transcription, embeddings, images, realtime, moderation, and specialized
                  model families that Agents does not currently route. On the official
                  OpenAI endpoint, Agents uses Responses for GPT-6 models and selected
                  reasoning configurations on supported earlier models. Custom gateways
                  default to Chat Completions, and this does not imply support for every
                  Responses-only family.
                  llm.FilterChatModels applies discovery curation, retaining catalog-known
                  candidates first in catalog order and other candidates alphabetically.

                  Bounded: an aggregator can serve thousands, and an API object is not the
                  place to mirror all of them.
                items:
                  maxLength: 253
                  type: string
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the conditions below were
                  computed from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
