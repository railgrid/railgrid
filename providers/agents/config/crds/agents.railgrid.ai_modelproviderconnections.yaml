---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: modelproviderconnections.agents.railgrid.ai
spec:
  group: agents.railgrid.ai
  names:
    kind: ModelProviderConnection
    listKind: ModelProviderConnectionList
    plural: modelproviderconnections
    shortNames:
    - modelconn
    singular: modelproviderconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.baseURL
      name: Endpoint
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelProviderConnection is a workspace-local provider account configuration.
          ModelCredential objects reference it; only its Secret holds the API key.
          RBAC get lists configuration; the separate use verb permits model requests.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelProviderConnectionSpec contains transport and authentication
              only.
            properties:
              anthropicWorkspaceID:
                maxLength: 253
                pattern: ^(wrkspc_[A-Za-z0-9]+)?$
                type: string
              baseURL:
                maxLength: 2048
                minLength: 1
                pattern: ^https?://[^\s]+$
                type: string
              provider:
                default: openai-compatible
                enum:
                - openai-compatible
                - openai
                type: string
              secretKey:
                default: apiKey
                maxLength: 253
                type: string
              secretRef:
                description: |-
                  ModelCredentialSecretRef names a Secret in namespace "default" of the
                  workspace this ModelCredential lives in.
                properties:
                  name:
                    description: Name is the Secret's name.
                    maxLength: 253
                    type: string
                type: object
            required:
            - baseURL
            - secretRef
            type: object
            x-kubernetes-validations:
            - message: spec.secretRef.name is required
              rule: has(self.secretRef.name) && size(self.secretRef.name) > 0
          status:
            description: ModelCredentialStatus is what the reconciler observed about
              the pair.
            properties:
              conditions:
                description: |-
                  Conditions carries SecretResolved, Reachable and Ready — see
                  conditions.go.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastProbeError:
                description: |-
                  LastProbeError explains the last failed probe. Never carries the key or
                  an upstream response body verbatim.
                maxLength: 512
                type: string
              lastProbeTime:
                description: LastProbeTime is when the endpoint was last called.
                format: date-time
                type: string
              models:
                description: |-
                  Models are the agent model candidates retained from the last successful
                  probe of GET {baseURL}/models — not everything the endpoint serves.

                  An endpoint answers with every model the account can reach: speech,
                  transcription, embeddings, images, realtime, moderation, and specialized
                  model families that Agents does not currently route. On the official
                  OpenAI endpoint, Agents uses Responses for GPT-6 models and selected
                  reasoning configurations on supported earlier models. Custom gateways
                  default to Chat Completions, and this does not imply support for every
                  Responses-only family.
                  llm.FilterChatModels applies discovery curation, retaining catalog-known
                  candidates first in catalog order and other candidates alphabetically.

                  Bounded: an aggregator can serve thousands, and an API object is not the
                  place to mirror all of them.
                items:
                  maxLength: 253
                  type: string
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the conditions below were
                  computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
