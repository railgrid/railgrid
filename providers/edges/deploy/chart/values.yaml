## railgrid-edges-provider values
## Single self-contained edge provider: terminates agent reverse tunnels
## (revdial) for KubernetesCluster, LinuxServer, and MacOSServer kinds, owns the
## API, runs the token/RBAC/lifecycle controllers, and proxies
## kubectl/SSH/MCP/Services down the tunnel. MacOSServer is Service-only. It reads a kcp provider kubeconfig at runtime (token validation +
## cross-tenant controllers).

# Container image. Build (context = REPO ROOT) with:
#   docker build -f providers/edges/Dockerfile -t IMAGE .
image:
  repository: ghcr.io/railgrid/railgrid-edges-provider
  tag: ""  # empty → defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Safe to scale: each agent dials ONE replica; the replica terminating the
# tunnel claims it in a Lease registry in the provider workspace, and every
# other replica relays pickups and data-plane requests to the owner over the
# internal listener (pod-to-pod on internalPort, never exposed on the
# Service). Killing a replica disconnects only its agents, which reconnect to
# a survivor.
replicaCount: 1

# internalPort carries the replica-to-replica tunnel relay and forwarded
# revdial pickups. Deliberately not part of the Service.
internalPort: 8090

service:
  type: ClusterIP
  port: 8088

# Hub wiring.
hub:
  # Heartbeat + agent-kubeconfig externalization base. In-cluster Service DNS.
  url: https://railgrid-hub.railgrid.svc.cluster.local:9443
  # External URL agents dial (baked into the agent kubeconfig the RBAC
  # reconciler mints). Defaults to hub.url when empty.
  externalURL: ""
  # Internal URL the provider uses for hub-side calls when it differs from the
  # external one (split-horizon deployments). Optional.
  internalURL: ""
  # Bearer token for the heartbeat POST. Secret-backed; empty → unauthenticated
  # heartbeat (dev only).
  tokenSecretRef:
    name: ""
    key: token
  # Skip TLS verify on heartbeat — dev only.
  insecure: false
  # Hub CA bundle (PEM) embedded into per-agent kubeconfigs so agents trust the
  # hub serving cert. Provide EITHER caData (inline PEM) or caSecretRef.
  caData: ""
  caSecretRef:
    name: ""
    key: ca.crt

# Enables dev-mode shortcuts in the controllers (e.g. relaxed kubeconfig CA).
devMode: false

# Legacy escape hatch: open SSH sessions to LinuxServers that have NO known
# sshd host key (no spec.sshHostKey pin and no agent-reported status.sshHostKey)
# without verifying the server. Edges with a known key are always verified.
# Prefer pinning spec.sshHostKey or sshHostKeyPolicy=tofu on the edge instead.
allowUnverifiedSSHHostKey: false

# Secret holding the workspace-admin kubeconfig minted via /bonkers (admin
# onboarding). Used by BOTH the init container (applies the generated APIExport
# + schemas from /etc/railgrid/kcp) and the serve container (token validation +
# cross-tenant controllers). Key must be "kubeconfig".
providerKubeconfig:
  secretName: railgrid-provider-kubeconfig

# Render the CatalogEntry into a ConfigMap the init container applies into the
# provider workspace (it is a kcp resource, not a host-cluster one).
catalogEntry:
  enabled: true

serviceAccount:
  create: true
  name: ""   # empty → release-name

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
