          resource: repositories
        inputSchema:
          type: object
          required:
          - repositoryUID
          - connectionUID
          - number
          - repository
          properties:
            repositoryUID: *id001
            connectionUID: *id001
            number: &id006
              type: integer
              minimum: 1
            repository:
              type: string
              minLength: 3
              maxLength: 201
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        schemaDigest: sha256:5a658622b1e1e7588ecc82f63451c9da9e7266a4e15ac093606871c5f45968a3
        executionMode: sync
        readOnly: true
        risk: low
        idempotency: inherent
        limits:
          timeoutSeconds: 180
          maxInputBytes: 65536
          maxOutputBytes: 524288
          maxResultItems: 50
        consent:
          required: false
      - id: create_pull_request/v1
