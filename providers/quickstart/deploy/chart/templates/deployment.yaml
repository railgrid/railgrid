apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quickstart.fullname" . }}
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quickstart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quickstart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "quickstart.serviceAccountName" . }}
      initContainers:
        # Bootstrap the provider workspace (schemas, APIExport, slice, bind
        # grant) with the onboarded workspace-admin kubeconfig. The generated
        # APIExport and its schemas are baked at /etc/railgrid/kcp (Dockerfile)
        # and applied verbatim. Idempotent.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            - name: RAILGRID_KCP_DIR
              value: /etc/railgrid/kcp
            {{- if .Values.catalogEntry.enabled }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it to
            # the hosting cluster. It is rendered into a ConfigMap (mounted below)
            # and init self-registers it into the provider workspace via the
            # provider kubeconfig.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          # Liveness is /healthz ("the process is up"); readiness is /readyz
          # ("tenant workspaces are actually being watched"). Keep them
          # different: restarting a provider whose virtual workspace is
          # unreachable takes away the work it is still doing.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: "8081"
            - name: RAILGRID_HUB_URL
              value: {{ .Values.hub.url | quote }}
            - name: RAILGRID_PROVIDER_NAME
              value: "quickstart"
            {{- if .Values.hub.insecure }}
            - name: RAILGRID_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: RAILGRID_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
            # The serve container needs the same kubeconfig the init container
            # used, for two things: the multicluster controller manager watches
            # tenant workspaces through the APIExport virtual workspace, and the
            # data-plane verb acts as the provider through that same virtual
            # workspace — kcp forwards a verb with the caller's identity
            # stamped and no bearer, so the gate reviews and reads as itself.
            - name: RAILGRID_PROVIDER_KUBECONFIG
              value: /var/run/secrets/railgrid/railgrid-provider-kubeconfig
            {{- if .Values.catalogEntry.enabled }}
            # The same CatalogEntry the init container applies. serve reads it
            # too: spec.export.resources[].verbs is the declaration of which
            # "<resource>/<verb>" coordinates this provider answers on the path
            # a kcp shard forwards for a custom subresource, so the routes
            # cannot drift from what the APIExport declares.
            - name: RAILGRID_CATALOGENTRY_FILE
              value: /etc/railgrid/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: railgrid-provider-kubeconfig
              mountPath: /var/run/secrets/railgrid
              readOnly: true
            {{- if .Values.catalogEntry.enabled }}
            - name: catalogentry
              mountPath: /etc/railgrid/catalogentry
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Required: the workspace-admin kubeconfig minted via /bonkers (admin
        # onboarding). Both the init container and the serve container mount it.
        - name: railgrid-provider-kubeconfig
          secret:
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: railgrid-provider-kubeconfig
        {{- if .Values.catalogEntry.enabled }}
        - name: catalogentry
          configMap:
            name: {{ include "quickstart.fullname" . }}-catalogentry
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
