{{- if and .Values.bootstrap.enabled .Values.catalogEntry.enabled -}}
# GENERATED FROM ../../../manifest.yaml — DO NOT EDIT.
# Edit manifest.yaml and run:
#   cd providers/infrastructure && go test -run TestChartCatalogEntryIsGeneratedFromManifest ./... -update
#
# Only rendered in bootstrap mode (bootstrap.enabled): the bootstrap init
# container mounts this ConfigMap and applies the CatalogEntry into kcp via the
# provider kubeconfig. In hub-provisioned mode (bootstrap.enabled=false) there is
# no init container, so the entry is registered out-of-band, not from here.
#
# The CatalogEntry is a kcp resource (providers.railgrid.ai/v1alpha1), so it
# MUST NOT be applied to the hosting cluster where this chart installs. Instead
# the chart renders it into the ConfigMap below; the init container mounts it
# and applies it into the provider workspace via the provider kubeconfig
# (RAILGRID_CATALOGENTRY_FILE -> sdkinstall.Bootstrap). Operator mode
# (operator.enabled=true) applies the same manifest from the binary's own copy,
# which is why it requires catalogEntry.enabled=false.
#
# ════════════════════════════════════════════════════════════════════════
# Provider object reference — kind: CatalogEntry (providers.railgrid.ai)
#
# A CatalogEntry registers one provider ("plugin") with the railgrid hub. The
# hub's catalog controller reconciles it into the provider sub-workspace
# root:railgrid:providers:<name>, a ServiceAccount + runtime kubeconfig, the
# APIExport tenants APIBind to, and a routing entry backing
# /ui/providers/<name>/* and /services/providers/<name>/*.
#
# spec:
#   displayName              Title on the portal catalog card + side nav. [required]
#   description              Short blurb on the catalog card.
#   vendor                   Provider author.
#   version                  Provider/chart version (informational).
#   category                 Groups the entry under a portal nav heading.
#   iconURL                  Portal-relative icon path (served via the UI proxy).
#   serviceAccountNamespace  Host namespace the provider Deployment runs in;
#                            the hub writes railgrid-provider-kubeconfig here.
#   ui:                      Micro-frontend (omit for a UI-less provider).
#     url                      Address the hub reverse-proxies for
#                              /ui/providers/<name>/* (exclusive with builtinRoute).
#     indexPath                Default landing path within the UI (default "/").
#     builtinRoute             Portal renders an in-tree route by this name
#                              instead of loading a bundle (first-party providers).
#     children[]               Sub-nav entries: {displayName, builtinRoute}.
#   backend:                 Custom HTTP backend (omit for CR-only providers).
#     url                      Address proxied at /services/providers/<name>/*
#                              (NOT for CRD traffic — CRs flow through kcp).
#     healthPath               GET path that gates the BackendHealthy status.
#                              Reserved hub-only prefixes on this origin
#                              (/actions data plane is public; /workload-identities
#                              is refused by the backend proxy and dialed only
#                              by the hub).
#   apiExport:               The provider's kcp APIExport.
#     name                     Fully-qualified APIExport name tenants APIBind to.
#     permissionClaims[]       Access the provider needs in tenant workspaces:
#                              {resource, group, verbs, tenantScoped}. tenantScoped:
#                              true auto-accepts on Enable.
#     schemas[]                Inline APIResourceSchemas to install ({groupResource,
#                              body}); [] = pure broker, no CRDs leak to tenants.
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infrastructure.fullname" . }}-catalogentry
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.railgrid.ai/v1alpha1
    kind: CatalogEntry
    metadata:
      name: infrastructure
    spec:
      displayName: "Application Templates"
      description: "Provision applications and infrastructure from curated templates."
      vendor: "railgrid"
      version: {{ .Chart.AppVersion | quote }}
      category: "Workloads"
      iconURL: "/ui/providers/infrastructure/icon.svg"
      # Local dev (Tilt / Makefile): the provider binary runs on the host
      # at PORT=8082 — distinct from the quickstart provider's :8081 so
      # both can run side-by-side. For in-cluster deployment, change to
      # the Service DNS, e.g.
      # http://infrastructure.infrastructure.svc.cluster.local:8081.
      ui:
        url: "http://{{ include "infrastructure.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
        # Sub-nav entries shown indented under "Application Templates" in
        # the portal side menu. The portal composes each child URL as
        # /providers/infrastructure/{builtinRoute}; the micro-frontend
        # reads the trailing segment off railgridContext.subPath and routes
        # to the matching internal page. Mirrors kubernetes-edges → Workloads.
        children:
          - displayName: Templates
            builtinRoute: templates
          - displayName: Instances
            builtinRoute: instances
      backend:
        url: "http://{{ include "infrastructure.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/readyz"
      apiExport:
        name: "infrastructure.providers.railgrid.ai"
        # Secrets, read-only, and ONLY the ones labelled
        # railgrid.ai/owner: infrastructure. This provider writes no Secret in a
        # tenant workspace at all — every Secret it creates lives in its own
        # runtime cluster — so here the owner label does not mean "written by
        # infrastructure", it means "entrusted TO infrastructure": the tenant's
        # (or another provider's) explicit hand-over of one named credential,
        # which is exactly the consent a blanket claim skipped
        # (docs/cross-provider-simplification.md §2.1 finding 1, X-4).
        #
        # Two Secrets reach this claim, both named by a typed field on the
        # Instance and both read by the instance controller
        # (controller/instance/bridge.go):
        #
        #   spec.imagePullSecretRef   a dockerconfigjson pull credential. App
        #     Studio mints it on promote, AS THE CALLER, and labels it for this
        #     provider; naming it on the Instance and labelling it are the same
        #     act of hand-over.
        #   spec.oidcBridgeSecretRef  a BYO OIDC client secret the tenant writes
        #     by hand. The tenant labels it; an unlabelled one comes back as
        #     SecretsBridged=False/SecretRefNotFound rather than being read.
        #
        # The `cloud-credentials` Secret is NOT in this claim and never was in
        # practice: tenant/credentials.go reads it as the CALLER through the hub
        # kcp proxy, so kcp's own RBAC decides, and no claim is involved.
        #
        # tenantScoped: true triggers auto-accept per docs/providers.md
        # decision #9.
        permissionClaims:
          # Every provider that serves a custom subresource needs this one claim:
          # on the shard-forwarded path there is no caller bearer, so the provider
          # runs a SubjectAccessReview for the stamped caller through its own
          # APIExport virtual workspace, and kcp serves that builtin there only for
          # an export that claims it (hack/verify-provider-contract.mjs
          # subresource-access-claim). Built-in review API: no identityHash, verb
          # create only; tenantScoped because the VW confines each review to the
          # tenant's OWN workspace.
          - group: authorization.k8s.io
            resource: subjectaccessreviews
            verbs: [create]
            tenantScoped: true
          - resource: secrets
            verbs: [get, list, watch]
            tenantScoped: true
            selector:
              matchLabels:
                railgrid.ai/owner: infrastructure
        # No static schemas. The provider's own `init` installs the Template and
        # Instance schemas and upserts the APIExport. The Template controller does
        # NOT touch the APIExport: tenants author the single flattened Instance
        # kind, so adding or changing a Template never changes the export's
        # resource list (controller/template/controller.go).
      # Data-plane verbs this provider serves, declared so the coordinate is
      # machine-readable. Declaring one grants nothing: every call is still
      # authorized on {resource}/{verb}, as the caller, by this provider's own
      # gates. What the declaration buys, per verb: codegen emits the kcp custom
      # subresource "<resource>/<verb>" on the generated APIExport (the shard routes
      # it to this provider through its DataPlaneEndpointSlice) together with the
      # "<Verb>Request" schema the entry names; a consumer provider can compose the
      # coordinate under spec.dependencies[].composes[] and have it claimed on ITS
      # export; and the hub scoped-identity service (pkg/hub/identity/policy.go
      # clause C) can mint a capability only for a verb it can verify exists. None
      # of this is a permission claim of this provider: a claim names another
      # export's resources, never one's own verbs.
      dataPlane:
        verbs:
          - resource: instances
            verb: env
            description: "Set or read the instance's runtime environment."
          - resource: instances
            verb: exec
            description: "Open an interactive shell or run a command in the instance."
            stream: true
          - resource: instances
            verb: log
            description: "Stream the instance's logs."
            stream: true
            readOnly: true
          - resource: instances
            verb: process
            description: "List the processes running in the instance."
            readOnly: true
          - resource: instances
            verb: proxy
            description: "Proxy HTTP to the instance's own service."
            stream: true
          - resource: instances
            verb: restart
            description: "Restart the instance's workload."
          - resource: instances
            verb: runtime-status
            description: "Read the instance's live runtime status."
            readOnly: true
          - resource: instances
            verb: sync
            description: "Trigger a reconcile of the instance's desired state."
          - resource: instances
            verb: workspace
            description: "Read and write files in the instance's workspace."
      # Self-hosting: run Application Templates in your own cluster, so provisioned
      # workloads land there rather than on the platform. See docs/byo-providers.md.
      #
      # This provider self-bootstraps rather than waiting for a hub-delivered
      # credential, so the install must point it at the Secret you created and at
      # your organization's own workspace. {{`{{workspacePath}}`}} is substituted by the
      # hub when it renders the instructions. Keep in lockstep with
      # deploy/chart/templates/catalogentry.yaml.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/railgrid/charts"
          name: "railgrid-infrastructure-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "railgrid-provider-infrastructure"
        releaseName: "infrastructure"
        docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/infrastructure/deploy/chart/README.md"
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
        # Operator mode — the same mode the production install runs in, and the only
        # one that stands a provider up unattended. It bootstraps your workspace,
        # installs kro, and owns the serve Deployment together with the
        # runtime-cluster RBAC that Deployment needs. The superseded bootstrap.*
        # init-container flow does none of the last two, so a self-hoster following
        # it lands a serve pod with no permissions on its own runtime cluster.
        requiredValues:
          - name: operator.enabled
            value: "true"
            description: >-
              Installs the provider's operator, which bootstraps your workspace,
              installs kro, and runs the provider itself.
          - name: operator.providerKubeconfigSecret.name
            value: "{{`{{kubeconfigSecret}}`}}"
            description: Secret holding the workspace credential.
          - name: operator.providerKubeconfigSecret.key
            value: "{{`{{kubeconfigSecretKey}}`}}"
            description: Data key inside that Secret.
          - name: catalogEntry.enabled
            value: "false"
            description: >-
              The operator registers the provider from its own embedded manifest, so
              the chart must not also render a CatalogEntry ConfigMap — that copy is
              applied by the init container this mode does not run.
          - name: hub.url
            value: "{{`{{hubURL}}`}}"
            description: Where the provider reports its health.
          - name: codingSandbox.enabled
            value: "true"
            description: >-
              Opts into the platform-owned universal coding sandbox on this BYO
              installation. Hosted platform defaults keep this feature disabled.
          - name: development.images.universal
            description: >-
              Required immutable universal toolchain image for tenant code. Use a
              complete name@sha256:<64 lowercase hex digits> reference; mutable
              tags are rejected by chart/operator validation.
          - name: development.agentImage
            description: >-
              Required immutable railgrid-dev-agent injector/bootstrap image for the
              universal sandbox. Use a complete
              name@sha256:<64 lowercase hex digits> reference; mutable tags are
              rejected by chart/operator validation.
          # Exposure. Published apps are reached through YOUR ingress — the platform
          # has no route into your cluster and cannot supply any of this. Declared
          # with no value so the hub renders them as <value> and says so, rather
          # than emitting a command that looks complete and silently disables
          # publishing. Omit all three and templates that publish an app fail their
          # reconcile with a clear message; everything else still provisions.
          - name: operator.application.baseDomain
            description: >-
              DNS zone your published apps are served under, e.g. apps.example.com.
              Each app gets <name>-<hash>.<zone>, so this zone must resolve to your
              Gateway. Required for app publishing; without it that feature stays
              off.
          - name: operator.application.gateway.name
            description: >-
              Name of the Gateway API Gateway the generated HTTPRoutes attach to.
              It must already exist in your cluster — the provider attaches routes,
              it does not create the Gateway or its listeners.
          - name: operator.application.gateway.namespace
            description: Namespace holding that Gateway.
          - name: operator.publishing.hubPublicURL
            value: "{{`{{hubURL}}`}}"
            description: >-
              Browser-reachable hub address a visitor is redirected to when signing
              in to a private app. Must be the public URL, not an in-cluster one —
              it ends up in a redirect the user's browser follows.
          - name: operator.publishing.accessProxyImage
            value: {{ .Values.publishing.accessProxyImage | quote }}
            description: >-
              Access gate every published app's traffic enters through. It speaks
              the hub's app-access protocol, so pin it to the build your platform
              runs rather than letting it float.
{{- end }}
