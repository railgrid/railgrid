apiVersion: infrastructure.railgrid.ai/v1alpha1
kind: Template
metadata:
  name: worker
spec:
  displayName: "Background worker"
  description: "A long-running background process — Deployment only, no Service, no URL. Queue consumers, bots, pollers. Development-capable: can back an App Studio project with a hot-reload dev process."
  category: Workloads
  version: 0.2.0
  # exposure: what the platform tells callers about reaching an instance.
  # A background consumer. Reachable only through its dataPlane verbs.
  exposure: internal
  backend: kro
  # One-click provision defaults for the portal form. nginx is a stand-in
  # long-running process that always starts; a real worker replaces it.
  sampleValues:
    name: demo-worker
    image: nginx:latest
  # Operational guidance for AI agents discovering this template over MCP.
  agent:
    usage: |
      Runs ONE container as a long-running background process with NO network
      exposure: no Service, no route, no URL. Choose this for queue consumers,
      chat/Discord/Telegram bots, pollers, and schedulers that run
      continuously. It is NOT reachable over HTTP — if the app must serve
      requests, use simple-webapp (one container + URL) or application
      (frontend + API + database). For work that runs on a schedule and exits,
      use the cron-job template instead.

      PRODUCTION MODE — you supply exactly one container image (the image
      input) and nothing else:
        • The entrypoint must run FOREVER; a process that exits is restarted
          (crash-looping is treated as failure, not completion).
        • Stateless — no persistent disk. Pods may be restarted or scaled
          (the replicas input). Durable state belongs in a database template
          instance, a queue/cache in a redis-cache instance — connect them
          with the connections input (below); never read their Secret
          yourself.
        • Configuration comes from your image, the env input, and the
          connection env vars below; nothing else is injected.

      CONNECTIONS (the connections input; applies in both modes):
        • connections.database: <values.name of a database instance in this
          workspace> → DATABASE_URL =
          `postgres://appuser:<password>@<name>-db:5432/appdb`. The URI has
          NO sslmode and the in-cluster Postgres has TLS disabled, so connect
          with sslmode=disable (append `?sslmode=disable` / set it if your
          driver defaults to TLS, e.g. Node `pg`, JDBC).
        • connections.cache: <values.name of a redis-cache instance> →
          REDIS_URL = `redis://:<password>@<name>:6379`.
        • Unset (default "") = not connected; the variable is left unset. A
          name that is set makes the pod wait until that instance's Secret
          exists, so it must name a real instance in THIS workspace.
        • The database/cache may not be ready when the worker starts: RETRY
          the first connection instead of exiting, and run schema
          creation/migrations idempotently inside that same retry loop.

      DEVELOPMENT MODE (provision with railgridMode: development): the image
      input is ignored (and may be omitted) — the platform runs a Node.js dev
      container against the project workspace (workspacePath "."). The dev
      process is `npm run dev` (falling back to `npm start`); push source with
      the dev_sync tool (hot reload, no image builds), read logs with
      dev_logs, and restart with dev_restart.

      INPUTS you set when provisioning: name (required); image (required in
      production, ignored in development), replicas, env (env-var map; not for
      secrets), connections.database / connections.cache (see CONNECTIONS).
      All except name and railgridMode can be changed later with
      update_instance.
    outputs:
      - "status.ready — ready replica count for the worker Deployment."
  # ── Portal presentation ───────────────────────────────────────────────
  view:
    detail:
      - title: Readiness
        fields:
          - label: Worker
            path: status.ready
  instanceCRD:
    group: infrastructure.railgrid.ai
    version: v1alpha1
    resource: workers
    kind: Worker
  schema:
    type: object
    properties:
      name:
        type: string
        description: "Logical name; used as the Deployment name in the tenant namespace."
      image:
        type: string
        description: "Container image running the background process. Required in production mode; ignored (and may be omitted) when railgridMode is development — dev mode runs the platform dev image against the project workspace."
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 5
      env:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: "Environment variables for the container, injected via a ConfigMap + envFrom (updatable in place). DATABASE_URL / REDIS_URL from a set connection win on name conflicts. Values are stored world-readable — not for secrets; use connections for database/cache credentials."
      # Fixed connection slots rendered as literal secretKeyRef env entries —
      # same shape and rationale as simple-webapp's connections input.
      connections:
        type: object
        default: {}
        description: "Sibling instances in this workspace whose credentials are injected as env, read from their Secret (never templated in clear). Empty = not connected."
        properties:
          database:
            type: string
            default: ""
            pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 50
            description: "values.name of a database instance in this workspace; its connection URI is injected as DATABASE_URL (no sslmode; in-cluster TLS is off, so use sslmode=disable). The pod waits until that instance's Secret exists."
          cache:
            type: string
            default: ""
            pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 63
            description: "values.name of a redis-cache instance in this workspace; its connection URI is injected as REDIS_URL. The pod waits until that instance's Secret exists."
    required:
      - name
    # The image is only required when the instance actually runs it: production
    # mode. Enforced on the kcp-side CRD; railgridMode defaults to "production".
    x-kubernetes-validations:
      - rule: "(has(self.railgridMode) && self.railgridMode == 'development') || has(self.image)"
        message: "image is required in production mode"

  # ── Development mode (docs/app-studio-template-sandboxes.md) ──────────
  # Single component claiming the whole project workspace. The component
  # declares no port — a worker serves no traffic; the dev overlay still
  # injects the control port for sync/logs/restart.
  development:
    components:
      worker:
        workspacePath: .
        devImage: "${railgrid.devImage.node}"
        workingDir: /workspace
        startCommand: "npm run dev || npm start"
        reload:
          strategy: process
          rules:
            - paths: ["package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml"]
              command: "npm install --no-audit --no-fund"

  # ── Data plane (development mode) ─────────────────────────────────────
  # Per-component control verbs, served as
  # …/workers/<name>/components/worker/{sync,restart,log,env,process}. Production
  # mode answers 409 instance-not-ready — the data plane is a
  # development-mode surface.
  dataPlane:
    runtimeNamespacePath: status.runtimeNamespace
    tokenSecretPath: status.controlSecretRef
    endpoints:
      runtime-status:
        fromStatus: true
    components:
      worker:
        endpoints:
          sync:
            servicePath: status.components.worker.controlServiceRef
            port: control
            upstreamPath: /sync
            methods: ["POST"]
          restart:
            servicePath: status.components.worker.controlServiceRef
            port: control
            upstreamPath: /restart
            methods: ["POST"]
          env:
            servicePath: status.components.worker.controlServiceRef
            port: control
            upstreamPath: /env
            methods: ["POST"]
          log:
            servicePath: status.components.worker.controlServiceRef
            port: control
            upstreamPath: /logs
            methods: ["GET"]
            stream: true
          process:
            servicePath: status.components.worker.controlServiceRef
            port: control
            upstreamPath: /status
            methods: ["GET"]

  # ── backendConfig: the kro resource graph ─────────────────────────────
  # namespace: default is remapped to the per-tenant namespace on the runtime
  # cluster — same convention as every seed template. The graph id follows
  # the dev-overlay convention: component "worker" → id "workerDeployment".
  backendConfig:
    resources:
      # Tenant env vars ride a ConfigMap consumed via envFrom so the map input
      # needs no CEL list synthesis.
      - id: workerEnv
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-env
            namespace: default
          data: ${schema.spec.env}
      - id: workerDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            replicas: ${schema.spec.replicas}
            selector:
              matchLabels:
                app: ${schema.spec.name}
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}
              spec:
                containers:
                  - name: worker
                    image: ${schema.spec.image}
                    # connections.* → credentials from the sibling instance's
                    # Secret in this runtime namespace. Unconnected: a
                    # placeholder name + optional=true leaves the var unset.
                    # Connected: the pod waits for the Secret and its uri key.
                    # Literal entries so the dev overlay keeps them.
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: '${schema.spec.connections.database == "" ? schema.spec.name + "-unbound-db" : schema.spec.connections.database + "-db-credentials"}'
                            key: uri
                            optional: '${schema.spec.connections.database == ""}'
                      - name: REDIS_URL
                        valueFrom:
                          secretKeyRef:
                            name: '${schema.spec.connections.cache == "" ? schema.spec.name + "-unbound-cache" : schema.spec.connections.cache + "-credentials"}'
                            key: uri
                            optional: '${schema.spec.connections.cache == ""}'
                    envFrom:
                      - configMapRef:
                          name: ${workerEnv.metadata.name}
    status:
      ready: ${workerDeployment.status.readyReplicas}
