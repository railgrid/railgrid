apiVersion: v2
name: railgrid-code-provider
description: |
  railgrid provider that manages source-code repositories and access (deploy
  keys, collaborators) across git hosting providers (GitHub today). Ships the
  provider Deployment, ClusterIP Service, and the CatalogEntry that registers
  the provider — with its eight tenant-authored APIResourceSchemas — with the
  railgrid hub.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - railgrid
  - code
  - git
  - github
  - repositories
home: https://github.com/railgrid/railgrid
sources:
  - https://github.com/railgrid/railgrid/tree/main/providers/code
maintainers:
  - name: railgrid maintainers
