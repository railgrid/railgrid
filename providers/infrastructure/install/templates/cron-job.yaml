apiVersion: infrastructure.railgrid.ai/v1alpha1
kind: Template
metadata:
  name: cron-job
spec:
  displayName: "Scheduled job"
  description: "A container that runs on a cron schedule and exits — CronJob only, no Service, no URL. Reports, cleanups, periodic syncs."
  category: Workloads
  version: 0.3.0
  # exposure: what the platform tells callers about reaching an instance.
  # A schedule, not a server. Nothing to reach.
  exposure: internal
  backend: kro
  # One-click provision defaults for the portal form. busybox's default
  # entrypoint exits 0 immediately, so the sample schedule visibly produces
  # completed Jobs with zero external setup.
  sampleValues:
    name: demo-job
    image: busybox:stable
    schedule: "*/30 * * * *"
  # Operational guidance for AI agents discovering this template over MCP.
  agent:
    usage: |
      Runs ONE container on a cron schedule; each run must do its work and
      EXIT 0. Choose this for periodic work — reports, cleanups, backups,
      syncs. It is the opposite lifecycle of the worker template (a process
      that runs forever): a cron-job container that never exits will pile up
      overlapping-forbidden runs, not "keep running".

      YOU SUPPLY exactly one container image whose ENTRYPOINT performs the
      task and exits: 0 on success, non-zero on failure (failed runs are
      retried up to 3 times, then recorded as a failed Job). The optional
      command / args inputs override the image's entrypoint and arguments
      (Kubernetes container command/args), so a stock image such as
      node:20-alpine or postgres:16-alpine can run a one-liner without a
      custom image: command ["node", "-e", "..."] or ["psql", "-c", "..."].
      Leave both empty to run the image as built.

      SCHEDULE: standard 5-field cron (schedule input, default "0 * * * *" =
      hourly, evaluated in UTC). Concurrent runs are forbidden — if a run is
      still going when the next tick fires, the new run is skipped. Runs may
      occasionally fire late or be skipped; the task must be idempotent and
      tolerate that.

      This template has NO development mode — develop and test the image
      elsewhere, then provision it here. No network exposure; durable state
      belongs in a database template instance, connected as below.

      CONNECTIONS (the connections input):
        • connections.database: <values.name of a database instance in this
          workspace> → DATABASE_URL =
          `postgres://appuser:<password>@<name>-db:5432/appdb`. The URI has
          NO sslmode and the in-cluster Postgres has TLS disabled, so connect
          with sslmode=disable (append `?sslmode=disable` / set it if your
          driver defaults to TLS, e.g. Node `pg`, JDBC).
        • connections.cache: <values.name of a redis-cache instance> →
          REDIS_URL = `redis://:<password>@<name>:6379`.
        • Unset (default "") = not connected; the variable is left unset. A
          name that is set makes each run wait until that instance's Secret
          exists, so it must name a real instance in THIS workspace.
        • Retry the first connection briefly before failing the run, and run
          schema creation/migrations idempotently inside that retry loop.

      INPUTS you set when provisioning: name, image (both required);
      schedule, command, args, env (env-var map; not for secrets),
      connections.database / connections.cache (see CONNECTIONS). All except
      name can be changed later with update_instance.
    outputs:
      - "status.schedule — the active cron schedule."
  # ── Portal presentation ───────────────────────────────────────────────
  view:
    columns:
      - header: Schedule
        path: spec.schedule
        type: code
    detail:
      - title: Configuration
        fields:
          - label: Schedule
            path: status.schedule
            type: code
          - label: Image
            path: spec.image
            type: code
  instanceCRD:
    group: infrastructure.railgrid.ai
    version: v1alpha1
    resource: scheduledjobs
    kind: ScheduledJob
  schema:
    type: object
    properties:
      name:
        type: string
        description: "Logical name; used as the CronJob name in the tenant namespace."
      image:
        type: string
        description: "Container image whose entrypoint performs the task and exits (0 = success)."
      schedule:
        type: string
        default: "0 * * * *"
        description: "Standard 5-field cron expression, evaluated in UTC. Default: hourly."
      command:
        type: array
        items:
          type: string
        default: []
        description: "Overrides the image entrypoint (Kubernetes container command). Empty = the image's own entrypoint."
      args:
        type: array
        items:
          type: string
        default: []
        description: "Arguments for the entrypoint or command (Kubernetes container args). Empty = the image's own CMD."
      env:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: "Environment variables for the container, injected via a ConfigMap + envFrom (updatable in place). DATABASE_URL / REDIS_URL from a set connection win on name conflicts. Values are stored world-readable — not for secrets; use connections for database/cache credentials."
      # Fixed connection slots rendered as literal secretKeyRef env entries —
      # same shape and rationale as simple-webapp's connections input.
      connections:
        type: object
        default: {}
        description: "Sibling instances in this workspace whose credentials are injected as env, read from their Secret (never templated in clear). Empty = not connected."
        properties:
          database:
            type: string
            default: ""
            pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 50
            description: "values.name of a database instance in this workspace; its connection URI is injected as DATABASE_URL (no sslmode; in-cluster TLS is off, so use sslmode=disable). Each run waits until that instance's Secret exists."
          cache:
            type: string
            default: ""
            pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 63
            description: "values.name of a redis-cache instance in this workspace; its connection URI is injected as REDIS_URL. Each run waits until that instance's Secret exists."
    required:
      - name
      - image

  # ── backendConfig: the kro resource graph ─────────────────────────────
  # namespace: default is remapped to the per-tenant namespace on the runtime
  # cluster — same convention as every seed template.
  backendConfig:
    resources:
      # Tenant env vars ride a ConfigMap consumed via envFrom so the map input
      # needs no CEL list synthesis.
      - id: jobEnv
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-env
            namespace: default
          data: ${schema.spec.env}
      - id: cronJob
        template:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            schedule: ${schema.spec.schedule}
            # A run still going when the next tick fires wins; the new run is
            # skipped. Matches the agent contract above.
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 1
            jobTemplate:
              spec:
                backoffLimit: 3
                template:
                  metadata:
                    labels:
                      app: ${schema.spec.name}
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: job
                        image: ${schema.spec.image}
                        command: ${schema.spec.command}
                        args: ${schema.spec.args}
                        # connections.* → credentials from the sibling
                        # instance's Secret in this runtime namespace.
                        # Unconnected: a placeholder name + optional=true
                        # leaves the var unset. Connected: the run waits for
                        # the Secret and its uri key.
                        env:
                          - name: DATABASE_URL
                            valueFrom:
                              secretKeyRef:
                                name: '${schema.spec.connections.database == "" ? schema.spec.name + "-unbound-db" : schema.spec.connections.database + "-db-credentials"}'
                                key: uri
                                optional: '${schema.spec.connections.database == ""}'
                          - name: REDIS_URL
                            valueFrom:
                              secretKeyRef:
                                name: '${schema.spec.connections.cache == "" ? schema.spec.name + "-unbound-cache" : schema.spec.connections.cache + "-credentials"}'
                                key: uri
                                optional: '${schema.spec.connections.cache == ""}'
                        envFrom:
                          - configMapRef:
                              name: ${jobEnv.metadata.name}
    # Echoed from the materialized CronJob (this kro fork forbids ${schema.*}
    # in status — status may reference resources only).
    status:
      schedule: ${cronJob.spec.schedule}
