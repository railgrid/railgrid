## railgrid-quickstart-provider values
## The quickstart provider is the reference provider: it owns the Greeting
## APIExport, runs one multicluster reconciler over every tenant workspace that
## bound it, serves one data-plane verb, and ships a micro-frontend. It reads
## the provider kubeconfig at runtime (controllers + the data-plane caller
## clients), so providerKubeconfig below is required for anything but a
## portal-only demo install.

# Container image. Build with: docker build -t IMAGE providers/quickstart/
image:
  repository: ghcr.io/railgrid/railgrid-quickstart-provider
  tag: ""  # empty → defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Number of Deployment replicas. Safe above 1: the HTTP surface is stateless
# and the reconciler is single-writer by leader election on a Lease in the
# provider's own kcp workspace (no RBAC on this cluster is involved).
replicaCount: 2

service:
  type: ClusterIP
  port: 8081

# Hub the provider POSTs heartbeats to. Must be reachable from the provider
# pod (in-cluster Service DNS works). Empty url → heartbeats disabled, which
# is fine for a UI-only demo install.
hub:
  url: https://railgrid-hub.railgrid.svc.cluster.local:9443
  # Bearer token used in the heartbeat POST. Provided as a Secret because it
  # MUST NOT land in values.yaml in plaintext for prod. Leave name empty to
  # send unauthenticated heartbeats (dev only).
  tokenSecretRef:
    name: ""
    key: token
  # Skip TLS verification on heartbeat — dev only, defaults off.
  insecure: false

# Secret holding the workspace-admin kubeconfig minted by the platform admin
# via /bonkers (admin onboarding). Key must be "kubeconfig". Mounted by BOTH
# containers at /var/run/secrets/railgrid and passed as
# RAILGRID_PROVIDER_KUBECONFIG:
#
#   init   applies the provider's schemas, APIExport, APIExportEndpointSlice
#          and bind grant.
#   serve  watches tenant workspaces through the APIExport virtual workspace,
#          and lends its host + CA (never its bearer) to the per-request
#          caller clients the greet verb runs its two gates through.
#
# Without it the provider still serves the portal, but no Greeting is ever
# reconciled and the greet verb is disabled.
providerKubeconfig:
  secretName: railgrid-provider-kubeconfig

# When true, the chart renders the CatalogEntry (which registers the provider
# with the hub) into a ConfigMap that the init container applies into the
# provider workspace via the provider kubeconfig. The CatalogEntry is a kcp
# resource, so it is NOT applied to the hosting cluster this chart installs into.
# Set to false to manage the CatalogEntry separately (e.g. GitOps with a
# different rollout cadence).
catalogEntry:
  enabled: true

serviceAccount:
  create: true
  name: ""   # empty → release-name

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

# Optional pod-level overrides.
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
