apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260919-b1e9b5e6.schedules.agents.railgrid.ai
spec:
  group: agents.railgrid.ai
  names:
    kind: Schedule
    listKind: ScheduleList
    plural: schedules
    shortNames:
    - sched
    singular: schedule
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef
      name: Agent
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.nextRun
      name: NextRun
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    name: v1alpha1
    schema:
      description: |-
        Schedule triggers an agent to run on its own clock: a recurring cron
        task, a one-shot wakeup, or a periodic heartbeat. The provider's in-process
        scheduler owns fire times and reliability; this resource is the spec.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: ScheduleSpec is the user-authored schedule configuration.
          properties:
            agentRef:
              description: AgentRef names the Agent this schedule drives.
              maxLength: 253
              minLength: 1
              type: string
            channelRef:
              description: |-
                ChannelRef names the agent channel this schedule's output is delivered to
                (a Name in the agent's spec.channels). Empty means the agent's primary
                channel. Lets, e.g., a "daily-news" cron post to a dedicated news channel.
              maxLength: 63
              type: string
            checklist:
              description: |-
                Checklist is the standing markdown the agent reviews on each heartbeat
                pulse. Only used for heartbeat schedules.
              maxLength: 32768
              type: string
            retry:
              description: Retry overrides the default retry policy for runs from
                this schedule.
              properties:
                maxAttempts:
                  description: |-
                    MaxAttempts is the number of tries for a transient failure before the run
                    is marked failed. Zero uses the provider default (3).
                  format: int32
                  minimum: 0
                  type: integer
              type: object
            runAt:
              description: RunAt is the one-shot fire time for wakeup schedules (RFC3339).
              format: date-time
              type: string
            schedule:
              description: |-
                Schedule is a 5-field cron expression for cron and heartbeat types. For
                wakeup type it is empty and RunAt is used instead.
              maxLength: 253
              type: string
            suspend:
              description: Suspend halts firing without deleting the schedule.
              type: boolean
            task:
              description: Task is the prompt run on each fire for cron and wakeup
                schedules.
              maxLength: 32768
              type: string
            timeZone:
              description: |-
                TimeZone is the IANA timezone the cron expression is evaluated in (e.g.
                "Europe/Vilnius"). Empty means UTC.
              maxLength: 64
              type: string
            type:
              description: Type is cron, wakeup, or heartbeat.
              enum:
              - cron
              - wakeup
              - heartbeat
              type: string
          required:
          - agentRef
          - type
          type: object
        status:
          description: ScheduleStatus is the observed schedule state.
          properties:
            conditions:
              description: |-
                Conditions follows the standard Kubernetes conditions pattern. The
                Validated condition reports whether the spec is usable as written —
                see conditions.go.
              items:
                description: Condition contains details for one aspect of the current
                  state of this API Resource.
                properties:
                  lastTransitionTime:
                    description: |-
                      lastTransitionTime is the last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      message is a human readable message indicating details about the transition.
                      This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: |-
                      observedGeneration represents the .metadata.generation that the condition was set based upon.
                      For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                      with respect to the current state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: |-
                      reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      Producers of specific condition types may define expected values and meanings for this field,
                      and whether the values are considered a guaranteed API.
                      The value should be a CamelCase string.
                      This field may not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            consecutiveFailures:
              description: |-
                ConsecutiveFailures counts back-to-back failed runs; drives extended
                backoff and eventual disable.
              format: int32
              type: integer
            disabledReason:
              description: |-
                DisabledReason is set when the scheduler disables the schedule on a
                permanent error (revoked credential, deleted agent).
              type: string
            lastRun:
              description: LastRun is the most recent fire time.
              format: date-time
              type: string
            lastRunID:
              description: LastRunID references the Run produced by the most recent
                fire.
              maxLength: 128
              type: string
            nextRun:
              description: NextRun is the next planned fire time.
              format: date-time
              type: string
            observedGeneration:
              description: |-
                ObservedGeneration is the spec generation the scheduler last reconciled.
                When it lags metadata.generation the schedule was edited, and the
                scheduler re-derives NextRun from the new spec instead of honoring the
                stale value computed from the previous cron/timezone/runAt.
              format: int64
              type: integer
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
