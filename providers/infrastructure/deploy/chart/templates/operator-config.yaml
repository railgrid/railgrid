{{- if .Values.operator.enabled -}}
{{- $providerSecret := .Values.operator.providerKubeconfigSecret.name | default (printf "%s-provider-kubeconfig" (include "infrastructure.fullname" .)) -}}
{{- $runtimeSecret := .Values.operator.runtimeKubeconfigSecret.name | default (printf "%s-runtime-kubeconfig" (include "infrastructure.fullname" .)) -}}
{{- if and (.Values.codingSandbox).enabled (not (regexMatch `^[^@\s]+@sha256:[a-f0-9]{64}$` (default "" .Values.development.images.universal))) }}
{{- fail "codingSandbox.enabled=true requires development.images.universal to be an immutable name@sha256:<64 lowercase hex digits> reference" }}
{{- end }}
{{- if and (.Values.codingSandbox).enabled (not (regexMatch `^[^@\s]+@sha256:[a-f0-9]{64}$` (default "" .Values.development.agentImage))) }}
{{- fail "codingSandbox.enabled=true requires development.agentImage to be an immutable name@sha256:<64 lowercase hex digits> reference" }}
{{- end }}
{{- if .Values.operator.providerKubeconfig }}
# Provider (kcp) kubeconfig Secret, rendered from --set-file
# operator.providerKubeconfig=... . Omit to reference an existing Secret via
# operator.providerKubeconfigSecret.name instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $providerSecret }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
type: Opaque
stringData:
  kubeconfig: |
{{ .Values.operator.providerKubeconfig | indent 4 }}
---
{{- end }}
{{- if .Values.operator.runtimeKubeconfig }}
# Runtime-cluster kubeconfig Secret (where kro + provider serve run).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtimeSecret }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
type: Opaque
stringData:
  kubeconfig: |
{{ .Values.operator.runtimeKubeconfig | indent 4 }}
---
{{- end }}
# The InfrastructureProvider CR the operator reconciles. Image versions and the
# kro release config live here so upgrades are a CR edit (or a helm value bump).
apiVersion: infrastructure.railgrid.ai/v1alpha1
kind: InfrastructureProvider
metadata:
  name: {{ include "infrastructure.fullname" . }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  {{- if .Values.operator.providerWorkspace }}
  providerWorkspace: {{ .Values.operator.providerWorkspace | quote }}
  {{- end }}
  providerKubeconfigSecret:
    name: {{ $providerSecret }}
    key: {{ .Values.operator.providerKubeconfigSecret.key | default "kubeconfig" }}
  {{- if or .Values.operator.runtimeKubeconfig .Values.operator.runtimeKubeconfigSecret.name }}
  runtimeKubeconfigSecret:
    name: {{ $runtimeSecret }}
    key: {{ .Values.operator.runtimeKubeconfigSecret.key | default "kubeconfig" }}
  {{- else }}
  # No runtimeKubeconfigSecret → the operator uses its own (in-cluster) cluster
  # as the runtime (kro + serve land in the cluster the operator runs in).
  {{- end }}
  {{- with .Values.hub }}
  hub:
    url: {{ .url | quote }}
    insecure: {{ .insecure }}
    {{- if .tokenSecretRef.name }}
    tokenSecret:
      name: {{ .tokenSecretRef.name }}
      key: {{ .tokenSecretRef.key | default "token" }}
    {{- end }}
  {{- end }}
  kro:
    chart: {{ .Values.operator.kro.chart | quote }}
    version: {{ .Values.operator.kro.version | quote }}
    namespace: {{ .Values.operator.kro.namespace | quote }}
    releaseName: {{ .Values.operator.kro.releaseName | quote }}
    image:
      repository: {{ .Values.operator.kro.image.repository | quote }}
      tag: {{ .Values.operator.kro.image.tag | quote }}
    {{- with .Values.operator.kro.extraValues }}
    extraValues:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  provider:
    image:
      repository: {{ .Values.operator.provider.image.repository | default .Values.image.repository | quote }}
      tag: {{ .Values.operator.provider.image.tag | default .Values.image.tag | default .Chart.AppVersion | quote }}
    replicas: {{ .Values.operator.provider.replicas }}
    port: {{ .Values.operator.provider.port }}
  codingSandbox:
    enabled: {{ (.Values.codingSandbox).enabled | default false }}
  {{- $sandboxRuntimeClass := include "infrastructure.sandboxRuntimeClassName" . }}
  {{- if $sandboxRuntimeClass }}
  # Hardened RuntimeClass (gVisor, Kata) for every synthesized development pod
  # (serve container's RAILGRID_SANDBOX_RUNTIME_CLASS_NAME).
  sandbox:
    runtimeClassName: {{ $sandboxRuntimeClass | quote }}
  {{- end }}
  {{- $devAgentImage := include "infrastructure.devAgentImage" . }}
  {{- if or $devAgentImage .Values.development.images }}
  development:
    {{- with $devAgentImage }}
    # development.agentImage, else this release's railgrid-dev-agent — the
    # operator maps it onto the serve Deployment's RAILGRID_DEV_AGENT_IMAGE.
    agentImage: {{ . | quote }}
    {{- end }}
    {{- if .Values.development.images }}
    images:
      {{- toYaml .Values.development.images | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.operator.application.baseDomain .Values.operator.application.gateway.name .Values.operator.application.gateway.namespace .Values.operator.application.gateway.backendHealthCheck }}
  # Exposure layer for the `application` template (serve container's
  # RAILGRID_APP_BASE_DOMAIN / RAILGRID_GATEWAY_NAME / RAILGRID_GATEWAY_NAMESPACE).
  # baseDomain gates the feature.
  application:
    {{- with .Values.operator.application.baseDomain }}
    baseDomain: {{ . | quote }}
    {{- end }}
    {{- if or .Values.operator.application.gateway.name .Values.operator.application.gateway.namespace .Values.operator.application.gateway.backendHealthCheck }}
    gateway:
      {{- with .Values.operator.application.gateway.name }}
      name: {{ . | quote }}
      {{- end }}
      {{- with .Values.operator.application.gateway.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.operator.application.gateway.backendHealthCheck }}
      backendHealthCheck: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if or .Values.operator.publishing.baseDomain .Values.operator.publishing.accessProxyImage }}
  publishing:
    baseDomain: {{ .Values.operator.publishing.baseDomain | quote }}
    accessProxyImage: {{ .Values.operator.publishing.accessProxyImage | quote }}
    hubURL: {{ default .Values.hub.url .Values.operator.publishing.hubURL | quote }}
    {{- with .Values.operator.publishing.hubPublicURL }}
    hubPublicURL: {{ . | quote }}
    {{- end }}
    hubInsecure: {{ .Values.operator.publishing.insecure }}
    publicScheme: {{ .Values.operator.publishing.publicScheme | default "https" | quote }}
    {{- if gt (int .Values.operator.publishing.publicPort) 0 }}
    publicPort: {{ .Values.operator.publishing.publicPort }}
    {{- end }}
    {{- if or .Values.operator.publishing.gateway.name .Values.operator.publishing.gateway.namespace .Values.operator.publishing.gateway.backendHealthCheck }}
    gateway:
      {{- with .Values.operator.publishing.gateway.name }}
      name: {{ . | quote }}
      {{- end }}
      {{- with .Values.operator.publishing.gateway.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.operator.publishing.gateway.backendHealthCheck }}
      backendHealthCheck: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
