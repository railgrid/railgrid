---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: toolsets.agents.railgrid.ai
spec:
  group: agents.railgrid.ai
  names:
    kind: Toolset
    listKind: ToolsetList
    plural: toolsets
    shortNames:
    - ts
    singular: toolset
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Toolset is a named, reusable bundle of tool grants — built-in families plus
          connection-backed tools and approval rules — that many Agents can link and
          share. An agent references toolsets from its per-class tool policy; at run
          time their families/connections/approval are merged into the agent's grant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ToolsetSpec is the user-authored bundle definition.
            properties:
              connections:
                description: |-
                  Connections names Connection resources (e.g. mcp/github) whose tools this
                  toolset exposes.
                items:
                  type: string
                type: array
              description:
                description: Description explains what the toolset is for.
                maxLength: 1024
                type: string
              displayName:
                description: DisplayName is a human-friendly label.
                maxLength: 253
                type: string
              families:
                description: |-
                  Families names built-in tool families to include: "core", "web",
                  "github", "mcp", "edges".
                items:
                  type: string
                type: array
              requireApproval:
                description: |-
                  RequireApproval lists tool names (or wildcards like "github:*") that must
                  be approved by the user before they run.
                items:
                  type: string
                type: array
            type: object
          status:
            description: ToolsetStatus is the observed toolset state.
            properties:
              conditions:
                description: |-
                  Conditions follows the standard Kubernetes conditions pattern. The
                  Validated condition reports whether the spec is usable as written —
                  see conditions.go.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration mirrors metadata.generation last reconciled.
                format: int64
                type: integer
              usedBy:
                description: UsedBy counts the agents currently linking this toolset.
                  Informational.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
