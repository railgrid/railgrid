---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: modelproviderconnections.ai.railgrid.ai
spec:
  group: ai.railgrid.ai
  names:
    kind: ModelProviderConnection
    listKind: ModelProviderConnectionList
    plural: modelproviderconnections
    shortNames:
    - modelconn
    singular: modelproviderconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.baseURL
      name: Endpoint
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelProviderConnection is a workspace-local provider account. It contains
          endpoint configuration and a reference to a Secret; model IDs belong to
          Studio model bindings and key material never appears on this object.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelProviderConnectionSpec holds transport settings and the key Secret
              reference. Google service-account JSON and Gemini API keys use the same
              Secret key; the provider detects JSON credentials without exposing them.
            properties:
              anthropicWorkspaceID:
                description: |-
                  AnthropicWorkspaceID selects an Anthropic workspace for keys not already
                  scoped to one. It is sent only to the official Anthropic Messages API.
                maxLength: 253
                pattern: ^(wrkspc_[A-Za-z0-9]+)?$
                type: string
              baseURL:
                description: BaseURL is the provider API root. App Studio selects
                  the model operation.
                maxLength: 2048
                minLength: 1
                pattern: ^https?://[^\s]+$
                type: string
              provider:
                default: openai-compatible
                description: Provider selects the model provider protocol.
                enum:
                - openai-compatible
                - google-ai-studio
                type: string
              secretKey:
                default: apiKey
                description: SecretKey names the Secret data entry that carries the
                  credential.
                maxLength: 253
                type: string
              secretRef:
                description: SecretRef names the key Secret in namespace default of
                  this workspace.
                properties:
                  name:
                    description: Name of the Secret. Its "apiKey" entry is the credential.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - baseURL
            - secretRef
            type: object
            x-kubernetes-validations:
            - message: spec.secretRef.name is required
              rule: has(self.secretRef.name) && size(self.secretRef.name) > 0
          status:
            description: |-
              ModelProviderConnectionStatus reports key resolution and bounded endpoint
              discovery. The fingerprint changes when the referenced Secret identity or
              connection spec changes, allowing a client to reject stale saved-key drafts.
            properties:
              activeSnapshot:
                description: |-
                  ActiveSnapshot is the controller-admitted runtime configuration. Spec is
                  desired state; this changes only after binding rollover succeeds.
                properties:
                  anthropicWorkspaceID:
                    description: AnthropicWorkspaceID is sent only to the official
                      Anthropic endpoint.
                    maxLength: 253
                    pattern: ^(wrkspc_[A-Za-z0-9]+)?$
                    type: string
                  baseURL:
                    maxLength: 2048
                    type: string
                  connectionFingerprint:
                    description: ConnectionFingerprint is the source connection's
                      version token.
                    maxLength: 64
                    type: string
                  connectionRef:
                    description: ConnectionRef names the source connection.
                    type: string
                  connectionUID:
                    description: |-
                      ConnectionUID fences snapshots against a deleted and recreated object
                      with the same name.
                    type: string
                  generatedSecretID:
                    description: |-
                      GeneratedSecretID identifies a provider-generated immutable Secret
                      version when the connection owns the key.
                    maxLength: 32
                    type: string
                  provider:
                    description: Provider and BaseURL identify the transport used
                      by the revision.
                    maxLength: 63
                    type: string
                  secretKey:
                    description: SecretKey names the credential entry in SecretRef.
                    type: string
                  secretRef:
                    description: SecretRef preserves the exact key version needed
                      by the revision.
                    properties:
                      name:
                        description: Name of the Secret. Its "apiKey" entry is the
                          credential.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  secretResourceVersion:
                    type: string
                  secretUID:
                    description: |-
                      SecretUID and SecretResourceVersion ensure a pinned revision never reads
                      a replacement or subsequently edited Secret under the same name.
                    type: string
                type: object
              conditions:
                description: Conditions carries SecretResolved, Reachable and Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionFingerprint:
                description: |-
                  ConnectionFingerprint is a SHA-256 version token for the saved config and
                  Secret identity. It contains no credential-derived data.
                maxLength: 64
                type: string
              credentialMode:
                description: CredentialMode is a non-secret hint inferred from the
                  credential shape.
                enum:
                - api-key
                - service-account-json
                type: string
              lastProbeError:
                description: LastProbeError is bounded and never contains an upstream
                  response body.
                maxLength: 512
                type: string
              lastProbeFingerprint:
                description: |-
                  LastProbeFingerprint binds an explicitly authorized probe result to its
                  exact connection configuration and Secret version. Configuration CRUD
                  alone never authorizes a credential-bearing network request.
                maxLength: 64
                type: string
              lastProbeTime:
                description: LastProbeTime is when the endpoint was last discovered.
                format: date-time
                type: string
              models:
                description: Models contains bounded model IDs from the last successful
                  discovery.
                items:
                  maxLength: 253
                  type: string
                maxItems: 500
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: ObservedGeneration is the spec generation represented
                  by this status.
                format: int64
                type: integer
              secretResourceVersion:
                type: string
              secretUID:
                description: |-
                  SecretUID and SecretResourceVersion identify the current credential
                  version without exposing its data. Model revisions pin these values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
