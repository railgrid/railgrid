name: GoReleaser

on:
  pull_request:
    paths:
    - .github/workflows/goreleaser.yaml
    - .goreleaser.yml
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Delete non-semver tags
      run: 'git tag -d $(git tag -l | grep -v "^v")'
    - name: Set LDFLAGS
      run: echo LDFLAGS="$(make ldflags)" >> $GITHUB_ENV
    - name: Run GoReleaser on tag
      if: github.event_name != 'pull_request'
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        args: release --timeout 60m
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KREW_GITHUB_TOKEN: ${{ secrets.KREW_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_ACCESS_KEY }}
          LDFLAGS: ${{ env.LDFLAGS }}
    # The installer is served from the root of the same R2 bucket GoReleaser
    # fills (downloads.railgrid.ai/install.sh). GoReleaser's blob upload covers
    # the archives only, and a script uploaded by hand drifts from the repo: the
    # HOME fix of 2026-10-08 was live only once somebody re-uploaded it two days
    # later. Publish the tagged install.sh with every release.
    - name: Publish install.sh to downloads.railgrid.ai
      if: github.event_name != 'pull_request'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        # R2 does not accept the CRC-trailer checksums newer AWS CLIs send by default.
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        aws s3 cp install.sh s3://railgrid-cli/install.sh \
          --endpoint-url https://f8f725cf687b0377b17bdea3dbee524e.r2.cloudflarestorage.com \
          --content-type text/x-sh --cache-control max-age=300
    - name: Run GoReleaser on pull request
      if: github.event_name == 'pull_request'
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: latest
        args: release --timeout 60m --snapshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KREW_GITHUB_TOKEN: ${{ secrets.KREW_GITHUB_TOKEN }}
        AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_ACCESS_KEY }}
        LDFLAGS: ${{ env.LDFLAGS }}
