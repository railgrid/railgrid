# Kuery provider — register with the railgrid hub.
#
# Kuery gives tenants (and AI agents via MCP) a single query surface over
# every object across their connected edge clusters: fleet-wide search,
# relationship traversal, and impact analysis. See
# docs/kuery-provider-architecture.md in the railgrid repo for the design.
#
# Apply this against the kcp workspace where the railgrid.ai APIExport is
# bound (typically root:railgrid:providers when running embedded kcp for
# development):
#
#   kubectl --kubeconfig kcp-admin.kubeconfig apply -f manifest.yaml
#
# For local dev with the provider binary running on the host machine the
# URLs below point at the loopback the hub can reach. For in-cluster
# deployment, the Helm chart renders the Service DNS instead, e.g.
#   url: http://kuery.kuery.svc.cluster.local:8081
---
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: kuery
spec:
  displayName: "Kuery"
  description: "Fleet-wide object search, relationships, and impact analysis across connected edge clusters."
  vendor: "railgrid"
  version: "0.1.0"
  category: "Observability"
  iconURL: "/ui/providers/kuery/icon.svg"

  # What kuery exports: one APIExport, one kind, one verb on it.
  #
  # Declaring a verb grants nothing: every call is still authorized on
  # {resource}/{verb}, as the caller, by this provider's own gates. What the
  # declaration buys, per verb: codegen emits the kcp custom subresource
  # "<resource>/<verb>" on the generated APIExport (the shard routes it to this
  # provider through its DataPlaneEndpointSlice) together with the
  # "<Verb>Request" schema the entry names; a consumer provider can require the
  # coordinate under spec.requires[].resources[] and have it claimed on ITS
  # export; and the hub scoped-identity service (pkg/hub/identity/policy.go
  # clause C) can mint a capability only for a verb it can verify exists. None
  # of this is a requirement of this provider: a requirement names another
  # export's resources, never one's own verbs.
  export:
    name: "kuery.providers.railgrid.ai"
    resources:
      - name: savedviews
        apiVersion: "kuery.providers.railgrid.ai/v1alpha1"
        kind: SavedView
        verbs:
          - name: run
            description: "Run the saved view's query and return its result."
            readOnly: true

  # Everything kuery needs that it does not own — one list, and the only place
  # the generated permission claims come from.
  #
  # Kuery syncs the edges a tenant already has, so edges must be enabled here
  # first: naming a `provider` is the dependency edge the hub refuses to enable
  # without, and the resources under it are what its engagement controller is
  # allowed to do with them, declared for the tenant to accept at Enable.
  #
  # Read-only on the kind, deliberately: kuery lists and watches the
  # workspace's KubernetesClusters to learn which edges exist and which are
  # connected, and gets the one it is about to engage because the edges data
  # plane's first gate is a real GET of the addressed edge AS THE CALLER. It
  # never creates, updates or deletes an edge.
  #
  # LinuxServer and MacOSServer are absent because kuery does not engage them:
  # they carry no Kubernetes API to sync (engagement/controller.go edgeGVK).
  #
  # None of these claims pins an identityHash, and that is the whole point: a
  # claim that pinned one on a first-party (*.railgrid.ai) group would fix one
  # APIExport identity for every consumer at once, so an org running its own
  # edges provider would be served nothing (AGENTS.md §5.7). A requirement is
  # resolved per consumer workspace against whatever export is bound there —
  # kcp admits it when the cluster-scoped PermissionClaimPolicy the hub applies
  # at bootstrap (config/kcp/permissionclaimpolicy.yaml, generated from these
  # same entries) pairs kuery's group with the required one — and the tenant can
  # revoke it.
  #
  # And no serviceaccounts, secrets, clusterroles or clusterrolebindings
  # either: a provider does not mint identities, it asks the hub, and a
  # requirement on those types is a contract violation rather than a design
  # choice (docs/provider-connectivity-contract.md §"Scoped identities"). Kuery
  # writes no Secret of its own — the only one it ever touched was the legacy
  # ServiceAccount token the hub now issues and expires for it.
  requires:
    - provider: edges
      group: edges.railgrid.ai
      resources:
        - name: kubernetesclusters
          verbs: [get, list, watch]
        # The verb kuery calls on an edge: its Kubernetes API, served by the
        # edges provider as the custom subresource kubernetesclusters/k8s. A
        # claim on the resource does not carry its coordinates; each is
        # required as its own entry, so kcp serves it on kuery's virtual
        # workspace and forwards it to edges under kuery's identity.
        #
        # No verbs here: the verb IS the capability. kcp authorizes the HTTP
        # METHOD as the RBAC verb on a custom subresource and a Kubernetes
        # client issues GET, LIST, WATCH, PATCH and more against the edge API
        # behind this coordinate, so the generated claim spells every verb.
        - name: kubernetesclusters/k8s
    # Every provider that serves a custom subresource needs this one entry: on
    # the shard-forwarded path there is no caller bearer, so the provider runs
    # a SubjectAccessReview for the stamped caller through its own APIExport
    # virtual workspace, and kcp serves that builtin there only for an export
    # that claims it (hack/verify-provider-contract.mjs
    # subresource-access-claim). Built-in review API: no `provider`, because no
    # provider serves authorization.k8s.io and nothing has to be enabled first;
    # verb create only. Everything under requires is tenant-scoped by
    # definition, and the VW confines each review to the tenant's OWN
    # workspace.
    - group: authorization.k8s.io
      resources:
        - name: subjectaccessreviews
          verbs: [create]

  # Where the hub reaches kuery.
  #
  # No edgeProxyAccess. Kuery CALLS each tenant's edges as ITSELF, through its
  # own APIExport virtual workspace: kubernetesclusters/k8s is a required
  # custom-subresource coordinate, kcp forwards it to the edges provider under
  # kuery's identity and the edges gate trusts the claim. The Enable-time
  # edges-proxy grant this flag used to ask for was never the credential on
  # that path — it grants the PROVIDER SA, which the edges data plane cannot
  # authenticate across workspaces anyway (see engagement/controller.go).
  serving:
    ui:
      # Dev loopback port (KUERY_PORT / Tiltfile run-provider-kuery). Must be
      # 8084, not 8081 — quickstart owns 8081, and the hub reverse-proxies the
      # portal bundle here; pointing at 8081 serves quickstart's bundle and the
      # railgrid-provider-kuery custom element never registers.
      url: "http://localhost:8084"
      indexPath: "/"
    backend:
      url: "http://localhost:8084"
      # /readyz, not /healthz: readiness reports whether this provider can
      # actually reach the APIExport virtual workspace it watches and, while a
      # replica holds the controller lease, whether tenant workspaces are really
      # being watched. /healthz answers "the process is up", which was true the
      # whole time nothing reconciled.
      healthPath: "/readyz"
    # Lets an organization run this provider in its own cluster
    # (docs/byo-providers.md). Keep manifest.yaml and
    # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
    # one that reaches production.
    selfHosting:
      supported: true
      chart:
        repository: "oci://ghcr.io/railgrid/charts"
        name: "railgrid-kuery-provider"
      namespace: "railgrid-provider-kuery"
      releaseName: "kuery"
      docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/kuery/deploy/chart/README.md"
      # No requiredValues: kuery pins no APIExport identity hashes — edge
      # discovery rides each workspace's own edges binding, whichever copy of
      # the edges provider that is.
