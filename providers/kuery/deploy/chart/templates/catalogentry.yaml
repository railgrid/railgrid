{{- if .Values.catalogEntry.enabled -}}
# CatalogEntry registers this provider with the railgrid hub for routing + the
# portal Enable flow. It is a kcp resource (providers.railgrid.ai/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (RAILGRID_CATALOGENTRY_FILE -> sdkinstall.Bootstrap). The hub watches
# CatalogEntries in every workspace bound to providers.railgrid.ai, including
# the provider's own, so a self-registered entry is seen.
#
# It only REFERENCES the APIExport (apiExport.name); the APIExport, its
# APIResourceSchemas, the APIExportEndpointSlice, and the bind grant are created
# by the same init container. The hub no longer provisions anything from this
# CatalogEntry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kuery.fullname" . }}-catalogentry
  labels:
    {{- include "kuery.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.railgrid.ai/v1alpha1
    kind: CatalogEntry
    metadata:
      name: kuery
    spec:
      displayName: "Kuery"
      description: "Fleet-wide object search, relationships, and impact analysis across connected edge clusters."
      vendor: "railgrid"
      version: {{ .Chart.AppVersion | quote }}
      category: "Observability"
      iconURL: "/ui/providers/kuery/icon.svg"
      # Kuery syncs the edges a tenant already has, so edges must be enabled
      # here first — and `composes` is what its engagement controller is
      # allowed to do with them, accepted by the tenant at Enable and measured
      # again by the hub's identity policy (clause E) on every mint. Read-only:
      # list and watch to learn which edges exist, get because the edges data
      # plane's first gate is a real GET of the addressed edge as the caller.
      # Mirrors manifest.yaml.
      dependencies:
        - name: edges
          composes:
            - group: edges.railgrid.ai
              resource: kubernetesclusters
              verbs: ["get", "list", "watch"]
      ui:
        url: "http://{{ include "kuery.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
      backend:
        url: "http://{{ include "kuery.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        # /readyz, not /healthz: readiness reports whether this provider can
        # actually reach the APIExport virtual workspace it watches and, while
        # a replica holds the controller lease, whether tenant workspaces are
        # really being watched. /healthz answers "the process is up", which was
        # true the whole time nothing reconciled.
        healthPath: "/readyz"

      # No edgeProxyAccess: kuery reaches each tenant's edges as a hub-minted
      # identity owned by that workspace's kuery APIBinding, carrying the
      # composition above plus `create` on kubernetesclusters/k8s for the edges
      # it engages. Mirrors manifest.yaml.

      apiExport:
        name: "kuery.providers.railgrid.ai"
        # NO permissionClaims AT ALL. No first-party (*.railgrid.ai) claim,
        # because one pins a single APIExport identityHash for every consumer
        # and breaks the moment an org self-hosts the edges provider — the
        # composition above is how the engagement controller reaches an edge
        # instead. And no serviceaccounts, secrets, clusterroles or
        # clusterrolebindings: a provider does not mint identities, it asks the
        # hub (docs/provider-connectivity-contract.md §"Scoped identities").
      # Data-plane verbs this provider serves, declared so the coordinate is
      # machine-readable. Declaring one grants and serves nothing: every call is
      # still authorized by this provider's own caller-scoped SSAR on
      # {resource}/{verb}. What the declaration buys is that the hub
      # scoped-identity service can mint a capability for a verb it can verify
      # exists (pkg/hub/identity/policy.go clause C), instead of consumers
      # hardcoding a coordinate nobody validates.
      dataPlane:
        verbs:
          - resource: savedviews
            verb: run
            description: "Run the saved view's query and return its result."
            readOnly: true
      # Lets an organization run this provider in its own cluster
      # (docs/byo-providers.md). Keep manifest.yaml and
      # deploy/chart/templates/catalogentry.yaml in sync — the chart copy is the
      # one that reaches production.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/railgrid/charts"
          name: "railgrid-kuery-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "railgrid-provider-kuery"
        releaseName: "kuery"
        docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/kuery/deploy/chart/README.md"
        # The chart carries its own values reference, so the portal can show it
        # offline and for the version actually installed.
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
        # No requiredValues: kuery pins no APIExport identity hashes — edge
        # discovery rides each workspace's own edges binding, whichever copy
        # of the edges provider that is.
{{- end }}
