{{- if .Values.catalogEntry.enabled -}}
# CatalogEntry registers this provider with the railgrid hub for routing + the
# portal Enable flow. It is a kcp resource (providers.railgrid.ai/v1alpha1),
# so it MUST NOT be applied to the hosting cluster where this chart installs.
# Instead the chart renders it into a ConfigMap that the init container mounts
# and applies into the provider workspace via the provider kubeconfig
# (RAILGRID_CATALOGENTRY_FILE -> sdkinstall.Bootstrap). The hub watches
# CatalogEntries in every workspace bound to providers.railgrid.ai, including
# the provider's own, so a self-registered entry is seen.
#
# It only REFERENCES the APIExport (apiExport.name); the APIExport, its
# APIResourceSchemas, the APIExportEndpointSlice, and the bind grant are created
# by the same init container. The hub no longer provisions anything from this
# CatalogEntry.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quickstart.fullname" . }}-catalogentry
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
data:
  catalogentry.yaml: |
    apiVersion: providers.railgrid.ai/v1alpha1
    kind: CatalogEntry
    metadata:
      name: quickstart
    spec:
      displayName: "Quickstart"
      description: "Reference provider demonstrating the railgrid plugin surface."
      vendor: "railgrid"
      version: {{ .Chart.AppVersion | quote }}
      category: "Demo"
      iconURL: "/ui/providers/quickstart/icon.svg"
      ui:
        url: "http://{{ include "quickstart.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        indexPath: "/"
      backend:
        url: "http://{{ include "quickstart.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
        healthPath: "/readyz"
      # The provider reconciles only the Greetings its own APIExport serves;
      # the single claim below is the subresource gate, not data. Mirrors
      # manifest.yaml — both must change together.
      apiExport:
        name: "quickstart.providers.railgrid.ai"
        permissionClaims:
          # Every provider that serves a custom subresource needs this one claim:
          # on the shard-forwarded path there is no caller bearer, so the provider
          # runs a SubjectAccessReview for the stamped caller through its own
          # APIExport virtual workspace, and kcp serves that builtin there only for
          # an export that claims it (hack/verify-provider-contract.mjs
          # subresource-access-claim). Built-in review API: no identityHash, verb
          # create only; tenantScoped because the VW confines each review to the
          # tenant's OWN workspace.
          - group: authorization.k8s.io
            resource: subjectaccessreviews
            verbs: [create]
            tenantScoped: true
      # Data-plane verbs this provider serves, declared so the coordinate is
      # machine-readable. Declaring one grants nothing: every call is still
      # authorized by kcp as `create` on {resource}/{verb} with ordinary RBAC,
      # then gated for visibility by this provider. What the declaration buys,
      # per verb: codegen emits the kcp custom subresource "<resource>/<verb>"
      # on the generated APIExport (the shard routes
      # it to this provider through its DataPlaneEndpointSlice) together with the
      # "<Verb>Request" schema the entry names; a consumer provider can compose the
      # coordinate under spec.dependencies[].composes[] and have it claimed on ITS
      # export; and the hub scoped-identity service (pkg/hub/identity/policy.go
      # clause C) can mint a capability only for a verb it can verify exists. None
      # of this is a permission claim of this provider: a claim names another
      # export's resources, never one's own verbs.
      dataPlane:
        verbs:
          - resource: greetings
            verb: greet
            description: "Return the greeting this Greeting describes."
            readOnly: true
      # Lets an organization run its own copy of this provider (see
      # docs/byo-providers.md). The chart version is stamped from the release so
      # the instructions the hub generates pin the same version that published
      # this entry. Mirrors manifest.yaml — keep both in sync.
      selfHosting:
        supported: true
        chart:
          repository: "oci://ghcr.io/railgrid/charts"
          name: "railgrid-quickstart-provider"
          version: {{ .Chart.Version | quote }}
        namespace: "railgrid-provider-quickstart"
        releaseName: "quickstart"
        docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/quickstart/deploy/chart/README.md"
        # The chart carries its own values reference, so the portal can show it
        # offline and for the version actually installed.
        valuesDoc: |{{ .Files.Get "README.md" | nindent 10 }}
{{- end }}
