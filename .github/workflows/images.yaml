name: Container Image Build and Push

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  # On PRs and manual runs, jobs use build-only mode (push: false, single-arch)
  # so a broken Dockerfile or build context is caught before a release tag.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # Spelled out rather than derived from github.repository so the published
  # names stay pinned to the chart values (ghcr.io/faroshq/faros-{hub,agent})
  # regardless of what the repository is called. Matches helm-images.yaml and
  # the provider matrix below, which all use repository_owner + a literal name.
  HUB_IMAGE_NAME: ${{ github.repository_owner }}/faros-hub
  AGENT_IMAGE_NAME: ${{ github.repository_owner }}/faros-agent

# Cancel superseded PR validation only; publishing runs have unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      providers: ${{ steps.changes.outputs.providers }}
      portal-matrix: ${{ steps.changes.outputs.portal-matrix }}
      image-matrix: ${{ steps.changes.outputs.image-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-changes
        id: changes

  build-and-push-hub-image:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: (github.event_name == 'push' || github.event_name == 'release')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HUB_IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.hub
          # Multi-arch publishing; single-arch validation on PRs and manual runs.
          platforms: ${{ (github.event_name == 'push' || github.event_name == 'release') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'release') }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.release.created_at }}

  # PR and manual validation of selected provider Dockerfiles and build contexts,
  # before the split sync reaches a mirror. The selector preserves companion
  # images and their distinct contexts in the full matrix. These builds are NEVER
  # pushed here — provider images are published per-provider, stamped with the
  # provider's own version, by provider-release.yaml on a `providers/<name>/v*`
  # tag. (Publishing here would tag provider images with the hub version.)
  build-and-push-provider-images:
    needs: changes
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Repo-root context by default: provider modules resolve the
          # in-tree provider-sdk via a go.mod replace and their Dockerfiles
          # copy it into the build (docker build -f providers/<n>/Dockerfile .).
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile || format('./providers/{0}/Dockerfile', matrix.name) }}
          # Provider publication stays in provider-release.yaml.
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=provider-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=provider-${{ matrix.name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-agent-image:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: (github.event_name == 'push' || github.event_name == 'release')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.agent
          # Multi-arch publishing; single-arch validation on PRs and manual runs.
          platforms: ${{ (github.event_name == 'push' || github.event_name == 'release') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'release') }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.release.created_at }}

  result:
    name: Images result
    if: always()
    needs: [changes, build-and-push-agent-image, build-and-push-hub-image, build-and-push-provider-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require selected jobs to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 hack/ci/result.py images
