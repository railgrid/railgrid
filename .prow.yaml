# Prow jobs for this repository, served at https://prow-dev.railgrid.ai.
# Prow reads this file from the pull request's own HEAD, so a PR that changes
# it is tested with its own version. Runbook: hack/ci/prow/README.md.
#
# Every job runs `hack/ci/prow/job.sh <job>` in the CI image
# (hack/ci/prow/image/, tag = hack/ci/prow/image/VERSION). job.sh holds the
# commands and mirrors the GitHub Actions jobs named in each comment.
#
# These jobs are the pull request gate. GitHub Actions keeps only releases,
# image and chart publishing, the mirror splits, the CI image and macOS; the
# CI and E2E workflows are a manual fallback (workflow_dispatch). No job here
# is `optional`, so Tide does not merge past a red one, and Tide tests a PR
# against the current main before merging it. An approver can waive a job on
# one PR with `/override <context>`.
#
# Docs-only PRs (docs/ and *.md) start only `contracts`; that is the `docs`
# selection mode of hack/ci/README.md. The provider-ui mode is decided inside
# job.sh, which exits 0 for jobs the mode excludes.
#
# The kind suites carry the label preset-dind-enabled and run PRIVILEGED on
# the shared cluster nodes. Prow tests a PR from outside the railgrid org only
# after an org member comments /ok-to-test: read the diff first, this file and
# hack/ci/prow/ included.
#
# Every job has a CPU limit equal to its request, and a memory limit. For the
# kind suites the limits also cover everything Docker starts inside the pod
# (image builds, kind nodes): runner.sh parents dockerd under the pod's own
# cgroup. 4 CPUs is what a GitHub-hosted runner has. Do not
# remove them: the nodes also run the dev platform and the cluster's single
# CoreDNS, and on the first run unlimited jobs took 99% of two nodes' CPU and
# DNS timed out for every pod, the jobs' own included.
#
# Periodics cannot be defined here; they live in railgrid/ops
# (cicd/apps/railgrid-dev/prow/config.yaml).
presubmits:
  # Repository contracts; runs on every PR, docs-only ones included (ci.yaml `contracts`).
  - name: pull-railgrid-contracts
    always_run: true
    branches:
      - ^main$
    decoration_config:
      timeout: 25m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - contracts
          resources:
            requests:
              cpu: "2"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi

  # make build + verify-codegen (ci.yaml `build`, `verify-codegen`).
  - name: pull-railgrid-build
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    decoration_config:
      timeout: 30m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - build
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi

  # golangci-lint, root module and the App Studio harness (ci.yaml `lint`).
  - name: pull-railgrid-lint
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    decoration_config:
      timeout: 30m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - lint
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi

  # Root module tests under -race (ci.yaml `test-modules`, module `.`).
  - name: pull-railgrid-test
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    decoration_config:
      timeout: 45m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - test
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi

  # Every standalone module, then the App Studio store on PostgreSQL (ci.yaml `test-modules`, `test-app-studio-postgres`).
  - name: pull-railgrid-test-providers
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    decoration_config:
      timeout: 75m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - test-providers
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi

  # Root portal and the selected provider portals (ci.yaml `portal`, `provider-portals`).
  - name: pull-railgrid-portals
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    decoration_config:
      timeout: 45m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - portals
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi

  # Provider suites on embedded kcp, no Docker (e2e.yaml `e2e-providers`).
  - name: pull-railgrid-e2e-providers
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    decoration_config:
      timeout: 60m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - e2e-providers
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi

  # kind: standalone suite (e2e.yaml `e2e-standalone`).
  - name: pull-railgrid-e2e-standalone
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    labels:
      preset-dind-enabled: "true"
    decoration_config:
      timeout: 80m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - e2e-standalone
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi

  # kind: SSH server-mode suite (e2e.yaml `e2e-ssh`).
  - name: pull-railgrid-e2e-ssh
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    labels:
      preset-dind-enabled: "true"
    decoration_config:
      timeout: 55m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - e2e-ssh
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi

  # kind: OIDC suite with Dex (e2e.yaml `e2e-oidc`).
  - name: pull-railgrid-e2e-oidc
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    labels:
      preset-dind-enabled: "true"
    decoration_config:
      timeout: 60m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - e2e-oidc
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi

  # kind: kcp via Helm (e2e.yaml `e2e-external-kcp`).
  - name: pull-railgrid-e2e-external-kcp
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    labels:
      preset-dind-enabled: "true"
    decoration_config:
      timeout: 110m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - e2e-external-kcp
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi

  # kind: edges data-plane connectivity (e2e.yaml `e2e-edges-connectivity`).
  - name: pull-railgrid-e2e-edges-connectivity
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    labels:
      preset-dind-enabled: "true"
    decoration_config:
      timeout: 45m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - e2e-edges-connectivity
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi

  # kind: railgrid CLI suite (e2e.yaml `e2e-cli`).
  - name: pull-railgrid-e2e-cli
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    labels:
      preset-dind-enabled: "true"
    decoration_config:
      timeout: 45m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - e2e-cli
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi

  # The jobs below took over the pull_request triggers of the remaining
  # workflows. Like every job here they start on each non-docs PR and are
  # required; job.sh narrows the work to what the PR touched, the way the
  # workflows' path filters and selection did, and exits 0 when that is nothing.

  # Provider images whose build context the PR changed (hack/ci/matrices.json),
  # and the infrastructure example apps: built, never pushed (was images.yaml
  # and infrastructure-examples.yaml on pull_request).
  - name: pull-railgrid-images
    skip_if_only_changed: '^docs/|\.md$'
    branches:
      - ^main$
    labels:
      preset-dind-enabled: "true"
    decoration_config:
      timeout: 90m
    spec:
      containers:
        - image: ghcr.io/railgrid/railgrid-ci:v3
          command:
            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - images
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi

  # kind: every seeded infrastructure Template on a real kro (was
