            - runner.sh
          args:
            - hack/ci/prow/job.sh
            - lint
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi

  # Root module tests under -race (ci.yaml `test-modules`, module `.`).
  - name: pull-railgrid-test
    skip_if_only_changed: '^docs/|\.md$'
    optional: true
    branches:
      - ^main$
