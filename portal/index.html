<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faros Portal</title>
    <!-- Give the browser's native web-content surface a light-safe color
         before the renderer submits its first frame. The bootstrap immediately
         narrows this to the resolved Faros theme in the same parser task. -->
    <meta id="faros-color-scheme" name="color-scheme" content="light dark" />
    <!-- Static, not inline: the portal CSP has no 'unsafe-inline' for
         scripts (pkg/hub/portal_security.go). Synchronous so it still runs
         before the first frame; the body lives in public/theme-bootstrap.js. -->
    <script id="faros-theme-bootstrap" src="/theme-bootstrap.js"></script>
  </head>
  <body class="bg-surface text-text-primary antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
