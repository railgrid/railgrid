apiVersion: infrastructure.railgrid.ai/v1alpha1
kind: Template
metadata:
  name: simple-webapp
spec:
  displayName: "Simple web app"
  description: "A single-container web app on a public URL — Deployment + Service + HTTPRoute. No backend tiers; connects to a separate database / redis-cache instance via the connections input. Development-capable: can back an App Studio project with a hot-reload dev server."
  category: Workloads
  version: 0.3.0
  # exposure: what the platform tells callers about reaching an instance.
  # Every instance is published; App Studio's preview depends on it.
  exposure: public
  backend: kro
  # One-click provision defaults for the portal form. nginx serves its welcome
  # page on port 80, so "Provision → see it working" needs zero external setup.
  sampleValues:
    name: demo-site
    image: nginx:latest
    port: 80
  # Operational guidance for AI agents discovering this template over MCP. Not
  # shown in the portal UI — it tells an LLM how to use the template and where
  # its outputs land.
  agent:
    usage: |
      Deploys ONE container serving HTTP on ONE public URL. Choose this for
      frontend-only or single-process apps — static sites, single-page apps, a
      self-contained server — when there is no separate backend tier. If the
      app needs a separate API tier + its own Postgres, use the "application"
      template instead. A single container that needs Postgres or Redis: first
      provision a "database" / "redis-cache" instance in the same workspace,
      then connect it with the connections input (below).

      CONNECTIONS (the connections input) — inject a sibling instance's
      credentials as env, sourced from its Secret (never templated in clear):
        • connections.database: <values.name of a database instance> →
          DATABASE_URL = `postgres://appuser:<password>@<name>-db:5432/appdb`.
          The URI has NO sslmode and the in-cluster Postgres has TLS disabled,
          so connect with sslmode=disable (append `?sslmode=disable` / set it
          if your driver defaults to TLS, e.g. Node `pg`, JDBC).
        • connections.cache: <values.name of a redis-cache instance> →
          REDIS_URL = `redis://:<password>@<name>:6379`.
        • Unset (default "") = not connected; the variable is left unset. A
          name that is set makes the pod wait until that instance's Secret
          exists, so it must name a real instance in THIS workspace.
        • The database/cache boots alongside your app: RETRY the first
          connection instead of exiting, and run schema creation/migrations
          idempotently inside that same retry loop.

      PRODUCTION MODE — you supply exactly one container image (the image
      input) and nothing else:
        • Plain HTTP server, any language/base image. Bind to 0.0.0.0 on the
          port input (default 8080), NOT 127.0.0.1, or the platform cannot
          route to it. The platform injects $PORT (= the port input), so an
          app that honors $PORT binds the right port automatically.
        • Stateless — no persistent disk. Pods may be restarted or scaled
          (the replicas input).
        • The platform provisions the Service, the public route, and the URL;
          you do NOT create Services, Ingresses, or routes.

      DEVELOPMENT MODE (provision with railgridMode: development): the image input
      is ignored (and may be omitted) — the platform runs a Node.js dev
      container against the project workspace and serves it on the same public
      URL a production instance would get. Push source with the dev_sync tool
      (hot reload, no image builds) and read dev-server logs with dev_logs. The whole project workspace is the
      app (workspacePath "."); a package.json with a dev script (vite et al)
      is auto-detected, otherwise vite is bootstrapped directly.

      INPUTS you set when provisioning: name (required); image (required in
      production, ignored in development), port, replicas, env (env-var map;
      not for secrets), connections.database / connections.cache (see
      CONNECTIONS; they apply in both modes), expose.hostnamePrefix, access
      (public|private; default public — private requires platform sign-in and
      an RBAC grant on this instance). The platform stamps spec.expose.fqdn
      and spec.railgridCluster — do not set them. All except name and railgridMode
      can be changed later with update_instance; flipping access is an
      in-place update.
    outputs:
      - "status.url is the public HTTPS URL (status.host = bare hostname) in every mode; requests enter through the platform access gate."
      - "status.ready — ready replica count for the app Deployment."
  # ── Portal presentation ───────────────────────────────────────────────
  view:
    columns:
      - header: URL
        value: "${status.url}"
        type: link
    detail:
      - title: Access
        fields:
          - label: URL
            value: "${status.url}"
            type: link
          - label: Hostname
            path: status.host
            type: code
      - title: Readiness
        fields:
          - label: App
            path: status.ready
  instanceCRD:
    group: infrastructure.railgrid.ai
    version: v1alpha1
    resource: simplewebapps
    kind: SimpleWebApp
  # ── Tenant-facing inputs ──────────────────────────────────────────────
  # spec.expose.fqdn is populated by the instance controller, NOT the tenant
  # (same convention as the application template): the public hostname,
  # computed as <prefix|name>-<tenantHash>.<appBaseDomain>. The RGD references
  # it for the HTTPRoute hostname.
  schema:
    type: object
    properties:
      name:
        type: string
        description: "Logical name; used as the resource-name prefix in the tenant namespace and the default hostname prefix."
      railgridRedeployRevision:
        type: string
        default: initial
        description: "Computed by the platform — do NOT set. Non-secret rollout revision used to redeploy the application workload without changing the instance identity."
      railgridCluster:
        type: string
        default: pending
        description: "Computed by the platform — do NOT set. Tenant workspace cluster ID the embedded access gate presents to the hub for sign-in authorization."
      access:
        type: string
        enum: ["public", "private"]
        default: public
        description: "Who can reach the app URL. public: anyone with the link. private: platform sign-in required; access is granted by kcp RBAC on this instance's access subresource (App Studio's share dialog, or a ClusterRole/ClusterRoleBinding pair). Flipping the value is an in-place update — no redeploy, no data loss."
      image:
        type: string
        description: "Container image serving HTTP. Required in production mode; ignored (and may be omitted) when railgridMode is development — dev mode runs the platform dev image against the project workspace."
      port:
        type: integer
        default: 8080
        description: "Port the container listens on (dev mode: the port the dev server must bind)."
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 10
      env:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: "Environment variables for the container, injected via a ConfigMap + envFrom (updatable in place). Platform-set vars (PORT, and DATABASE_URL / REDIS_URL when a connection is set) win on name conflicts. Values are stored world-readable — not for secrets; use connections for database/cache credentials."
      # Fixed slots, not a list input: simpleschema.go gives a list of objects
      # no item properties on the kro side, and the dev overlay copies the
      # container env list literally, so a CEL-built env list would be dropped
      # in development mode. Each slot renders one literal secretKeyRef env
      # entry below. default: {} so the nested "" (= not connected) defaults
      # apply when the object is omitted; kro also defaults the object to {}
      # on the runtime CRD because a child has a default. The pattern admits
      # "" so that default validates.
      connections:
        type: object
        default: {}
        description: "Sibling instances in this workspace whose credentials are injected as env, read from their Secret (never templated in clear). Empty = not connected."
        properties:
          database:
            type: string
            default: ""
            pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 50
            description: "values.name of a database instance in this workspace; its connection URI is injected as DATABASE_URL (no sslmode; in-cluster TLS is off, so use sslmode=disable). The pod waits until that instance's Secret exists."
          cache:
            type: string
            default: ""
            pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 63
            description: "values.name of a redis-cache instance in this workspace; its connection URI is injected as REDIS_URL. The pod waits until that instance's Secret exists."
      # default: {} so nested defaults apply and the controller can stamp fqdn
      # onto an instance that omitted the expose object.
      expose:
        type: object
        default: {}
        properties:
          hostnamePrefix:
            type: string
            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 50
            description: "Left-most DNS label. Defaults to .name. Final host = <prefix>-<tenantHash>.<appBaseDomain>."
          fqdn:
            type: string
            description: "Computed by the platform — do NOT set. The public hostname the app is served on."
    required:
      - name
    # The image is only required when the instance actually runs it: production
    # mode. Development mode swaps the workload onto the platform dev image, so
    # a dev-only project needs none. Enforced on the kcp-side CRD; railgridMode
    # defaults to "production".
    x-kubernetes-validations:
      - rule: "(has(self.railgridMode) && self.railgridMode == 'development') || has(self.image)"
        message: "image is required in production mode"

  # ── Development mode (docs/app-studio-template-sandboxes.md) ──────────
  # Single component claiming the whole project workspace (workspacePath "."),
  # so an App Studio project's files land at the dev container's /workspace
  # root. The start command reuses the proven vite shim from the application
  # template's frontend tier: it forces server.host + server.allowedHosts so
  # the dev server accepts the proxied preview Host header, then dynamically
  # loads the platform preview-bridge plugin when trusted keys are installed.
  # A missing plugin/config fails open and leaves the ordinary preview intact.
  development:
    # CI is scaffold-owned. App Studio observes/dispatches this exact workflow
    # path and never injects or rewrites build configuration.
    build:
      workflowPath: .github/workflows/build.yaml
    # Starter source new projects are seeded from: a single-app Vite
    # hello-world honoring the platform contract (PORT, 0.0.0.0, dev+start
    # scripts). Tag-locked — bump this ref together with the sampleValues
    # image tag. Without this block a new project gets an EMPTY sandbox.
    scaffold:
      repository: https://github.com/railgrid/scaffold-simple-webapp
      ref: v0.1.4
    components:
      app:
        workspacePath: .
        imageInput: image
        devImage: "${railgrid.devImage.node}"
        workingDir: /workspace
        startCommand: "SHIM=.railgrid-vite.config.mjs; printf '%s' '' | base64 -d > $SHIM; grep -qxF $SHIM .gitignore 2>/dev/null || echo $SHIM >> .gitignore; if [ -f package.json ]; then (npm run dev -- --host 0.0.0.0 --port $PORT --config $SHIM || npm run dev -- --host 0.0.0.0 --port $PORT || npm start); else npx --yes vite --host 0.0.0.0 --port $PORT --config $SHIM || npx --yes vite --host 0.0.0.0 --port $PORT; fi"
        port: app
        reload:
          strategy: process
          rules:
            - paths: ["package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml"]
              command: "npm install --no-audit --no-fund"

  # ── Data plane (development mode) ─────────────────────────────────────
  # Per-component control verbs, served as
  # …/simplewebapps/<name>/components/app/{sync,restart,log,env,process,exec}. The status
  # paths they resolve through are published by the synthesized dev overlay,
  # so in production mode these verbs answer 409 instance-not-ready.
  dataPlane:
    runtimeNamespacePath: status.runtimeNamespace
    tokenSecretPath: status.controlSecretRef
    endpoints:
      runtime-status:
        fromStatus: true
    components:
      app:
        exec:
          maxTimeoutSeconds: 120
          maxOutputBytes: 262144
        endpoints:
          sync:
            servicePath: status.components.app.controlServiceRef
            port: control
            upstreamPath: /sync
            methods: ["POST"]
          restart:
            servicePath: status.components.app.controlServiceRef
            port: control
            upstreamPath: /restart
            methods: ["POST"]
          env:
            servicePath: status.components.app.controlServiceRef
            port: control
            upstreamPath: /env
            methods: ["POST"]
          log:
            servicePath: status.components.app.controlServiceRef
            port: control
            upstreamPath: /logs
            methods: ["GET"]
            stream: true
          process:
            servicePath: status.components.app.controlServiceRef
            port: control
            upstreamPath: /status
            methods: ["GET"]

  # ── backendConfig: the kro resource graph ─────────────────────────────
  # Every resource sets namespace: default — the control-plane/data-plane split
  # materializes these on the runtime cluster and remaps that to the per-tenant
  # namespace. ${railgrid.gatewayName} / ${railgrid.gatewayNamespace} are substituted
  # for the platform's configured Gateway API parent before the RGD is authored.
  backendConfig:
    resources:
      # Tenant env vars ride a ConfigMap consumed via envFrom so the map input
      # needs no CEL list synthesis; explicit container env (PORT, and a
      # connected DATABASE_URL / REDIS_URL) wins over envFrom on name
      # conflicts, so platform vars can't be clobbered.
      - id: appEnv
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-env
            namespace: default
          data: ${schema.spec.env}
      # The graph id follows the dev-overlay convention: component "app" →
      # workload id "appDeployment".
      - id: appDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            replicas: ${schema.spec.replicas}
            selector:
              matchLabels:
                app: ${schema.spec.name}
            template:
              metadata:
                annotations:
                  railgrid.ai/redeploy-revision: ${schema.spec.railgridRedeployRevision}
                labels:
                  app: ${schema.spec.name}
              spec:
                containers:
                  - name: app
                    image: ${schema.spec.image}
                    # Bind the exposed port. Railpack/buildpack and 12-factor
                    # images read $PORT; without it they fall back to their
                    # framework default (e.g. Node 3000), so nothing listens on
                    # spec.port — the Service and tunnel origin then get no
                    # backend and the edge returns 502. Mirrors dev mode, where
                    # the dev-agent binds the app to the same port.
                    env:
                      - name: PORT
                        value: ${string(schema.spec.port)}
                      # connections.* → credentials from the sibling
                      # instance's Secret in this (shared, per-workspace)
                      # runtime namespace. Unconnected: a placeholder name +
                      # optional=true leaves the var unset (and an env-map
                      # value of the same name, via envFrom, still applies).
                      # Connected: optional=false, so the pod waits for the
                      # Secret and its uri key. Literal entries so the dev
                      # overlay carries them into development mode too.
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: '${schema.spec.connections.database == "" ? schema.spec.name + "-unbound-db" : schema.spec.connections.database + "-db-credentials"}'
                            key: uri
                            optional: '${schema.spec.connections.database == ""}'
                      - name: REDIS_URL
                        valueFrom:
                          secretKeyRef:
                            name: '${schema.spec.connections.cache == "" ? schema.spec.name + "-unbound-cache" : schema.spec.connections.cache + "-credentials"}'
                            key: uri
                            optional: '${schema.spec.connections.cache == ""}'
                    envFrom:
                      - configMapRef:
                          name: ${appEnv.metadata.name}
                    ports:
                      - containerPort: ${schema.spec.port}
      - id: appService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}
            ports:
              - name: http
                port: ${schema.spec.port}
                targetPort: ${schema.spec.port}

      # ──────────────── Access gate (railgrid-access-proxy) ──────────────────
      # The platform-owned gate every request enters through, in every mode.
      # public (default): pure passthrough — the gate never contacts the hub,
      # so a hub outage cannot affect a public app. private: the gate runs the
      # hub sign-in flow once per visitor and keeps a bounded local session;
      # access = kcp RBAC (`get` on simplewebapps/<name> subresource `access`)
      # evaluated by the hub at sign-in time. Image and hub endpoints are
      # platform tokens; tenants only ever choose spec.access.
      - id: gateDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-gate
            namespace: default
          spec:
            replicas: 1
            # Recreate: a public gate pod and a private gate pod must never
            # serve behind the Service at once (a rolling flip would bounce
            # the browser between contradictory auth behaviours), and the
            # gate's sessions/states are in-memory anyway.
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: ${schema.spec.name}-gate
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-gate
                  # Stable across all gates: lets platform tooling (and the
                  # local Tilt image-reload) find/recycle every gate pod with
                  # one selector regardless of instance name.
                  app.kubernetes.io/name: railgrid-access-proxy
              spec:
                automountServiceAccountToken: false
                containers:
                  - name: gate
                    image: ${railgrid.accessProxyImage}
                    env:
                      - name: RAILGRID_ACCESS_PROXY_MODE
                        value: ${schema.spec.access}
                      - name: RAILGRID_ACCESS_PROXY_HOST
                        # The exact external host, including the local
                        # Gateway's forwarded port when one is configured
                        # (${railgrid.appPublicPort} is ":<port>" or "").
                        value: ${schema.spec.expose.fqdn + "${railgrid.appPublicPort}"}
                      - name: RAILGRID_ACCESS_PROXY_ROUTES
                        value: ${"/=http://" + appService.metadata.name + "." + appService.metadata.namespace + ".svc.cluster.local:" + string(schema.spec.port)}
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_CLUSTER
                        value: ${schema.spec.railgridCluster}
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_GROUP
                        value: infrastructure.railgrid.ai
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_RESOURCE
                        value: instances
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_NAME
                        value: ${schema.spec.name}
                      - name: RAILGRID_HUB_URL
                        value: ${railgrid.hubUrl}
                      - name: RAILGRID_HUB_PUBLIC_URL
                        value: ${railgrid.hubPublicUrl}
                      - name: RAILGRID_HUB_INSECURE_SKIP_TLS_VERIFY
                        value: ${railgrid.hubInsecure}
                    ports:
                      - name: http
                        containerPort: 8080
                    readinessProbe:
                      tcpSocket:
                        port: http
                      periodSeconds: 5
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        memory: 128Mi
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
      - id: gateService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-gate
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-gate
            ports:
              - name: http
                port: 8080
                targetPort: http

      # ──────────────── HTTPRoute (Gateway API exposure layer) ────────────────
      # Attaches to the platform Gateway; TLS terminates at the Gateway edge,
      # which programs the DNS record + tunnel route from this hostname. The
      # backend is ALWAYS the access gate — in development and production, in
      # public and private mode — so flipping spec.access never rewires the
      # route and no tenant workload is ever the direct route backend.
      - id: httpRoute
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: ${railgrid.gatewayName}
                namespace: ${railgrid.gatewayNamespace}
            hostnames:
              - ${schema.spec.expose.fqdn}
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: ${gateService.metadata.name}
                    port: 8080
        readyWhen:
          - '${httpRoute.status.parents.exists(p, p.parentRef.group == "gateway.networking.k8s.io" && p.parentRef.kind == "Gateway" && p.parentRef.name == "${railgrid.gatewayName}" && p.parentRef.namespace == "${railgrid.gatewayNamespace}" && p.conditions.exists(c, c.type == "Accepted" && c.status == "True" && c.observedGeneration == httpRoute.metadata.generation) && p.conditions.exists(c, c.type == "ResolvedRefs" && c.status == "True" && c.observedGeneration == httpRoute.metadata.generation))}'
    # url/host are read from the HTTPRoute (this kro fork forbids ${schema.*}
    # in status), same as the application template. ${railgrid.appPublicPort} is
    # substituted by the kro backend before kro sees this CEL.
    status:
      url: ${"https://" + httpRoute.spec.hostnames[0] + "${railgrid.appPublicPort}"}
      host: ${httpRoute.spec.hostnames[0]}
      ready: ${appDeployment.status.readyReplicas}
      # Always project the runtime confinement boundary from an unconditional
      # backend-owned resource. The development overlay also publishes this
      # field, but production has no direct HTTPRoute and still needs it for
      # the platform publication controller's Service validation.
      runtimeNamespace: ${appService.metadata.namespace}
      appServiceRef:
        name: ${appService.metadata.name}
        namespace: ${appService.metadata.namespace}
