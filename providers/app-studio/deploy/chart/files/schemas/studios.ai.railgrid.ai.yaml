              maxItems: 200
              type: array
              x-kubernetes-list-type: atomic
            models:
              description: |-
                Models reports, per registry model, whether its credential Secret is
                actually present and non-empty. This is how a client learns that a
                model is usable WITHOUT reading any Secret: the reconciler looks, and
                publishes one boolean. Nothing here is derived from the key's value.
              items:
                description: StudioLLMModelStatus is the observed usability of one
                  active model.
                properties:
                  configured:
                    description: |-
                      Configured is true when the referenced Secret exists and carries a
                      non-empty apiKey.
                    type: boolean
                  id:
                    description: ID matches spec.llm.models[].id.
                    maxLength: 63
                    type: string
                required:
                - id
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - id
              x-kubernetes-list-type: map
            phase:
              description: Phase is Ready when every enabled service is Ready.
              type: string
            protectedModelCredentials:
              description: |-
                ProtectedModelCredentials records external keys admitted to provider
                connections. It survives rotations and connection deletion, preventing
                caller-written legacy models from bypassing connection use permission.
              items:
                description: StudioModelCredentialIdentity identifies a protected
                  key without key material.
                properties:
                  secretName:
                    maxLength: 253
                    type: string
                  secretUID:
                    maxLength: 128
                    type: string
                required:
                - secretName
                - secretUID
                type: object
              maxItems: 1000
              type: array
              x-kubernetes-list-type: atomic
            retiredModelCredentials:
              description: |-
                RetiredModelCredentials fences generated key identities selected for
                collection. A status CAS publishes retirement before deleting the key;
                caller-written model rows cannot reactivate those identities afterward.
              items:
                description: StudioModelCredentialIdentity identifies a protected
                  key without key material.
                properties:
                  secretName:
                    maxLength: 253
                    type: string
                  secretUID:
                    maxLength: 128
                    type: string
                required:
