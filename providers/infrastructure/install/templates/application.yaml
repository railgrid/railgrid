apiVersion: infrastructure.railgrid.ai/v1alpha1
kind: Template
metadata:
  name: application
  annotations:
    # StatefulSet volumeClaimTemplates and Postgres major versions are not
    # safely mutable. App Studio exposes both choices before the first deploy
    # and locks them afterwards instead of promising a redeploy that will fail.
    railgrid.ai/immutable-inputs: "database.size,database.version"
spec:
  displayName: "3-tier application (web, backend, database)"
  description: "A 3-tier app — frontend + backend + Postgres — served through the platform access gate. spec.access chooses public or invite-only (kcp RBAC) reachability; the backend and database are never separately exposed."
  category: Workloads
  version: 0.1.0
  # Every instance is exposed through its embedded access gate on one public
  # URL; spec.access (public|private) chooses who can reach it.
  exposure: public
  backend: kro
  # Example payload the portal pre-fills the provision form with, so the 3-tier
  # demo is effectively one click. The frontend/backend images are the example
  # apps under examples/application/apps/, built + pushed to :latest by
  # .github/workflows/infrastructure-examples.yaml; oidc.mode=none drops the auth
  # gate so "Provision → see it working" needs zero external setup (demo/dev).
  sampleValues:
    name: demo
    webImage: ghcr.io/railgrid/scaffold-application/web:v0.1.4
    apiImage: ghcr.io/railgrid/scaffold-application/api:v0.1.4
    database:
      version: "16"
    oidc:
      mode: none
  # Operational guidance for AI agents discovering this template over MCP. Not
  # shown in the portal UI — it tells an LLM how to use the template and where
  # its outputs (URL, DB secret) land.
  agent:
    usage: |
      Deploys a 3-tier web app on ONE public URL: UI at `/`, API at `/api/*`, and a
      managed PostgreSQL database. Choose this to ship a containerized web app with
      a relational DB behind a single endpoint when you can supply both images.
      For a frontend-only or single-container app with no API tier and no database
      (a static site, an SPA, a self-contained server), prefer the simple-webapp
      template — it is also development-capable and carries none of this weight.

      READ THE DEVELOPMENT MODE SECTION BELOW BEFORE WRITING ANY CODE. The
      language rules differ by mode: PRODUCTION mode runs container images you
      build, in any language; DEVELOPMENT mode (railgridMode: development, what an
      App Studio project uses while you build it) runs BOTH tiers in a Node.js
      sandbox image and can execute nothing else. Everything below headed
      "IMAGES" applies to production images only.

      PRODUCTION MODE — YOU SUPPLY exactly two container images — webImage
      and apiImage —
      and nothing else app-side. The platform provisions Postgres, injects the DB
      connection and publishes one URL to both tiers; you do NOT create the
      database, Secrets, Services, or routes. The access input (public|private)
      chooses who can open the URL; private apps require platform sign-in and
      an RBAC grant on this instance. This
      contract is fully self-contained — build BOTH images from it BEFORE you
      provision; the only runtime couplings are the env var and ports below.

      BOTH IMAGES (production mode only — see DEVELOPMENT MODE for the sandbox):
        • Plain HTTP server, any language/base image. Bind to 0.0.0.0 on the port
          below (NOT 127.0.0.1), or the platform cannot route to it.
        • Stateless — no local/persistent disk; ALL state lives in Postgres. Pods
          may be restarted or scaled (the *Replicas inputs).

      BACKEND (apiImage) — the platform routes `/api/*` to it:
        • Env DATABASE_URL is injected — a PostgreSQL URI of the form
          `postgres://appuser:<password>@<host>:5432/appdb`. Connect from this env
          ONLY (never read a Kubernetes Secret). The URI has NO sslmode and the
          in-cluster Postgres has TLS disabled, so connect with sslmode=disable
          (append `?sslmode=disable` / set it if your driver defaults to requiring
          TLS, e.g. Node `pg`, JDBC).
        • Engine: PostgreSQL, major version = the database.version input ("15"|"16",
          default "16"). Database `appdb`, user `appuser`. It starts EMPTY — create
          your schema / run migrations on startup, idempotently.
        • Postgres may not be ready the moment you start (it boots alongside you) —
          RETRY the initial connection instead of exiting, and run the schema
          setup / migrations INSIDE that same retry loop: a fresh Postgres can
          accept a `select 1` and then drop the next query with ECONNRESET
          while it finishes initializing, so "connect OK, then migrate once"
          still crashes on first boot.
        • Listen on apiPort (input, default 8080). Serve your routes under the
          `/api/` prefix; the path is PRESERVED (you receive e.g. `/api/items`, not
          `/items`). A readiness endpoint that pings the DB is recommended.
        • The HTTP API shape (routes, JSON) is YOUR design — you also build the
          frontend that calls it; the only platform constraint is the `/api` prefix.

      FRONTEND (webImage) — the platform routes `/` to it:
        • Listen on webPort (input, default 8080); serve the UI on `/`.
          $PORT (= webPort) is injected, so an app that honors $PORT binds
          the right port automatically.
        • Call the backend from the BROWSER at `/api/*` on the SAME origin (e.g.
          `fetch("/api/items")`). There is NO separate backend host/URL — do not
          hardcode one or expect a backend env var. No database access.

      DEVELOPMENT PREVIEW AUTH (oidc.mode input):
        • none — no extra auth gate on the development preview.
        • byo  — oauth2-proxy gates BOTH `/` and `/api` in development with the
          caller's OIDC IdP (set issuerURL + clientID; client secret via
          prerequisites).
      This setting does NOT choose who can reach the app — that is the access
      input (public|private). Private apps reuse the platform sign-in through
      the embedded access gate; no per-app OIDC client is ever provisioned.

      COMPONENTS: this template has exactly two — "web" (the UI, its files
      live in web/) and "api" (the server, its files live in api/). A
      component's name IS its directory: tools that take a component
      (dev_sync, dev_logs, dev_restart) always want "web" or "api", never a
      path or a tier nickname.

      DEVELOPMENT MODE (provision with railgridMode: development): both image
      inputs are ignored (and may be omitted) — each component runs in a
      platform-managed Node.js sandbox image against its own directory, with
      Postgres and DATABASE_URL exactly as in production. Push source with the
      dev_sync tool (hot reload, no image builds; files are routed by those
      directories), read dev-server logs with dev_logs, and preview on the
      instance's status.url.

        • BOTH COMPONENTS MUST BE WRITTEN IN NODE.JS/JAVASCRIPT/TYPESCRIPT. The
          sandbox image contains the Node toolchain and NOTHING ELSE — no Go,
          Python, Ruby, Java, or .NET compiler or interpreter is installed. Go
          source, a Python app, or any other stack placed in web/ or api/ cannot
          run there however correct it is: the start command finds nothing to
          launch and the tier silently never listens on its port.
        • api/ MUST contain a package.json whose "dev" or "start" script starts
          the server on $PORT (the api component is started
          with `npm run dev || npm start`). Without that file nothing runs.
        • web/ MUST contain a package.json for a vite-based frontend (started
          with `npm run dev`, falling back to `npx vite`).
        • A Dockerfile is for the PRODUCTION image build only — it is never
          built or executed in development mode, so adding one does NOT make
          another language runnable in the sandbox.
        • If the app genuinely requires a non-Node api component, this template cannot
          develop it: say so and pick a template whose development toolchain
          matches, rather than writing source the sandbox cannot execute.

      INPUTS you set when provisioning: webImage, apiImage (default to
      the scaffold hello-world images — supply your own to run real code; omit
      in development mode); name, webPort,
      apiPort, webReplicas, apiReplicas, webEnv, apiEnv
      (per-component env-var maps; not for secrets), database.version, oidc.*,
      access (public|private; default public — private requires platform
      sign-in and an RBAC grant on this instance). The
      platform stamps spec.expose.fqdn, spec.railgridCluster, and
      spec.credentialsSecretName — do not
      set those. All except name, railgridMode, and database.version can be
      changed later with update_instance; flipping access is an in-place update.
    prerequisites:
      - "oidc.mode=byo only: a Secret named 'cloud-credentials' in the tenant's default namespace, key 'oidc_client_secret' = the OAuth2 client secret for your oidc.clientID."
    outputs:
      - "status.url is the public HTTPS URL (status.host = bare hostname) in every mode; requests enter through the platform access gate."
      - "Development BYO only: status.redirectURL is the OIDC redirect/callback URL to register with your IdP."
      - "Per-component readiness: status.webReady / apiReady / databaseReady / oauthReady (ready replica counts)."
      - "The api component's DATABASE_URL env is sourced from Secret '<name>-db-credentials' (key 'uri') in the instance namespace — informational; the image just reads the DATABASE_URL env, it never reads the Secret."
  # ── Portal presentation ───────────────────────────────────────────────
  # Tells the portal how to render this template's instances instead of the
  # default raw-JSON values dump. Field values are dot-paths or ${…}-interpolated
  # strings resolved against the instance's spec.* (inputs), status.* (computed
  # outputs), and meta.* (name/phase/…). type ∈ text|link|badge|code.
  view:
    # Extra columns in the "My instances" table (after Name/Template).
    columns:
      - header: URL
        value: "${status.url}"
        type: link
      - header: Dev auth
        path: spec.oidc.mode
        type: badge
    # Field groups on the instance detail page (replace the raw values dump).
    detail:
      - title: Access
        fields:
          - label: URL
            value: "${status.url}"
            type: link
          - label: Hostname
            path: status.host
            type: code
          - label: Redirect URL
            value: "${status.redirectURL}"
            type: link
      - title: Configuration
        fields:
          - label: Development auth mode
            path: spec.oidc.mode
            type: badge
          - label: Postgres version
            path: spec.database.version
            type: badge
          - label: DB secret
            path: status.dbConnectionSecretRef.name
            type: code
      - title: Readiness
        fields:
          - label: Frontend
            path: status.webReady
          - label: Backend
            path: status.apiReady
          - label: Database
            path: status.databaseReady
  instanceCRD:
    group: infrastructure.railgrid.ai
    version: v1alpha1
    resource: applications
    kind: Application
  # ── Tenant-facing inputs ──────────────────────────────────────────────
  # Nested objects (database/expose/oidc) are supported by the kro
  # SimpleSchema converter (backend/kro/simpleschema.go recurses).
  #
  # Two fields are populated by the Application instance controller, NOT the
  # tenant, and must NOT be set by hand:
  #   - expose.fqdn            the public hostname, computed as
  #                            <prefix|name>-<tenantHash>.apps.<baseDomain>
  #   - credentialsSecretName  the runtime Secret the controller bridges the
  #                            OIDC client secret into (key: oidc_client_secret)
  # The RGD below references both; the controller stamps them onto spec before
  # kro reconciles (see controller/application).
  schema:
    type: object
    properties:
      name:
        type: string
        description: "Logical name; used as the resource-name prefix in the tenant namespace and the default hostname prefix."
      railgridRedeployRevision:
        type: string
        default: initial
        description: "Computed by the platform — do NOT set. Non-secret rollout revision used to redeploy the application workloads without changing the instance identity."
      railgridCluster:
        type: string
        default: pending
        description: "Computed by the platform — do NOT set. Tenant workspace cluster ID the embedded access gate presents to the hub for sign-in authorization."
      access:
        type: string
        enum: ["public", "private"]
        default: public
        description: "Who can reach the app URL. public: anyone with the link. private: platform sign-in required; access is granted by kcp RBAC on this instance's access subresource (App Studio's share dialog, or a ClusterRole/ClusterRoleBinding pair). Flipping the value is an in-place update — no redeploy, no data loss."

      # ── Frontend tier (the only tier exposed, behind oauth2-proxy) ──
      webImage:
        type: string
        default: ghcr.io/railgrid/scaffold-application/web:v0.1.4
        description: "Container image for the public-facing frontend. Defaults to the scaffold hello-world (same tag as development.scaffold.ref) so provisioning with no images runs a working app — replace with your own image to ship real code. Ignored when railgridMode is development — dev mode runs the platform dev image against the project workspace."
      webPort:
        type: integer
        default: 8080
        description: "Port the frontend container listens on."
      webReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 10
      webEnv:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: "Environment variables for the frontend container, injected via a ConfigMap + envFrom (updatable in place). Platform-set vars (PORT) win on name conflicts. Values are stored world-readable — not for secrets."

      # ── Backend tier (internal; reachable only via cluster DNS) ──
      apiImage:
        type: string
        default: ghcr.io/railgrid/scaffold-application/api:v0.1.4
        description: "Container image for the internal backend/API tier. Defaults to the scaffold hello-world (same tag as development.scaffold.ref) so provisioning with no images runs a working app — replace with your own image to ship real code. Ignored when railgridMode is development."
      apiPort:
        type: integer
        default: 8080
      apiReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 10
      apiEnv:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: "Environment variables for the backend container, injected via a ConfigMap + envFrom (updatable in place). Platform-set vars (PORT, DATABASE_URL) win on name conflicts. Values are stored world-readable — not for secrets."

      # ── Database tier (Postgres; always provisioned in v1) ──
      # default: {} so an omitted database object is instantiated and its nested
      # defaults (version/size) apply — the RGD references ${schema.spec.database.version}
      # unconditionally, so a missing database object fails resource rendering.
      database:
        type: object
        default: {}
        properties:
          size:
            type: string
            enum: ["small", "medium", "large"]
            default: "small"
            description: "Database storage tier: small provisions 1Gi, medium 5Gi, or large 20Gi of persistent PostgreSQL storage."
          version:
            type: string
            enum: ["15", "16"]
            default: "16"

      # ── Exposure ──
      # default: {} so nested defaults apply and the controller can stamp fqdn
      # onto an instance that omitted the expose object.
      expose:
        type: object
        default: {}
        properties:
          hostnamePrefix:
            type: string
            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 50
            description: "Left-most DNS label. Defaults to .name. Final host = <prefix>-<tenantHash>.<appBaseDomain>."
          fqdn:
            type: string
            description: "Computed by the platform — do NOT set. The public hostname the app is served on."

      # ── OIDC (the gate in front of the frontend) ──
      # default: {} so oidc.mode defaults to "none" when the object is omitted —
      # the HTTPRoute backend references ${schema.spec.oidc.mode} unconditionally.
      oidc:
        type: object
        default: {}
        properties:
          mode:
            type: string
            enum: ["none", "byo"]
            default: "none"
            description: "Development preview auth only. none (default) adds no preview gate. byo uses your IdP; set issuerURL + clientID and put the client secret in cloud-credentials key oidc_client_secret. Platform-managed access control is the spec.access field instead — it never provisions an OIDC client per app."
          issuerURL:
            type: string
            description: "BYO mode: your IdP's OIDC issuer URL (required)."
          clientID:
            type: string
            description: "BYO mode: your OAuth2 client ID (required)."
          emailDomains:
            type: array
            items:
              type: string
            readOnly: true
            description: "Reserved for v1 (accepted but not yet wired; defaults to allowing any authenticated user)."
          scopes:
            type: string
            default: "openid email profile"

      # Controller-injected; see the schema header comment.
      credentialsSecretName:
        type: string
        description: "Computed by the platform — do NOT set."
    required:
      - name
    # Images are only required when the instance actually runs them: production
    # mode. Development mode (the platform-injected railgridMode field) swaps the
    # tier images for platform dev images, so a dev-only project needs none.
    # Enforced on the kcp-side CRD; railgridMode defaults to "production".
    x-kubernetes-validations:
      - rule: "(has(self.railgridMode) && self.railgridMode == 'development') || (has(self.webImage) && has(self.apiImage))"
        message: "webImage and apiImage are required in production mode"

  # ── Development mode (docs/app-studio-template-sandboxes.md) ──────────
  # Declares how instances run when provisioned with railgridMode: development:
  # the frontend and backend tiers hot-swap to platform dev images running the
  # railgrid-dev-agent against per-component workspace PVCs, while Postgres (and
  # the oauth gate, if enabled) run exactly as in production. The kro backend
  # synthesizes the overlay from this block — there is no second graph.
  #
  # v1 dev shape is node on both tiers (the scaffold ships a node frontend +
  # node backend); per-instance toolchain selection is a follow-up. The
  # frontend start command reuses the sandbox-runner vite shim (same base64,
  # same single-line/no-double-quote constraints do NOT apply here — this
  # lands in a Deployment env value — but the shim itself is proven, so it is
  # carried verbatim): it forces server.host + server.allowedHosts so the dev
  # server accepts the proxied preview Host header, and dynamically loads the
  # platform preview-bridge plugin when trusted keys are installed. Missing
  # plugin/config fails open and leaves the ordinary preview intact.
  development:
    # CI is scaffold-owned. App Studio observes/dispatches this exact workflow
    # path and never injects or rewrites build configuration.
    build:
      workflowPath: .github/workflows/build.yaml
    # Starter source new projects are seeded from: a working web+api+Postgres
    # hello-world honoring the full platform contract (PORT, same-origin
    # /api/*, DATABASE_URL with startup retry, dev+start scripts). Locked by
    # git tag: changing the scaffold repo does nothing until a new tag is cut
    # AND this ref (plus the sampleValues image tags above) is bumped to
    # match. Without this block a new project gets an EMPTY sandbox.
    scaffold:
      repository: https://github.com/railgrid/scaffold-application
      ref: v0.1.4
    components:
      web:
        workspacePath: web
        imageInput: webImage
        devImage: "${railgrid.devImage.node}"
        workingDir: /workspace
        startCommand: "SHIM=.railgrid-vite.config.mjs; printf '%s' '' | base64 -d > $SHIM; grep -qxF $SHIM .gitignore 2>/dev/null || echo $SHIM >> .gitignore; if [ -f package.json ]; then (npm run dev -- --host 0.0.0.0 --port $PORT --config $SHIM || npm run dev -- --host 0.0.0.0 --port $PORT || npm start); else npx --yes vite --host 0.0.0.0 --port $PORT --config $SHIM || npx --yes vite --host 0.0.0.0 --port $PORT; fi"
        port: web
        reload:
          strategy: process
          rules:
            - paths: ["package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml"]
              command: "npm install --no-audit --no-fund"
      api:
        workspacePath: api
        imageInput: apiImage
        devImage: "${railgrid.devImage.node}"
        workingDir: /workspace
        startCommand: "npm run dev || npm start"
        port: api
        reload:
          strategy: process
          rules:
            - paths: ["package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml"]
              command: "npm install --no-audit --no-fund"

  # ── Data plane (development mode) ─────────────────────────────────────
  # Per-component control verbs, served as
  # …/applications/<name>/components/{web,api}/{sync,restart,log,env,process,exec}.
  # The status paths they resolve through (status.components.*, controlSecretRef,
  # runtimeNamespace) are published by the synthesized dev overlay, so in
  # production mode these verbs answer 409 instance-not-ready — the data plane
  # is a development-mode surface.
  dataPlane:
    runtimeNamespacePath: status.runtimeNamespace
    tokenSecretPath: status.controlSecretRef
    endpoints:
      runtime-status:
        fromStatus: true
    components:
      web:
        exec:
          maxTimeoutSeconds: 120
          maxOutputBytes: 262144
        endpoints:
          sync:
            servicePath: status.components.web.controlServiceRef
            port: control
            upstreamPath: /sync
            methods: ["POST"]
          restart:
            servicePath: status.components.web.controlServiceRef
            port: control
            upstreamPath: /restart
            methods: ["POST"]
          env:
            servicePath: status.components.web.controlServiceRef
            port: control
            upstreamPath: /env
            methods: ["POST"]
          log:
            servicePath: status.components.web.controlServiceRef
            port: control
            upstreamPath: /logs
            methods: ["GET"]
            stream: true
          process:
            servicePath: status.components.web.controlServiceRef
            port: control
            upstreamPath: /status
            methods: ["GET"]
      api:
        exec:
          maxTimeoutSeconds: 120
          maxOutputBytes: 262144
        endpoints:
          sync:
            servicePath: status.components.api.controlServiceRef
            port: control
            upstreamPath: /sync
            methods: ["POST"]
          restart:
            servicePath: status.components.api.controlServiceRef
            port: control
            upstreamPath: /restart
            methods: ["POST"]
          env:
            servicePath: status.components.api.controlServiceRef
            port: control
            upstreamPath: /env
            methods: ["POST"]
          log:
            servicePath: status.components.api.controlServiceRef
            port: control
            upstreamPath: /logs
            methods: ["GET"]
            stream: true
          process:
            servicePath: status.components.api.controlServiceRef
            port: control
            upstreamPath: /status
            methods: ["GET"]

  # ── backendConfig: the kro resource graph ─────────────────────────────
  # Interpreted by the kro backend. Every resource sets namespace: default —
  # the control-plane/data-plane split materializes these on the runtime
  # cluster and remaps that to the per-tenant namespace (railgrid-tenants-<hash>),
  # so a tenant's whole app lands together and is isolated from other tenants.
  #
  # Reserved railgrid tokens: ${railgrid.gatewayName} / ${railgrid.gatewayNamespace}
  # are substituted for the platform's configured Gateway API parent
  # (RAILGRID_GATEWAY_NAME / RAILGRID_GATEWAY_NAMESPACE, default
  # "cloudflare-tunnel" in "cfgate-system") before the RGD is authored — kro
  # never sees the tokens.
  backendConfig:
    resources:
      # ───────────────────── Postgres tier ─────────────────────
      # Connection Secret. The non-sensitive fields are set here; the
      # pwgen Job below fills password + a full postgres:// URI, once.
      - id: dbCredentials
        template:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${schema.spec.name}-db-credentials
            namespace: default
          stringData:
            host: ${schema.spec.name}-db
            port: "5432"
            user: appuser
            dbname: appdb
      - id: dbPwgenAccount
        template:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
      - id: dbPwgenRole
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "patch"]
      - id: dbPwgenBinding
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: ${dbPwgenRole.metadata.name}
          subjects:
            - kind: ServiceAccount
              name: ${dbPwgenAccount.metadata.name}
              namespace: default
      # Mints a random password and a complete postgres:// URI into the
      # credentials Secret — once; no-ops if password is already set, so
      # re-reconciles don't rotate it. kro never sees the value.
      - id: dbPwgen
        template:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
          spec:
            backoffLimit: 5
            ttlSecondsAfterFinished: 600
            template:
              spec:
                serviceAccountName: ${dbPwgenAccount.metadata.name}
                restartPolicy: OnFailure
                containers:
                  - name: pwgen
                    image: bitnami/kubectl
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        SECRET="${dbCredentials.metadata.name}"
                        if [ -z "$(kubectl get secret "$SECRET" -o jsonpath='{.data.password}' 2>/dev/null)" ]; then
                          PW="$(LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 24)"
                          kubectl patch secret "$SECRET" --type merge \
                            -p "{\"stringData\":{\"password\":\"$PW\",\"uri\":\"postgres://appuser:$PW@${schema.spec.name}-db:5432/appdb\"}}"
                          echo "generated db credentials for $SECRET"
                        else
                          echo "db credentials already present for $SECRET"
                        fi
      - id: dbStatefulSet
        template:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: ${schema.spec.name}-db
            namespace: default
          spec:
            serviceName: ${schema.spec.name}-db
            replicas: 1
            # Tie the data PVC's lifecycle to the StatefulSet. The PVC is
            # created by the StatefulSet controller from volumeClaimTemplates
            # (NOT by kro), so it carries no kro labels and isn't in kro's
            # applyset — kro never garbage-collects it. With the k8s default
            # (whenDeleted: Retain) the PVC also outlives a StatefulSet delete,
            # so deleting an Application orphaned the volume: a same-name
            # recreate minted a fresh db password but Postgres recovered the old
            # data (old password) → "password authentication failed". Delete the
            # PVC when kro deletes the StatefulSet so a recreate starts clean.
            persistentVolumeClaimRetentionPolicy:
              whenDeleted: Delete
              whenScaled: Retain
            selector:
              matchLabels:
                app: ${schema.spec.name}-db
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-db
              spec:
                containers:
                  - name: postgres
                    image: postgres:${schema.spec.database.version}
                    env:
                      - name: POSTGRES_USER
                        value: appuser
                      - name: POSTGRES_DB
                        value: appdb
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${dbCredentials.metadata.name}
                            key: password
                      # Keep PGDATA in a subdir so the PVC mount root (which
                      # may contain lost+found) doesn't trip initdb.
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                    ports:
                      - containerPort: 5432
                    volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
            volumeClaimTemplates:
              - metadata:
                  name: data
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      # The logical tier is part of the production contract;
                      # map it to an actual PVC request so changing size is
                      # observable in the database resources.
                      storage: '${schema.spec.database.size == "small" ? "1Gi" : (schema.spec.database.size == "medium" ? "5Gi" : "20Gi")}'
      - id: dbService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-db
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-db
            ports:
              - port: 5432
                targetPort: 5432

      # ───────────────────── Backend tier ─────────────────────
      # Tenant env vars ride ConfigMaps consumed via envFrom so the map inputs
      # need no CEL list synthesis; explicit container env (PORT, DATABASE_URL)
      # wins over envFrom on name conflicts, so platform vars can't be
      # clobbered.
      - id: apiEnvMap
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-api-env
            namespace: default
          data: ${schema.spec.apiEnv}
      - id: apiDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-api
            namespace: default
          spec:
            replicas: ${schema.spec.apiReplicas}
            selector:
              matchLabels:
                app: ${schema.spec.name}-api
            template:
              metadata:
                annotations:
                  railgrid.ai/redeploy-revision: ${schema.spec.railgridRedeployRevision}
                labels:
                  app: ${schema.spec.name}-api
              spec:
                containers:
                  - name: api
                    image: ${schema.spec.apiImage}
                    env:
                      # Bind the exposed port. Railpack/12-factor images read
                      # $PORT; without it they fall back to a framework default
                      # (e.g. Node 3000) and nothing listens on apiPort, so
                      # the Service/route get no backend and the edge 502s.
                      - name: PORT
                        value: ${string(schema.spec.apiPort)}
                      # Full connection string incl. password — sourced from
                      # the Secret, never templated in clear.
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: ${dbCredentials.metadata.name}
                            key: uri
                    envFrom:
                      - configMapRef:
                          name: ${apiEnvMap.metadata.name}
                    ports:
                      - containerPort: ${schema.spec.apiPort}
      - id: apiService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-api
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-api
            ports:
              - name: http
                port: ${schema.spec.apiPort}
                targetPort: ${schema.spec.apiPort}

      # ───────────────────── Frontend tier ─────────────────────
      - id: webEnvMap
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-web-env
            namespace: default
          data: ${schema.spec.webEnv}
      - id: webDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-web
            namespace: default
          spec:
            replicas: ${schema.spec.webReplicas}
            selector:
              matchLabels:
                app: ${schema.spec.name}-web
            template:
              metadata:
                annotations:
                  railgrid.ai/redeploy-revision: ${schema.spec.railgridRedeployRevision}
                labels:
                  app: ${schema.spec.name}-web
              spec:
                containers:
                  - name: web
                    image: ${schema.spec.webImage}
                    # UI only — it calls the backend from the browser at
                    # /api/* on the same origin (the exposure layer routes /api
                    # to the backend), so no BACKEND_URL / server-side proxy.
                    # $PORT (= webPort) is injected so Railpack/12-factor
                    # images bind the exposed port instead of a framework
                    # default (e.g. Node 3000) — otherwise the edge 502s.
                    env:
                      - name: PORT
                        value: ${string(schema.spec.webPort)}
                    envFrom:
                      - configMapRef:
                          name: ${webEnvMap.metadata.name}
                    ports:
                      - containerPort: ${schema.spec.webPort}
      - id: webService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-web
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-web
            ports:
              - name: http
                port: ${schema.spec.webPort}
                targetPort: ${schema.spec.webPort}

      # ───────────────────── oauth2-proxy (the gate) ─────────────────────
      # Cookie secret, generated in-graph (32 random bytes, base64). The
      # pwgen Job fills it once; rotating it would invalidate live sessions,
      # so the Job no-ops if it's already set.
      - id: oauthCookieSecret
        includeWhen:
          - '${schema.spec.railgridMode == "development"}'
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${schema.spec.name}-oauth-cookie
            namespace: default
      - id: oauthPwgenAccount
        includeWhen:
          - '${schema.spec.railgridMode == "development"}'
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
      - id: oauthPwgenRole
        includeWhen:
          - '${schema.spec.railgridMode == "development"}'
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "patch"]
      - id: oauthPwgenBinding
        includeWhen:
          - '${schema.spec.railgridMode == "development"}'
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: ${oauthPwgenRole.metadata.name}
          subjects:
            - kind: ServiceAccount
              name: ${oauthPwgenAccount.metadata.name}
              namespace: default
      - id: oauthPwgen
        includeWhen:
          - '${schema.spec.railgridMode == "development"}'
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
          spec:
            backoffLimit: 5
            ttlSecondsAfterFinished: 600
            template:
              spec:
                serviceAccountName: ${oauthPwgenAccount.metadata.name}
                restartPolicy: OnFailure
                containers:
                  - name: pwgen
                    image: bitnami/kubectl
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        SECRET="${oauthCookieSecret.metadata.name}"
                        if [ -z "$(kubectl get secret "$SECRET" -o jsonpath='{.data.cookie-secret}' 2>/dev/null)" ]; then
                          CS="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
                          kubectl patch secret "$SECRET" --type merge \
                            -p "{\"stringData\":{\"cookie-secret\":\"$CS\"}}"
                          echo "generated cookie secret for $SECRET"
                        else
                          echo "cookie secret already present for $SECRET"
                        fi
      - id: oauthDeployment
        includeWhen:
          - '${schema.spec.railgridMode == "development"}'
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-oauth
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${schema.spec.name}-oauth
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-oauth
              spec:
                containers:
                  - name: oauth2-proxy
                    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
                    args:
                      - --provider=oidc
                      - --oidc-issuer-url=${schema.spec.oidc.issuerURL}
                      - --client-id=${schema.spec.oidc.clientID}
                      - --redirect-url=https://${schema.spec.expose.fqdn}/oauth2/callback
                      # Path-routed upstreams, both behind this gate: /api/* →
                      # backend, everything else → frontend. oauth2-proxy picks
                      # the longest matching path prefix. This is the byo-mode
                      # equivalent of the /api HTTPRoute used in mode=none, and
                      # keeps the backend authenticated (never exposed directly).
                      - --upstream=http://${schema.spec.name}-api:${string(schema.spec.apiPort)}/api/
                      - --upstream=http://${schema.spec.name}-web:${string(schema.spec.webPort)}
                      - --http-address=0.0.0.0:4180
                      - --scope=${schema.spec.oidc.scopes}
                      # v1: allow any successfully-authenticated user. In
                      # platform mode that's any railgrid/Dex user; oidc.emailDomains
                      # is reserved for finer control later.
                      - --email-domain=*
                      - --cookie-secure=true
                      # Behind the ingress/Cloudflare edge — trust XFF headers.
                      - --reverse-proxy=true
                      - --skip-provider-button=true
                    env:
                      # BYO: bridged from the tenant's cloud-credentials Secret.
                      # Platform: written by the controller after Dex CreateClient.
                      - name: OAUTH2_PROXY_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: ${schema.spec.credentialsSecretName}
                            key: oidc_client_secret
                      - name: OAUTH2_PROXY_COOKIE_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: ${oauthCookieSecret.metadata.name}
                            key: cookie-secret
                    ports:
                      - containerPort: 4180
      - id: oauthService
        includeWhen:
          - '${schema.spec.railgridMode == "development"}'
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-oauth
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-oauth
            ports:
              - port: 4180
                targetPort: 4180

      # ──────────────── Access gate (railgrid-access-proxy) ──────────────────
      # The platform-owned gate every request enters through, in every mode.
      # public (default): pure passthrough — the gate never contacts the hub,
      # so a hub outage cannot affect a public app. private: the gate runs the
      # hub sign-in flow once per visitor and keeps a bounded local session;
      # access = kcp RBAC (`get` on instances/<name> subresource `access`)
      # evaluated by the hub at sign-in time.
      #
      # Route table: /api → backend, / → frontend. In development with a BYO
      # OIDC preview gate, everything routes to oauth2-proxy instead, which
      # authenticates and path-routes itself (its upstreams cover /api). The
      # names are composed from schema values rather than resource refs so the
      # conditional oauth2-proxy resources are never graph dependencies of the
      # unconditional gate.
      - id: gateDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-gate
            namespace: default
          spec:
            replicas: 1
            # Recreate: a public gate pod and a private gate pod must never
            # serve behind the Service at once (a rolling flip would bounce
            # the browser between contradictory auth behaviours), and the
            # gate's sessions/states are in-memory anyway.
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: ${schema.spec.name}-gate
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-gate
                  # Stable across all gates: lets platform tooling (and the
                  # local Tilt image-reload) find/recycle every gate pod with
                  # one selector regardless of instance name.
                  app.kubernetes.io/name: railgrid-access-proxy
              spec:
                automountServiceAccountToken: false
                containers:
                  - name: gate
                    image: ${railgrid.accessProxyImage}
                    env:
                      - name: RAILGRID_ACCESS_PROXY_MODE
                        value: ${schema.spec.access}
                      - name: RAILGRID_ACCESS_PROXY_HOST
                        # The exact external host, including the local
                        # Gateway's forwarded port when one is configured
                        # (${railgrid.appPublicPort} is ":<port>" or "").
                        value: ${schema.spec.expose.fqdn + "${railgrid.appPublicPort}"}
                      - name: RAILGRID_ACCESS_PROXY_ROUTES
                        value: '${schema.spec.railgridMode == "development" && schema.spec.oidc.mode != "none" ? "/=http://" + schema.spec.name + "-oauth." + webService.metadata.namespace + ".svc.cluster.local:4180" : "/api=http://" + schema.spec.name + "-api." + webService.metadata.namespace + ".svc.cluster.local:" + string(schema.spec.apiPort) + "/api,/=http://" + schema.spec.name + "-web." + webService.metadata.namespace + ".svc.cluster.local:" + string(schema.spec.webPort)}'
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_CLUSTER
                        value: ${schema.spec.railgridCluster}
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_GROUP
                        value: infrastructure.railgrid.ai
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_RESOURCE
                        value: instances
                      - name: RAILGRID_ACCESS_PROXY_INSTANCE_NAME
                        value: ${schema.spec.name}
                      - name: RAILGRID_HUB_URL
                        value: ${railgrid.hubUrl}
                      - name: RAILGRID_HUB_PUBLIC_URL
                        value: ${railgrid.hubPublicUrl}
                      - name: RAILGRID_HUB_INSECURE_SKIP_TLS_VERIFY
                        value: ${railgrid.hubInsecure}
                    ports:
                      - name: http
                        containerPort: 8080
                    readinessProbe:
                      tcpSocket:
                        port: http
                      periodSeconds: 5
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        memory: 128Mi
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
      - id: gateService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-gate
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-gate
            ports:
              - name: http
                port: 8080
                targetPort: http

      # ──────────────── HTTPRoute (Gateway API exposure layer) ────────────────
      # Attaches to the platform Gateway (parentRefs computed from platform
      # config: ${railgrid.gatewayName} in ${railgrid.gatewayNamespace}, substituted
      # before the RGD is authored). No TLS config here — TLS terminates at the
      # Gateway edge (cfgate / Cloudflare Tunnel), which programs the DNS record
      # + tunnel route from this hostname. The backend is ALWAYS the access
      # gate — in development and production, in public and private mode — so
      # flipping spec.access never rewires the route and no tenant workload is
      # ever the direct route backend. Path fan-out (/api vs /) lives in the
      # gate's route table above.
      - id: httpRoute
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: ${railgrid.gatewayName}
                namespace: ${railgrid.gatewayNamespace}
            hostnames:
              - ${schema.spec.expose.fqdn}
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: ${gateService.metadata.name}
                    port: 8080
        readyWhen:
          - '${httpRoute.status.parents.exists(p, p.parentRef.group == "gateway.networking.k8s.io" && p.parentRef.kind == "Gateway" && p.parentRef.name == "${railgrid.gatewayName}" && p.parentRef.namespace == "${railgrid.gatewayNamespace}" && p.conditions.exists(c, c.type == "Accepted" && c.status == "True" && c.observedGeneration == httpRoute.metadata.generation) && p.conditions.exists(c, c.type == "ResolvedRefs" && c.status == "True" && c.observedGeneration == httpRoute.metadata.generation))}'
    # Projected onto the instance in the tenant's kcp workspace. url/host are
    # read from the HTTPRoute (this kro fork forbids ${schema.*} in status —
    # status may reference resources only — so we source the controller-stamped
    # fqdn from the HTTPRoute's hostnames rather than schema.spec.expose.fqdn).
    # The HTTPRoute is unconditional and always fronts the access gate, so
    # status.url is the app's URL in every mode.
    # Per-tier readiness lets the portal show progress. No secret values are
    # surfaced.
    # ${railgrid.appPublicPort} is substituted by the kro backend BEFORE kro sees
    # this CEL: "" in production (443 implied), ":<port>" when the Gateway is
    # only reachable on a forwarded port (local kind). The empty case leaves a
    # harmless `+ ""` in the expression.
    status:
      url: ${"https://" + httpRoute.spec.hostnames[0] + "${railgrid.appPublicPort}"}
      host: ${httpRoute.spec.hostnames[0]}
      redirectURL: ${"https://" + httpRoute.spec.hostnames[0] + "${railgrid.appPublicPort}" + "/oauth2/callback"}
      webReady: ${webDeployment.status.readyReplicas}
      apiReady: ${apiDeployment.status.readyReplicas}
      databaseReady: ${dbStatefulSet.status.readyReplicas}
      oauthReady: ${oauthDeployment.status.readyReplicas}
      # Unconditional backend-owned boundary used to confine all publication
      # origins even when the development-only HTTPRoute is absent.
      runtimeNamespace: ${webService.metadata.namespace}
      dbConnectionSecretRef:
        name: ${dbCredentials.metadata.name}
        namespace: ${dbCredentials.metadata.namespace}
      webServiceRef:
        name: ${webService.metadata.name}
        namespace: ${webService.metadata.namespace}
      apiServiceRef:
        name: ${apiService.metadata.name}
        namespace: ${apiService.metadata.namespace}
