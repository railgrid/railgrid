name: Actions Node SDK release

on:
  push:
    tags:
      - actions-node/v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test and publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: provider-sdk/actions-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#actions-node/v}"
          package_version="$(node --print "require('./package.json').version")"
          test "$version" = "$package_version"

      - name: Test package and clean install
        run: npm test && npm run test:install

      - name: Inspect publish artifact
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance

      - name: Verify registry install
        run: |
          version="$(node --print "require('./package.json').version")"
          scratch="$(mktemp -d)"
          cd "$scratch"
          npm init --yes >/dev/null
          # npm may scan a new release for several minutes before serving its tarball.
          deadline=$((SECONDS + 20 * 60))
          until npm install --prefer-online --ignore-scripts --no-audit --no-fund \
            --fetch-retries=0 --fetch-timeout=15000 "@railgrid/actions-node@$version"; do
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for @railgrid/actions-node@$version on public npm" >&2
              exit 1
            fi
            sleep 15
          done
          node --input-type=module --eval "import { createActionsClient } from '@railgrid/actions-node'; if (typeof createActionsClient !== 'function') process.exit(1)"
