        base: *id002
        commit: *id003
        title: &id004
          type: string
          minLength: 1
          maxLength: 256
        body: &id005
          type: string
          maxLength: 32768
        repository:
          type: string
          minLength: 3
          maxLength: 201
      additionalProperties: false
    outputSchema:
