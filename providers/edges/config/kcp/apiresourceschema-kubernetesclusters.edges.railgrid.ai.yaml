apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260926-76b9080b.kubernetesclusters.edges.railgrid.ai
spec:
  group: edges.railgrid.ai
  names:
    kind: KubernetesCluster
    listKind: KubernetesClusterList
    plural: kubernetesclusters
    shortNames:
    - kc
    singular: kubernetescluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.connected
      name: Connected
      type: boolean
    - jsonPath: .status.lastHeartbeatTime
      name: Last Heartbeat
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.agentVersion
      name: Agent Version
      priority: 1
      type: string
    name: v1alpha1
    schema:
      description: "KubernetesCluster is a managed Kubernetes cluster reachable through
        the hub\nvia an outbound reverse tunnel from its agent.\n\nAgents register
        via the provider's agent-ingress endpoint:\n\n\t/services/providers/edges/agent/{cluster}/apis/edges.railgrid.ai/v1alpha1/kubernetesclusters/{name}/proxy\n\nUsers
        access it via the k8s subresource:\n\n\t/services/providers/edges/edgeproxy/clusters/{cluster}/apis/edges.railgrid.ai/v1alpha1/kubernetesclusters/{name}/k8s"
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: KubernetesClusterSpec defines the desired state of a KubernetesCluster.
          properties:
            labels:
              additionalProperties:
                type: string
              description: Labels for scheduling hints (region, provider, etc.)
              type: object
          type: object
        status:
          description: KubernetesClusterStatus defines the observed state of a KubernetesCluster.
          properties:
            URL:
              description: URL is the proxy URL path for accessing this resource via
                the hub.
              type: string
            agentVersion:
              description: AgentVersion is the version of the railgrid binary on the
                agent.
              type: string
            conditions:
              description: Conditions represent the latest observations of state.
              items:
                description: Condition contains details for one aspect of the current
                  state of this API Resource.
                properties:
                  lastTransitionTime:
                    description: |-
                      lastTransitionTime is the last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      message is a human readable message indicating details about the transition.
                      This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: |-
                      observedGeneration represents the .metadata.generation that the condition was set based upon.
                      For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                      with respect to the current state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: |-
                      reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      Producers of specific condition types may define expected values and meanings for this field,
                      and whether the values are considered a guaranteed API.
                      The value should be a CamelCase string.
                      This field may not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
            connected:
              description: Connected indicates whether the agent currently has an
                active tunnel.
              type: boolean
            harnesses:
              description: |-
                Harnesses are the coding harnesses this machine knows about, reported on
                every heartbeat. It answers "which of my edges can run Claude Code" from
                the edge itself, before anyone reads a Service, and it distinguishes a
                harness that is installed but switched off from one that is not there.
                Empty means the agent found none and none were asked for.
              items:
                description: |-
                  HarnessStatus is one coding harness as the agent on the machine sees it.

                  Detected and Enabled are separate facts on purpose. Detected says the
                  executable is installed; Enabled says spec.harness asks for it. A harness
                  that is detected but not enabled is the opt-out working; one that is enabled
                  but not detected is a machine that needs the binary installed, and saying so
                  is more useful than dropping it from the list.
                properties:
                  detected:
                    description: Detected reports whether the executable was found
                      on the machine.
                    type: boolean
                  enabled:
                    description: Enabled reports whether spec.harness asks for this
                      harness.
                    type: boolean
                  name:
                    description: 'Name is the harness: "claude" or "codex".'
                    type: string
                  port:
                    description: Port is the loopback port the runner for this harness
                      listens on.
                    format: int32
                    type: integer
                  ready:
                    description: |-
                      Ready reports whether the supervised runner answers runner/v1 with this
                      harness ready. False while it is starting, and false for a harness that
                      is not enabled.
                    type: boolean
                  reasons:
                    description: Reasons say why Ready is false.
                    items:
                      type: string
                    type: array
                  version:
                    description: Version is the harness executable's version, when
                      known.
                    type: string
                required:
                - detected
                - enabled
                - name
                - ready
                type: object
              type: array
            hostname:
              description: Hostname is the hostname reported by the connected agent.
              type: string
            joinToken:
              description: JoinToken is a bootstrap token for agent registration;
                cleared on register.
              type: string
            labels:
              additionalProperties:
                type: string
              description: Labels are propagated from the agent.
              type: object
            lastHeartbeatTime:
              description: |-
                LastHeartbeatTime is when the agent's tunnel was last known alive: the
                hub's lifecycle reconciler copies the tunnel registry Lease's renewTime
                here while the edge is connected (the agent's own heartbeat also stamps
                it when it can reach the API).
              format: date-time
              type: string
            phase:
              description: Phase describes the current lifecycle phase.
              type: string
            workspacePath:
              description: WorkspacePath is the kcp workspace path this resource lives
                in.
              type: string
          required:
          - connected
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
