<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railgrid Portal</title>
    <!-- Give the browser's native web-content surface a light-safe color
         before the renderer submits its first frame. The bootstrap immediately
         narrows this to the resolved Railgrid theme in the same parser task. -->
    <meta id="railgrid-color-scheme" name="color-scheme" content="light dark" />
    <!-- Static, not inline: the portal CSP has no 'unsafe-inline' for
         scripts (pkg/hub/portal_security.go). Synchronous so it still runs
         before the first frame; the body lives in public/theme-bootstrap.js. -->
    <script id="railgrid-theme-bootstrap" src="/theme-bootstrap.js"></script>
  </head>
  <body class="bg-surface text-text-primary antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
