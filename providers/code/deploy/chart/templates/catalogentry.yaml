            head: *id002
            base: *id002
            commit: *id003
            title: *id004
            body: *id005
            number: *id006
            repository:
              type: string
              minLength: 3
              maxLength: 201
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        schemaDigest: sha256:dffee173b2762eb26cf59ef05d066e850bb3a3553172cf96371b6e8a62bbb88e
        executionMode: sync
        readOnly: false
        risk: medium
        idempotency: inherent
        limits:
          timeoutSeconds: 180
          maxInputBytes: 65536
          maxOutputBytes: 524288
          maxResultItems: 50
        consent:
          required: false
      - id: feedback/v1
