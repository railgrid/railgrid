## railgrid-infrastructure-provider values
## See README.md and docs/credentials.md for the credential conventions
## the central kro RGD templates expect.

# Container image. Build with: docker build -t IMAGE providers/infrastructure/
image:
  repository: ghcr.io/railgrid/railgrid-infrastructure-provider
  tag: ""  # empty → defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Number of Deployment replicas. The provider is stateless apart from
# the in-process per-tenant client cache (sync.Map, ~256 entries cap),
# so >1 replica is safe.
replicaCount: 2

service:
  type: ClusterIP
  port: 8081

# Hub the provider POSTs heartbeats to. Must be reachable from the
# provider pod (in-cluster Service DNS works).
hub:
  url: https://railgrid-hub.railgrid.svc.cluster.local:9443
  # Bearer token used in the heartbeat POST. Provided as a Secret
  # because it MUST NOT land in values.yaml in plaintext for prod.
  # Empty (the default) omits the Authorization header entirely — the
  # heartbeat endpoint does not require it. Set the name ONLY when the
  # Secret already exists in the release namespace: the reference is not
  # optional, so a missing Secret leaves the pod in
  # CreateContainerConfigError forever.
  tokenSecretRef:
    name: ""
    key: token
  # Skip TLS verification on heartbeat — dev only, defaults off.
  insecure: false

# Central kro cluster kubeconfig.
# Two ways to provide it:
#   1. Inline `centralKro.kubeconfig` (rendered into a Secret by the
#      chart; convenient for dev, NOT recommended for prod).
#   2. `centralKro.kubeconfigSecretRef` pointing at an existing Secret
#      this chart did NOT create. Use this in prod.
centralKro:
  kubeconfig: ""
  kubeconfigSecretRef:
    name: ""   # set to use an external Secret
    key: kubeconfig

# The "application" template (3-tier app exposed on an OIDC-guarded URL).
# The Application instance controller is OFF unless baseDomain is set AND a
# central kro kubeconfig is configured (the controller bridges secrets onto
# that runtime cluster). See docs/application-template-architecture.md.
application:
  # Zone apps are served under, e.g. "apps.example.com". Each app gets
  # <prefix|name>-<tenantHash>.<baseDomain>. Empty → feature disabled.
  # TLS: below the Cloudflare zone apex, Universal SSL does not cover app
  # hosts — add a *.<baseDomain> edge cert (ACM / Total TLS) or new URLs fail
  # TLS for minutes. See docs/application-template-architecture.md.
  baseDomain: ""
  # Gateway API parent the generated Application HTTPRoutes attach to
  # (substituted into Application RGDs as ${railgrid.gatewayName} /
  # ${railgrid.gatewayNamespace}). Defaults to the cfgate Cloudflare Tunnel
  # Gateway in-binary; override to point apps at a different Gateway without
  # touching the template.
  gateway:
    name: "cloudflare-tunnel"
    namespace: "cfgate-system"

# Platform-owned access-gate configuration shared by simple-webapp,
# application, and future publishable templates. Templates render the gate
# (railgrid-access-proxy) as a component of their own graph via the
# ${railgrid.accessProxyImage}/${railgrid.hubUrl}/${railgrid.hubPublicUrl} tokens; all
# app traffic enters through it in every mode. Public apps never contact the
# hub; private apps use the hub sign-in flow once per visitor session.
publishing:
  # App host zone (wins over application.baseDomain). TLS: below the
  # Cloudflare zone apex, Universal SSL does not cover app hosts — add a
  # *.<baseDomain> edge cert (ACM / Total TLS) or new URLs fail TLS for
  # minutes. See docs/application-template-architecture.md.
  baseDomain: ""
  accessProxyImage: ghcr.io/railgrid/railgrid-access-proxy:latest
  # Internal hub address used for the app-access protocol. Empty falls back to
  # hub.url. In production, use a trusted cluster CA and keep insecure=false.
  hubURL: ""
  # Browser-reachable hub origin used for authorization redirects. Empty
  # defaults to hubURL; set it when the provider uses an in-cluster hub URL.
  hubPublicURL: ""
  insecure: false
  publicScheme: https
  # Optional externally visible port, e.g. 10443 for a local Gateway.
  publicPort: 0
  gateway:
    name: "cloudflare-tunnel"
    namespace: "cfgate-system"

# Default container resource policy stamped into every tenant namespace as a
# LimitRange named "railgrid-defaults" (defaultRequest 50m/128Mi, default limit
# 500m/512Mi, max 2cpu/2Gi per container). Create-only — operators may
# hand-tune a tenant's copy without it being overwritten. Disable when the
# runtime cluster manages its own resource policy.
tenantLimitRange:
  enabled: true

# Ingress NetworkPolicy "railgrid-tenant-isolation" in every tenant runtime
# namespace ("<clusterID>-<namespace>"). Without it the runtime cluster is flat:
# a pod in one workspace can dial another workspace's Services directly
# (private apps behind their access gate, Postgres, Redis, browsers). The
# policy admits only pods in the same namespace, the same workspace's other
# runtime namespaces, the exposure Gateway's namespace
# (publishing.gateway.namespace), and the extra sources below. Egress is not
# restricted. Disabling it again removes the policies the provider created.
# Requires a CNI that enforces NetworkPolicy.
tenantNetworkPolicy:
  enabled: false
  # Extra namespaces whose pods may reach tenant pods: a Gateway implementation
  # that runs its proxies outside the Gateway's namespace, kube-system when the
  # apiserver reaches pods through konnectivity-agent, a monitoring stack.
  allowedNamespaces: []
  # Extra ipBlock sources, in canonical form (10.0.0.0/16, not 10.0.0.1/16).
  # The development data plane (railgrid sandbox sync/exec/logs/restart, the
  # browser template's proxy) reaches pods through the runtime kube-apiserver's
  # services/proxy. When the apiserver is not on the pod's node (managed
  # control planes, dedicated control-plane nodes), add the address range its
  # traffic arrives from, or those calls time out.
  allowedCIDRs: []

# Development-mode images (docs/app-studio-template-sandboxes.md). These run
# TENANT code, so production deployments should pin them by digest. Empty
# values fall back to the in-binary defaults (node → docker.io/library/node:22-bookworm,
# universal → ghcr.io/railgrid/railgrid-universal-dev:latest,
# agent → see agentImage below). When codingSandbox.enabled
# is true, both universal and agentImage must be immutable digest references.
development:
  # The injector image carrying the static railgrid-dev-agent binary
  # (RAILGRID_DEV_AGENT_IMAGE). Set it to pin a digest. Empty → the dev agent of
  # THIS release: a released chart (appVersion vX.Y.Z) renders
  # <agentImageRepository>:vX.Y.Z (published by the same provider release);
  # the unreleased in-repo chart omits the env var and the binary picks its
  # own release tag, or :latest for local builds (kind/Tilt side-load it).
  # The injector pulls IfNotPresent, so never point this at a mutable tag
  # like :latest in production — nodes keep the copy they cached first.
  #
  # Existing dev sandboxes pick up a new agent automatically once this
  # resolved reference CHANGES (a chart upgrade to a new appVersion, or a new
  # tag/digest here): the provider restarts with the new env, re-applies
  # every Template's kro RGD with the new image, and kro re-reconciles all
  # instances, which re-rolls each dev Deployment (Recreate; the workspace PVC
  # is kept). If the reference string does not change (e.g. an explicit
  # :latest), nothing re-renders — deleting dev pods is not enough either,
  # since a node with the stale image cached reuses it; change the reference.
  agentImage: ""
  # Repository the release-versioned default above is built from.
  agentImageRepository: ghcr.io/railgrid/railgrid-dev-agent
  # Public ES256 JSON Web Key Set used by the injected preview bridge
  # to verify short-lived capabilities issued by App Studio. Configure the
  # current key and, during rotation, the previous key. Never put a private
  # signing key here. Empty disables the optional bridge without preventing
  # development applications from starting.
  previewBridge:
    verificationJWKS: ""
  # Toolchain image per ${railgrid.devImage.<toolchain>} token — each key K maps
  # to RAILGRID_DEV_IMAGE_<K>. A template referencing an unconfigured toolchain
  # (other than node) fails setup with a pointer to the missing env var.
  images:
    node: ""
    # Universal coding sandbox image. Set this to an immutable digest in
    # production; the platform-owned universal-coding-sandbox Template uses
    # ${railgrid.devImage.universal} and tenants cannot select this image.
    universal: ""
    # python: "docker.io/library/python:3.12-slim"
    # go: "docker.io/library/golang:1.26"

# Platform-owned universal coding sandbox. Disabled by default (including the
# hosted chart). BYO/self-hosted installs opt in explicitly and must pin both
# the universal and dev-agent images by digest; the chart fails rendering when
# either opt-in image is mutable or absent.
codingSandbox:
  enabled: false

# Runtime isolation for every development-mode pod the provider synthesizes
# (App Studio dev instances and the universal coding sandbox). Those pods run
# TENANT code under a PSS-restricted profile (non-root, seccomp
# RuntimeDefault, all capabilities dropped) but still share the host kernel,
# which is not a complete untrusted-code sandbox.
sandbox:
  # RuntimeClass name stamped as spec.runtimeClassName on each development
  # pod (RAILGRID_SANDBOX_RUNTIME_CLASS_NAME). Expected values are the name of a
  # RuntimeClass installed on the runtime cluster: "gvisor" (gVisor/runsc) or
  # "kata" (Kata Containers). Empty keeps the cluster default runtime, which
  # is acceptable only for trusted users. Enabling one of these is REQUIRED
  # before exposing App Studio to untrusted users; installing the runtime and
  # its RuntimeClass on the nodes is cluster-dependent and outside this chart.
  runtimeClassName: ""

# Container images are NOT configured here. Templates declare them as schema
# fields with sane defaults (e.g. the database template's spec.version defaults
# to "16") — the same convention every template follows.
# See providers/infrastructure/docs/template-conventions.md. Override per instance, or edit the
# template default, to pin a digest.

# Secret the provider mounts read-only at
# /var/run/secrets/railgrid/railgrid-provider-kubeconfig to reach kcp. How it is
# populated depends on bootstrap.enabled:
#   - bootstrap.enabled=false (hub-provisioned): the hub catalog controller
#     mints it (pkg/hub/providers/provision.go) when the CatalogEntry is
#     reconciled; the serve volume mounts it as `optional` until it appears.
#   - bootstrap.enabled=true (self-bootstrap): IGNORED — the serve container
#     reuses the same kcp admin kubeconfig the init container used, so there
#     is no separately-minted runtime Secret.
providerKubeconfig:
  secretName: railgrid-provider-kubeconfig

# Self-bootstrap via an init container. When enabled, an init container runs
# `infrastructure init` BEFORE the serve container: it installs the CRDs,
# CachedResource, and APIExport into the provider workspace. Both containers
# share ONE kubeconfig (no separately-minted runtime token).
bootstrap:
  enabled: false

  # Where the shared kubeconfig comes from:
  #   hubMinted  - (default) the hub-delivered railgrid-provider-kubeconfig
  #                (providerKubeconfig.secretName). A platform admin applies the
  #                CatalogEntry; the hub creates the provider workspace, mints a
  #                cluster-admin-in-workspace kubeconfig, and writes it as that
  #                Secret (requires the hub to run with --kubeconfig so its
  #                HostSecretWriter can write into this cluster). The init
  #                container's mount is non-optional, so the pod simply waits in
  #                ContainerCreating until the hub delivers it — no `kubectl ws
  #                create`, no separate admin kubeconfig.
  #   supplied   - you provide a kcp kubeconfig directly (no hub needed). Use
  #                this for a fully standalone install.
  kubeconfigSource: hubMinted

  # Only used when kubeconfigSource=supplied.
  # kcp workspace the provider is installed into (init retargets the supplied
  # kubeconfig at this path; the workspace must already exist).
  workspacePath: "root:railgrid:providers:infrastructure"
  # Provide exactly ONE of:
  #   kcpKubeconfig          - inline content, rendered into a Secret by the
  #                            chart (convenient for dev; avoid for prod).
  #   kcpKubeconfigSecretRef - reference to an existing Secret you manage.
  kcpKubeconfig: ""
  kcpKubeconfigSecretRef:
    name: ""
    key: kubeconfig

# When true, the chart renders the CatalogEntry (which registers the provider
# with the hub) into a ConfigMap that the init container applies into the
# provider workspace via the provider kubeconfig. The CatalogEntry is a kcp
# resource, so it is NOT applied to the hosting cluster this chart installs into.
# Set to false to manage the CatalogEntry separately (e.g. GitOps with a
# different rollout cadence).
catalogEntry:
  enabled: true

serviceAccount:
  create: true
  name: ""   # empty → release-name

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Optional pod-level overrides.
podLabels: {}
# Prometheus metrics. The process serves /metrics (controller-runtime reconcile,
# workqueue and client-go request metrics, Go runtime) on a separate plain-HTTP
# listener, never the serving port, and the pod carries prometheus.io/* and
# k8s.grafana.com/* scrape annotations so an annotation-driven collector picks
# it up without operator CRDs. enabled: false drops the listener and the
# annotations.
metrics:
  enabled: true
  port: 9090

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# CRD-driven operator mode. When enabled, the chart installs the operator
# (a controller-manager running `infrastructure-provider controller`), the
# InfrastructureProvider CRD, RBAC, the two kubeconfig Secrets, and one CR
# rendered from the values below. The operator then reconciles that CR:
# bootstraps the provider kcp workspace, lifecycles the kro Helm release via the
# helm CLI (image/version below), and owns the provider serve Deployment
# (image/version below). This supersedes the bootstrap.* init-container flow.
operator:
  enabled: false

  # Also bind the operator ServiceAccount to cluster-admin, and have it bind the
  # serve ServiceAccount to cluster-admin as well (in-cluster runtime). Off, the
  # chart's two enumerated ClusterRoles (<release>-operator, <release>-serve in
  # templates/operator.yaml) cover the kro 0.9.x chart, the serve rollout, and
  # everything serve does on the runtime cluster. Turn it on only when
  # something needs kinds outside that set: a kro chart version or
  # operator.kro.extraValues that renders new kinds (ServiceMonitor, a
  # fullnameOverride that renames kro's ClusterRole), or a Template whose
  # instance kind lives outside kro.run / infrastructure.railgrid.ai. A forbidden
  # error in the InfrastructureProvider conditions names the missing rule.
  clusterAdmin: false

  # Operator (controller) image. Defaults to the provider image above.
  image:
    repository: ""
    tag: ""

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # kcp workspace the provider is bootstrapped into. Leave empty when the
  # provider kubeconfig is already scoped to the provider workspace (the operator
  # discovers the path from the workspace's kcp.io/path annotation). Set it only
  # for a root-scoped (admin) kubeconfig that must be retargeted at a workspace.
  providerWorkspace: ""

  # Provider (kcp) kubeconfig. Either set it inline via
  #   --set-file operator.providerKubeconfig=./provider-infrastructure.kubeconfig
  # (rendered into a Secret), OR reference an existing Secret by name and leave
  # the inline value empty.
  providerKubeconfig: ""
  providerKubeconfigSecret:
    name: ""        # empty → chart-rendered "<release>-provider-kubeconfig"
    key: kubeconfig

  # Runtime-cluster kubeconfig (where kro + the provider serve Deployment run).
  runtimeKubeconfig: ""
  runtimeKubeconfigSecret:
    name: ""        # empty → chart-rendered "<release>-runtime-kubeconfig"
    key: kubeconfig

  # kro Helm release the operator lifecycles on the runtime cluster.
  # Upstream kro, single-cluster: the provider's instance controller bridges
  # kcp → runtime, so kro never talks to kcp and the retired
  # railgrid/kro-multicluster fork is no longer used.
  kro:
    chart: oci://registry.k8s.io/kro/charts/kro
    version: 0.9.3
    namespace: kro-system
    releaseName: kro
    image:
      repository: ""   # empty → chart default (registry.k8s.io/kro/kro)
      tag: ""          # empty → chart appVersion
    extraValues: {}

  # Provider serve Deployment the operator owns on the runtime cluster.
  provider:
    image:
      repository: ""   # empty → chart image.repository
      tag: ""          # empty → chart image.tag / appVersion
    replicas: 2
    port: 8081

  # Application-template exposure layer (the `application` template's public URL
  # + Gateway API parent). This is the operator-mode equivalent of the top-level
  # `application.*` values: the operator owns the serve Deployment, so these land
  # on the InfrastructureProvider CR (RAILGRID_APP_BASE_DOMAIN / RAILGRID_GATEWAY_NAME /
  # RAILGRID_GATEWAY_NAMESPACE) rather than via the chart's deployment.yaml. See
  # docs/application-template-architecture.md.
  application:
    # DNS zone apps are served under, e.g. "apps.example.com". REQUIRED to enable
    # app exposure — the Application instance controller stays disabled until this
    # is set. Empty → feature off. TLS: below the Cloudflare zone apex, add a
    # *.<baseDomain> edge cert (ACM / Total TLS) — see the top-level note.
    baseDomain: ""
    # Gateway API parent the generated HTTPRoutes attach to. Empty fields →
    # "cloudflare-tunnel" / "cfgate-system" (the in-binary defaults).
    gateway:
      name: ""
      namespace: ""

  publishing:
    # App host zone (wins over operator.application.baseDomain). TLS: below the
    # Cloudflare zone apex, add a *.<baseDomain> edge cert (ACM / Total TLS).
    baseDomain: ""
    accessProxyImage: ghcr.io/railgrid/railgrid-access-proxy:latest
    hubURL: ""
    hubPublicURL: ""
    insecure: false
    publicScheme: https
    publicPort: 0
    gateway:
      name: ""
      namespace: ""
