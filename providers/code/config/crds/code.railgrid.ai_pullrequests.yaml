---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: pullrequests.code.railgrid.ai
spec:
  group: code.railgrid.ai
  names:
    categories:
    - railgrid
    kind: PullRequest
    listKind: PullRequestList
    plural: pullrequests
    shortNames:
    - gpr
    singular: pullrequest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repositoryRef
      name: Repository
      type: string
    - jsonPath: .status.number
      name: Number
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.head
      name: Head
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PullRequest is one pull request on a managed Repository, as a resource:
          what the forge should show (spec) and what it does show (status).

          A coordinator such as Factory states intent — the branch, the base, the
          public title and body, and the exact commit the branch should be at, as a
          verified snapshot it staged — and Code makes the forge agree: it advances
          the branch under an expected-head lease, opens the pull request once, and
          keeps the status current with what the forge reports: the head, the state,
          the merge, and the review conversation. Nothing on the forge is read by
          anyone else; this object is the fact.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PullRequestSpec is what the forge should show.
            properties:
              attachmentRef:
                description: |-
                  AttachmentRef is the staged snapshot containing screenshot bytes. It may
                  equal desiredHead.bundleRef. Empty means the description has no attachments.
                pattern: ^[a-f0-9]{64}$
                type: string
              base:
                description: Base is the branch the pull request merges into.
                maxLength: 255
                minLength: 1
                type: string
              body:
                maxLength: 16384
                type: string
              branch:
                description: |-
                  Branch is the head branch, owned by this pull request: Code moves it to
                  DesiredHead and never anywhere else.
                maxLength: 255
                minLength: 1
                type: string
              desiredHead:
                description: |-
                  DesiredHead is the commit the head branch should be at: a verified
                  snapshot the coordinator staged with the stage-snapshot verb. Code
                  advances the branch to it from the head it last observed, so a branch
                  that moved under the coordinator is never overwritten. Absent until the
                  first result exists; then every revision is a new value here.
                properties:
                  baseCommit:
                    description: 'BaseCommit is the snapshot''s sole parent: the head
                      it was made from.'
                    pattern: ^[a-f0-9]{40}$
                    type: string
                  bundleRef:
                    description: BundleRef names the staged bundle (the stage-snapshot
                      verb's answer).
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  commit:
                    description: Commit is the snapshot commit the branch should point
                      at.
                    pattern: ^[a-f0-9]{40}$
                    type: string
                  message:
                    description: Message is the one-line subject the snapshot commit
                      must carry.
                    maxLength: 200
                    type: string
                  tree:
                    description: Tree is the snapshot's tree, verified against the
                      bundle.
                    pattern: ^[a-f0-9]{40}$
                    type: string
                required:
                - baseCommit
                - bundleRef
                - commit
                - tree
                type: object
              draft:
                description: |-
                  Draft creates a new pull request as a draft. Unset preserves the historic
                  ready-for-review creation behavior.
                type: boolean
              number:
                description: |-
                  Number adopts an existing pull request after validating its repository,
                  head branch and base. Once status.number is recorded it must remain equal.
                minimum: 1
                type: integer
              observeInterval:
                description: |-
                  ObserveInterval is how often Code re-reads an open pull request from
                  the forge: its head, state, reviews and comments. The coordinator sets
                  it per line, because forges and review flows differ in how fast they
                  move and how much of a rate budget each read costs. Unset means five
                  minutes; values under thirty seconds are raised to thirty seconds.
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
              publication:
                description: |-
                  Publication opts into the durable immutable publication contract. It is
                  mutually exclusive with desiredHead; legacy callers keep their existing
                  behavior when this field is absent.
                properties:
                  cancel:
                    description: |-
                      Cancel fences an intent that has not yet been accepted. Once accepted,
                      publication may finish and its result remains visible.
                    type: boolean
                  candidate:
                    description: Candidate is the exact verified snapshot commit to
                      publish.
                    properties:
                      baseCommit:
                        description: 'BaseCommit is the snapshot''s sole parent: the
                          head it was made from.'
                        pattern: ^[a-f0-9]{40}$
                        type: string
                      bundleRef:
                        description: BundleRef names the staged bundle (the stage-snapshot
                          verb's answer).
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      commit:
                        description: Commit is the snapshot commit the branch should
                          point at.
                        pattern: ^[a-f0-9]{40}$
                        type: string
                      message:
                        description: Message is the one-line subject the snapshot
                          commit must carry.
                        maxLength: 200
                        type: string
                      tree:
                        description: Tree is the snapshot's tree, verified against
                          the bundle.
                        pattern: ^[a-f0-9]{40}$
                        type: string
                    required:
                    - baseCommit
                    - bundleRef
                    - commit
                    - tree
                    type: object
                  expectedAbsent:
                    description: ExpectedAbsent explicitly authorizes creating a branch
                      that does not exist.
                    type: boolean
                  expectedHead:
                    description: ExpectedHead is the exact branch head the caller
                      authorized replacing.
                    pattern: ^[a-f0-9]{40}$
                    type: string
                  operationID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  sequence:
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - candidate
                - operationID
                - sequence
                type: object
                x-kubernetes-validations:
                - message: set exactly one of expectedHead or expectedAbsent
                  rule: (has(self.expectedAbsent) && self.expectedAbsent) != has(self.expectedHead)
                - message: publication sequence cannot decrease
                  rule: self.sequence >= oldSelf.sequence
                - message: publication identity and candidate are immutable within
                    a sequence
                  rule: self.sequence != oldSelf.sequence || (self.operationID ==
                    oldSelf.operationID && has(self.expectedAbsent) == has(oldSelf.expectedAbsent)
                    && (!has(self.expectedAbsent) || self.expectedAbsent == oldSelf.expectedAbsent)
                    && has(self.expectedHead) == has(oldSelf.expectedHead) && (!has(self.expectedHead)
                    || self.expectedHead == oldSelf.expectedHead) && self.candidate
                    == oldSelf.candidate)
                - message: publication cancellation cannot be cleared
                  rule: self.sequence != oldSelf.sequence || !has(oldSelf.cancel)
                    || !oldSelf.cancel || (has(self.cancel) && self.cancel)
              repositoryRef:
                description: |-
                  RepositoryRef names the Repository (same workspace) the pull request
                  belongs to.
                maxLength: 253
                minLength: 1
                type: string
              title:
                description: |-
                  Title and Body are the pull request's public text. They are the
                  coordinator's words, written to the forge as given.
                maxLength: 256
                minLength: 1
                type: string
            required:
            - base
            - branch
            - repositoryRef
            - title
            type: object
            x-kubernetes-validations:
            - message: publication and desiredHead are mutually exclusive
              rule: '!has(self.publication) || !has(self.desiredHead)'
            - message: publication cannot be cleared after opting in
              rule: '!has(oldSelf.publication) || has(self.publication)'
          status:
            description: PullRequestStatus is what the forge shows.
            properties:
              attachmentRepositoryUID:
                description: AttachmentRepositoryUID binds upload receipts to their
                  destination repository.
                type: string
              baseCurrent:
                type: boolean
              baseCurrentError:
                description: |-
                  BaseCurrentError distinguishes unavailable ancestry observations from a
                  confirmed false result.
                maxLength: 1024
                type: string
              baseHead:
                description: |-
                  BaseHead and BaseCurrent describe the base branch commit and whether it
                  is an ancestor of the current PR head. Nil means the forge could not say.
                type: string
              checks:
                description: Checks are observations for ChecksHead only. Empty checks
                  do not mean pass.
                items:
                  description: PullRequestCheck is one forge check run, tied to its
                    exact head commit.
                  properties:
                    appID:
                      format: int64
                      type: integer
                    conclusion:
                      type: string
                    detailsURL:
                      type: string
                    head:
                      type: string
                    id:
                      format: int64
                      type: integer
                    name:
                      type: string
                    status:
                      description: |-
                        State preserves the forge's status and conclusion, including queued,
                        in-progress, skipped, cancelled and action-required outcomes.
                      type: string
                  required:
                  - head
                  - id
                  - name
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              checksError:
                description: ChecksError records an unavailable or incomplete check
                  observation.
                maxLength: 1024
                type: string
              checksHead:
                description: ChecksHead pins the check snapshot to the exact commit
                  queried.
                type: string
              checksObservedAt:
                description: ChecksObservedAt is when that snapshot was read successfully.
                format: date-time
                type: string
              checksTruncated:
                description: ChecksTruncated reports that more check runs existed
                  than are carried here.
                type: boolean
              commentOperations:
                description: CommentOperations are durable caller-keyed upsert receipts.
                items:
                  description: PullRequestCommentOperation is an idempotency receipt
                    for a managed comment.
                  properties:
                    commentID:
                      format: int64
                      type: integer
                    key:
                      maxLength: 128
                      type: string
                    payloadFingerprint:
                      pattern: ^[a-f0-9]{64}$
                      type: string
                    phase:
                      enum:
                      - Accepted
                      - Complete
                      type: string
                    updatedAt:
                      format: date-time
                      type: string
                  required:
                  - key
                  - payloadFingerprint
                  - phase
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              comments:
                description: |-
                  Comments are the conversation comments, oldest first; bounded to the
                  newest 128. CommentsTruncated says the conversation is longer.
                items:
                  description: PullRequestComment is one conversation comment, as
                    the forge reports it.
                  properties:
                    author:
                      type: string
                    authorType:
                      type: string
                    body:
                      maxLength: 8192
                      type: string
                    id:
                      format: int64
                      type: integer
                    updatedAt:
                      format: date-time
                      type: string
                    url:
                      type: string
                  required:
                  - author
                  - id
                  type: object
                maxItems: 128
                type: array
              commentsTruncated:
                type: boolean
              conditions:
                description: 'Conditions: Ready (the forge agrees with the spec) and
                  HeadApplied.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              draft:
                description: Draft is the forge's observed draft state.
                type: boolean
              head:
                description: Head is the commit the head branch is at, as last observed.
                type: string
              lastObserved:
                description: LastObserved is when the forge was last read successfully.
                format: date-time
                type: string
              mergeCommit:
                type: string
              mergeableState:
                description: |-
                  MergeableState is the forge's mergeability observation (including
                  unknown/dirty/blocked states); it is never interpreted as CI success.
                type: string
              merged:
                type: boolean
              mergedAt:
                format: date-time
                type: string
              merger:
                type: string
              mergerType:
                type: string
              number:
                description: Number and URL identify the pull request on the forge
                  once opened.
                type: integer
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: PullRequestPhase is the pull request's coarse lifecycle.
                enum:
                - Pending
                - Open
                - Merged
                - Closed
                - Failed
                type: string
              publication:
                description: |-
                  Publication is the latest durable receipt for spec.publication. Its
                  Published phase means the desired branch commit was confirmed; PR opening
                  remains separately observed by number/state and uses find-before-create.
                properties:
                  acceptedAt:
                    format: date-time
                    type: string
                  base:
                    type: string
                  branch:
                    type: string
                  candidate:
                    description: PullRequestHead identifies one staged, verified snapshot
                      commit.
                    properties:
                      baseCommit:
                        description: 'BaseCommit is the snapshot''s sole parent: the
                          head it was made from.'
                        pattern: ^[a-f0-9]{40}$
                        type: string
                      bundleRef:
                        description: BundleRef names the staged bundle (the stage-snapshot
                          verb's answer).
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      commit:
                        description: Commit is the snapshot commit the branch should
                          point at.
                        pattern: ^[a-f0-9]{40}$
                        type: string
                      message:
                        description: Message is the one-line subject the snapshot
                          commit must carry.
                        maxLength: 200
                        type: string
                      tree:
                        description: Tree is the snapshot's tree, verified against
                          the bundle.
                        pattern: ^[a-f0-9]{40}$
                        type: string
                    required:
                    - baseCommit
                    - bundleRef
                    - commit
                    - tree
                    type: object
                  connectionUID:
                    type: string
                  expectedAbsent:
                    type: boolean
                  expectedHead:
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  message:
                    type: string
                  observedHead:
                    type: string
                  operationID:
                    type: string
                  parentUID:
                    description: |-
                      ParentUID prevents a recreated PullRequest with the same name from
                      inheriting an earlier operation receipt.
                    type: string
                  phase:
                    enum:
                    - Accepted
                    - Published
                    - Cancelled
                    - Failed
                    type: string
                  repositoryUID:
                    type: string
                  sequence:
                    format: int64
                    type: integer
                required:
                - base
                - branch
                - candidate
                - connectionUID
                - operationID
                - parentUID
                - phase
                - repositoryUID
                - sequence
                type: object
              publishedTextDigest:
                description: PublishedTextDigest records the last successfully applied
                  title/body input.
                type: string
              reviewOperations:
                description: ReviewOperations are durable idempotency receipts for
                  review submissions.
                items:
                  description: |-
                    PullRequestReviewOperation records one caller-keyed review attempt so a
                    retry can recover a response lost after the forge accepted it.
                  properties:
                    expectedHead:
                      pattern: ^[a-f0-9]{40}$
                      type: string
                    key:
                      maxLength: 128
                      type: string
                    payloadFingerprint:
                      description: PayloadFingerprint prevents reusing a key for different
                        review contents.
                      pattern: ^[a-f0-9]{64}$
                      type: string
                    phase:
                      enum:
                      - Accepted
                      - Complete
                      type: string
                    reviewID:
                      format: int64
                      type: integer
                    updatedAt:
                      format: date-time
                      type: string
                  required:
                  - expectedHead
                  - key
                  - payloadFingerprint
                  - phase
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              reviews:
                description: |-
                  Reviews are the reviews submitted against the current head, newest
                  last; bounded to the newest 64.
                items:
                  description: PullRequestReview is one submitted review, as the forge
                    reports it.
                  properties:
                    author:
                      type: string
                    authorType:
                      description: |-
                        AuthorType is the forge's actor type: "User" for a person, "Bot" for
                        an app. A coordinator acts only on what people wrote.
                      type: string
                    body:
                      description: |-
                        Body is the review's text, bounded. It is what a person wrote and is
                        carried as data, never as an instruction.
                      maxLength: 8192
                      type: string
                    commit:
                      description: Commit is the head the review was submitted against.
                      type: string
                    id:
                      format: int64
                      type: integer
                    state:
                      description: 'State is the review''s verdict: APPROVED, CHANGES_REQUESTED
                        or COMMENTED.'
                      type: string
                    submittedAt:
                      format: date-time
                      type: string
                  required:
                  - author
                  - id
                  type: object
                maxItems: 64
                type: array
              state:
                description: State is the forge's own state word (open, closed).
                type: string
              uploadedAttachments:
                description: UploadedAttachments lets retries reuse successful uploads
                  for this revision.
                items:
                  description: PublishedAttachment records an upload that reconciliation
                    can reuse.
                  properties:
                    digest:
                      pattern: ^[a-f0-9]{64}$
                      type: string
                    path:
                      maxLength: 512
                      type: string
                    url:
                      maxLength: 2048
                      type: string
                  required:
                  - digest
                  - path
                  - url
                  type: object
                maxItems: 8
                type: array
              url:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
