apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260925-98850485.greetings.quickstart.providers.railgrid.ai
spec:
  group: quickstart.providers.railgrid.ai
  names:
    categories:
    - railgrid
    kind: Greeting
    listKind: GreetingList
    plural: greetings
    shortNames:
    - greet
    singular: greeting
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.message
      name: Message
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.observedAt
      name: ObservedAt
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      description: |-
        Greeting is the quickstart provider's one kind: a message a tenant wants
        greeted back. It exists to be the smallest thing that is still a real API —
        a tenant writes spec.message, the provider's reconciler observes it and
        stamps status, and the data-plane verb POST .../greetings/{name}/greet
        renders it for a caller.

        Cluster-scoped, like every other data-plane-addressed provider kind in the
        tree. That is not a style choice: a verb is a kcp custom subresource
        (/clusters/{id}/apis/{group}/{version}/{resource}/{name}/{verb}) and the
        grammar provider-sdk/dataplane parses has no namespace segment, so
        dataplane.Gate addresses the object by name alone. A namespaced kind cannot
        be the target of a verb without inventing a dialect, which is exactly what
        provider-sdk/dataplane exists to stop.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: 'GreetingSpec is the desired state: the whole of it is what
            to say.'
          properties:
            message:
              description: |-
                Message is greeted back to whoever invokes the greet verb. An empty
                message is accepted by the API and reported as not Ready by the
                reconciler, so "invalid" is a status a tenant can read rather than a
                create that fails in the portal.
              maxLength: 256
              type: string
          type: object
        status:
          description: |-
            GreetingStatus is the observed state. Everything a tenant or another
            controller needs to know about this Greeting is here — Pillar 1's rule that
            durable status lives in the object.
          properties:
            conditions:
              description: |-
                Conditions follows the standard Kubernetes pattern. The quickstart sets
                exactly one, ConditionReady.
              items:
                description: Condition contains details for one aspect of the current
                  state of this API Resource.
                properties:
                  lastTransitionTime:
                    description: |-
                      lastTransitionTime is the last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      message is a human readable message indicating details about the transition.
                      This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: |-
                      observedGeneration represents the .metadata.generation that the condition was set based upon.
                      For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                      with respect to the current state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: |-
                      reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      Producers of specific condition types may define expected values and meanings for this field,
                      and whether the values are considered a guaranteed API.
                      The value should be a CamelCase string.
                      This field may not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            observedAt:
              description: |-
                ObservedAt is when the reconciler last saw this Greeting. It is the
                proof that a controller is actually running: no reconciler, no
                observedAt.
              format: date-time
              type: string
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
