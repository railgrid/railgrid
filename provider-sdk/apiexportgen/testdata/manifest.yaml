# A comment block the parser has to skip, mentioning kind: CatalogEntry.
---
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: fixture
spec:
  displayName: "Fixture"
  export:
    name: "fixture.providers.railgrid.ai"
  # spec.requires is the ONE source of the generated permission claims: one
  # claim per resource, keyed by group. The core entry carries no `group` at
  # all, a verb coordinate carries no verbs (the generated claim spells every
  # verb), and a selector narrows the claim to the objects this provider owns.
  requires:
    - resources:
        - name: secrets
          verbs: [get, list, watch]
          selector:
            matchLabels:
              railgrid.ai/owner: fixture
        - name: serviceaccounts
          verbs: [get, create]
    - group: rbac.authorization.k8s.io
      resources:
        - name: clusterroles
          verbs: [get, create]
    - provider: edges
      group: edges.railgrid.ai
      resources:
        - name: kubernetesclusters
          verbs: [get, list, watch]
        - name: kubernetesclusters/kubeconfig
