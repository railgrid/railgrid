---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: webhooks.agents.railgrid.ai
spec:
  group: agents.railgrid.ai
  names:
    kind: Webhook
    listKind: WebhookList
    plural: webhooks
    shortNames:
    - wh
    singular: webhook
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .status.lastReceived
      name: LastReceived
      type: date
    - jsonPath: .status.routes[*].name
      name: Routes
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Webhook is one inbound URL and the record of what arrived at it. It owns
          the URL (status.webhookPath, minted by the provider) and the delivery sink;
          any number of Triggers route from it by naming it in spec.webhookRef, each
          with its own filter, so one GitHub webhook can drive a reviewer on pull
          requests and a releaser on tags without pasting two URLs into GitHub.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WebhookSpec is the user-authored webhook configuration.
            properties:
              deliveryRetention:
                description: |-
                  DeliveryRetention is how many recent inbound deliveries the provider
                  keeps for this webhook — every authenticated POST to its URL, whatever
                  each routed trigger made of it — so the portal can show what came in and
                  why it did not fire, and a trigger's filter editor can test a candidate
                  filter against real traffic. Unset means the provider default (200).
                  0 keeps nothing.
                format: int32
                maximum: 1000
                minimum: 0
                type: integer
              displayName:
                description: DisplayName is a human label for the portal.
                maxLength: 100
                type: string
              recordBodies:
                description: |-
                  RecordBodies says whether the sink keeps each delivery's payload. The
                  payload is whatever the sender POSTed — for a generic webhook possibly
                  tokens or personal data — and anyone who can read the Webhook can read
                  its sink, so a webhook fed sensitive payloads can keep headers, the
                  extracted event coordinates and every route's verdict without the body.
                  Unset means true. Without bodies a replay re-feeds an empty payload and
                  the filter tester can only judge header-based keys.
                type: boolean
              source:
                description: |-
                  Source is the sender flavour: webhook (anything that can POST) or
                  github. The delivery path is the same; github lets the portal offer
                  GitHub's event catalog to the triggers routing from this webhook.
                enum:
                - webhook
                - github
                type: string
            required:
            - source
            type: object
          status:
            description: WebhookStatus is the observed webhook state.
            properties:
              conditions:
                description: |-
                  Conditions follows the standard Kubernetes conditions pattern. The
                  Validated condition reports whether the spec is usable as written —
                  see conditions.go.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastDelivery:
                description: LastDelivery summarises the most recent delivery.
                properties:
                  deliveryID:
                    description: |-
                      DeliveryID is the provider's id for the delivery, the key of its entry
                      in the sink (webhooks/{name}/deliveries/{id}).
                    type: string
                  fired:
                    description: Fired is how many of those started a run.
                    format: int32
                    type: integer
                  outcome:
                    description: |-
                      Outcome is the rollup over the routes: fired, failed, unrouted or
                      filtered.
                    type: string
                  reason:
                    description: Reason explains a delivery that did not fire.
                    type: string
                  routed:
                    description: Routed is how many triggers the delivery was routed
                      to.
                    format: int32
                    type: integer
                  time:
                    description: Time is when the delivery arrived.
                    format: date-time
                    type: string
                required:
                - outcome
                - time
                type: object
              lastReceived:
                description: |-
                  LastReceived is the most recent time an authenticated delivery reached
                  the URL. Set together with lastDelivery, and coalesced: a burst of
                  deliveries with the same outcome updates it at most once a minute.
                format: date-time
                type: string
              routes:
                description: Routes are the Triggers whose spec.webhookRef names this
                  webhook.
                items:
                  description: WebhookRoute names one Trigger routing from a webhook.
                  properties:
                    name:
                      description: Name is the Trigger's name.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              webhookPath:
                description: |-
                  WebhookPath is the hub-relative inbound endpoint. The path embeds an
                  HMAC over cluster/name, so it is the webhook's whole credential, and a
                  webhook created under a given name answers the same URL every time.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
