project_name: kubectl-railgrid
version: 2
env:
  - CGO_ENABLED=0
  - LDFLAGS={{ .Env.LDFLAGS }}

builds:
  - id: kubectl-railgrid
    dir: cmd/railgrid
    binary: kubectl-railgrid
    ldflags: "{{ .Env.LDFLAGS }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - ppc64le
    ignore:
      - goos: darwin
        goarch: ppc64le
      - goos: windows
        goarch: ppc64le

archives:
  - id: kubectl-railgrid-plugin
    ids:
    - kubectl-railgrid
    # uname-compatible names so `curl .../kubectl-railgrid_$(uname -s)_$(uname -m).tar.gz`
    # resolves: title-case OS (Linux/Darwin/Windows) and map Go's arch names to
    # what `uname -m` reports — amd64→x86_64 everywhere, arm64→aarch64 on Linux
    # (macOS keeps arm64), 386→i386.
    name_template: >-
      kubectl-railgrid_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if and (eq .Arch "arm64") (eq .Os "linux") }}aarch64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

release:
  prerelease: auto
  mode: keep-existing
  github:
    owner: railgrid

blobs:
  - provider: s3
    endpoint: https://f8f725cf687b0377b17bdea3dbee524e.r2.cloudflarestorage.com
    region: auto
    ids:
    - kubectl-railgrid-plugin
    bucket: railgrid-cli
    directory: "cli/railgrid/{{.Tag}}"

krews:
- name: railgrid
  ids:
  - kubectl-railgrid-plugin
  repository:
    owner: railgrid
    name: krew-index
    token: "{{ .Env.KREW_GITHUB_TOKEN }}"
  homepage: "https://railgrid.ai/"
  url_template: "https://downloads.railgrid.ai/cli/railgrid/{{ .Tag }}/{{ .ArtifactName }}"
  description: |
    Manage railgrid edges and workloads from the command line.
    kubectl railgrid login - Log in to a railgrid hub
    kubectl railgrid ws - Navigate kcp workspaces
    kubectl railgrid edge - Manage edges
  short_description: "Manage railgrid edges and workloads from the command line."
  skip_upload: auto
