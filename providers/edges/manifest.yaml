# edges provider — CatalogEntry (providers.railgrid.ai).
#
# Single, optional, self-contained provider for all seven edges.railgrid.ai kinds
# (KubernetesCluster, LinuxServer, MacOSServer, Service, Workload, Placement,
# Addon). It terminates the agent reverse tunnel (revdial) in-process, owns the
# API + its APIExport, runs the token/RBAC/lifecycle controllers, and proxies
# kubectl/SSH/MCP/Services through the hub backend proxy.
#
# The tunnel layer is designed to scale horizontally — each agent dials one
# replica and a Lease registry + pod-to-pod relay route requests to the tunnel's
# owner — but the chart still ships replicaCount: 1, because the reconcilers are
# not leader-elected yet (docs/roadmap/provider-contract-remediation.md §5).
---
apiVersion: providers.railgrid.ai/v1alpha1
kind: CatalogEntry
metadata:
  name: edges
spec:
  displayName: "Edges"
  description: "Connect and manage Kubernetes clusters, Linux/SSH servers, and macOS hosts as edges: kubectl and SSH where supported, host-local Services through the hub reverse tunnel, plus the edge MCP endpoint."
  vendor: "railgrid"
  version: "0.1.0"
  category: "Edges"
  iconURL: "/ui/providers/edges/icon.svg"
  # On Enable, grant the provider SA get/list/watch/proxy on the edge kinds in
  # the tenant workspace. The tunnel needs it to read the edge CR directly (join-
  # token validation + SSH creds) — without it the agent tunnel is rejected.
  edgeProxyAccess: true
  ui:
    # The provider serves its portal micro-frontend (main.js custom element) from
    # the embedded Vite bundle; the hub proxies /ui/providers/edges/* here and
    # ProviderFrame mounts <railgrid-provider-edges>. Overridden by the chart to the
    # in-cluster Service DNS name.
    url: "http://localhost:8088"
    indexPath: "/"
    # Sidebar sub-nav under the edges provider. The parent item routes to the
    # edges fleet (/providers/edges); "Workloads" routes to /providers/edges/
    # workloads, which the micro-frontend reads off subPath to render its
    # Workloads view (VirtualWorkload → Placement scheduling across edges).
    children:
      - displayName: Workloads
        builtinRoute: workloads
      - displayName: Services
        builtinRoute: services
  backend:
    # Agent ingress (/agent/*) and consumer egress (/edgeproxy/*) route through
    # the hub backend proxy at /services/providers/edges/* to this Service.
    # Overridden by the chart to the in-cluster Service DNS name.
    url: "http://localhost:8088"
    healthPath: "/healthz"
  apiExport:
    name: "edges.providers.railgrid.ai"
    # KubernetesCluster, LinuxServer, and MacOSServer come with this export (the provider
    # owns them). These claims are the additional tenant-workspace resources the
    # token/RBAC/lifecycle reconcilers create per registered edge: a namespace +
    # ServiceAccount + token/kubeconfig Secrets + ClusterRole/Binding for the
    # agent. Bound as the caller (contract 2: privileged, cross-tenant).
    permissionClaims:
      - group: ""
        resource: namespaces
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
      - group: ""
        resource: serviceaccounts
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
      - group: ""
        resource: secrets
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
      - group: rbac.authorization.k8s.io
        resource: clusterroles
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
      - group: rbac.authorization.k8s.io
        resource: clusterrolebindings
        verbs: [get, list, watch, create, update, patch, delete]
        tenantScoped: true
      # Delegated authn/authz for the data plane. The provider terminates the
      # agent tunnels and consumer egress OUTSIDE kcp's request path, so it must
      # validate presented tokens (TokenReview) and authorize the resolved
      # identity (SubjectAccessReview) against THIS consumer workspace. kcp serves
      # both on the APIExport virtual workspace scoped to the engaged cluster
      # (kcp#4279 / kcp#4280). tenantScoped: the VW confines each review to the
      # tenant's OWN workspace — it cannot reach beyond it — so this is bounded
      # (auto-acceptable, no accept-untrusted-claims). Built-in review APIs: no
      # identityHash, verb create only.
      - group: authentication.k8s.io
        resource: tokenreviews
        verbs: [create]
        tenantScoped: true
      - group: authorization.k8s.io
        resource: subjectaccessreviews
        verbs: [create]
        tenantScoped: true
  # Self-hosting: run the edges provider inside your own cluster, so agent
  # tunnels terminate there instead of on the platform. See docs/byo-providers.md.
  #
  # hub.externalURL is derived from the hub's own external URL: it is the address
  # this provider bakes into the agent kubeconfigs it mints, i.e. where agents
  # reach kcp through the hub, not where they reach this provider. Keep in
  # lockstep with deploy/chart/templates/catalogentry.yaml.
  selfHosting:
    supported: true
    chart:
      repository: "oci://ghcr.io/railgrid/charts"
      name: "railgrid-edges-provider"
    namespace: "railgrid-provider-edges"
    releaseName: "edges"
    docsURL: "https://github.com/railgrid/railgrid/blob/main/providers/edges/deploy/chart/README.md"
    requiredValues:
      - name: hub.externalURL
        value: "{{hubURL}}"
        description: >-
          Address baked into every agent kubeconfig this provider mints, so
          agents reach kcp through the hub. Derived from the hub's own external
          URL; override only if your agents reach railgrid at a different address.
