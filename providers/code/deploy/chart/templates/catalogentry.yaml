            base: *id002
            commit: *id003
            title: &id004
              type: string
              minLength: 1
              maxLength: 256
            body: &id005
              type: string
              maxLength: 32768
            repository:
              type: string
              minLength: 3
              maxLength: 201
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        schemaDigest: sha256:c389253dd92c08bf664bde0ad72d40ee61e6270919e34f8fa9f47a4b2d3fae12
        executionMode: sync
        readOnly: false
        risk: medium
        idempotency: none
        limits:
          timeoutSeconds: 180
          maxInputBytes: 65536
          maxOutputBytes: 524288
          maxResultItems: 50
        consent:
          required: false
